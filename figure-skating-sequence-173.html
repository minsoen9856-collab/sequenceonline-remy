function appliedCardsRow(e,i){
  const owner=curPlayer(); const ch=charOf(owner);
  const spectator=isSpectatorNow();
  if(e.kind==='jump'||e.kind==='combo'){
    const applied=e.cards||[];
    const canCancel = !spectator && owner && (owner.immuneTokens||0)>0;
    const shown = applied.map((c,ci)=> c.name + (canCancel && c.type==='disrupt' ? ` <button class="btn-ghost btn-sm" style="padding:2px 6px;font-size:.65rem" onclick="cancelDebuffCard(${i},${ci})">🛡️ 무효화</button>` : ''));
    let label, breakdownLine='';
    const jumpElems=[]; S.cur.plan.forEach((el,idx)=>{ if(el.kind==='jump'||el.kind==='combo') jumpElems.push(idx); });
    const jumpPos=jumpElems.indexOf(i);
    if(e.kind==='combo'){
      label = spectator ? '' : comboCode(e.jumps);
      if(!spectator){
        const subNames=['선행','연결'];
        const lines=e.jumps.map((j,k)=>{
          const charOnly=planRateBreakdown(owner,ch,j.level,j.type,k===0,k>0,e.late,true).final;
          const info=computeElementRate(owner,ch,{level:j.level,type:j.type,late:e.late,elemIndexAmongJumps:jumpPos,totalJumpElems:jumpElems.length,isCombo:true},k===0,k>0);
          let finalRate=info.rate;
          applied.forEach(c=>{ if(c.type!=='disrupt' && c.scope==='element') finalRate+=(c.delta||0); });
          if(finalRate<0)finalRate=0; if(finalRate>12)finalRate=12;
          const cardDelta=finalRate-charOnly;
          if(cardDelta===0) return '';
          return `<div class="small" style="color:var(--gold2)">${subNames[k]} ${charOnly}/12 ${cardDelta>0?'+':''}${cardDelta}/12 = ${finalRate}/12 (카드 효과 포함)</div>`;
        }).filter(Boolean);
        breakdownLine=lines.join('');
      }
    } else {
      label = spectator? '' : jCode(e.level,e.type);
      if(!spectator){
        const charOnly = planRateBreakdown(owner,ch,e.level,e.type,true,false,e.late,false).final;
        const info=computeElementRate(owner,ch,{level:e.level,type:e.type,late:e.late,elemIndexAmongJumps:jumpPos,totalJumpElems:jumpElems.length,isCombo:false},true,false);
        let finalRate=info.rate;
        applied.forEach(c=>{ if(c.type!=='disrupt' && c.scope==='element') finalRate+=(c.delta||0); });
        if(finalRate<0)finalRate=0; if(finalRate>12)finalRate=12;
        const cardDelta=finalRate-charOnly;
        if(cardDelta!==0){
          breakdownLine=`<div class="small" style="color:var(--gold2)">${charOnly}/12 ${cardDelta>0?'+':''}${cardDelta}/12 = ${finalRate}/12 (카드 효과 포함)</div>`;
        }
      }
    }
    return `<div class="slot"><div class="idx">${i+1}</div><div style="flex:1">${label}
      ${applied.length? `<div class="small">적용카드: ${shown.join(', ')}</div>` : '<div class="small">적용 카드 없음</div>'}
      ${breakdownLine}
    </div></div>`;
  }
  if(e.kind==='spin'||e.kind==='step'||e.kind==='choreo'||e.kind==='choreospin'){
    const applied=e.cards||[];
    const names={spin:(e.spinType||'스핀'),step:'StSq',choreo:'ChSq1',choreospin:'ChSp1'};
    const nlabel = spectator ? '' : names[e.kind];
    const shown = applied.map(c=> c.name);
    let breakdownLine='';
    if(!spectator){
      const goeDeltaRaw = applied.filter(c=>c.type!=='disrupt' && c.scope==='nonjump').reduce((s,c)=>s+(c.goeDelta||0),0);
      if(goeDeltaRaw!==0){
        if(e.kind==='choreo' || e.kind==='choreospin'){
          const scoreDelta=roundScore(goeDeltaRaw*0.5); // fixed ×0.5 factor
          const before=nonjumpBaseScore(e,ch);
          const after=roundScore(before+scoreDelta);
          breakdownLine=`<div class="small" style="color:var(--gold2)">${before}점 ${scoreDelta>0?'+':''}${scoreDelta}점 = ${after}점</div>`;
        } else {
          // 레벨마다 기초점이 달라서 카드 효과의 실제 점수도 레벨별로 다름 (기초점 × 0.1 팩터) - 굴리기 전엔 범위로만 안내
          const lo1 = e.kind==='spin' ? spinTypeScore(e.spinType,1) : STEP_LEVEL_SCORE[1];
          const hi1 = e.kind==='spin' ? spinTypeScore(e.spinType,4) : STEP_LEVEL_SCORE[4];
          const lo=roundScore(goeDeltaRaw*lo1*0.1), hi=roundScore(goeDeltaRaw*hi1*0.1);
          breakdownLine=`<div class="small" style="color:var(--gold2)">카드 효과 ${lo===hi?(lo>0?'+':'')+lo:'레벨별 '+(Math.min(lo,hi)>0?'+':'')+Math.min(lo,hi)+'~'+(Math.max(lo,hi)>0?'+':'')+Math.max(lo,hi)}점 (레벨은 주사위 굴려야 확정)</div>`;
        }
      }
    }
    return `<div class="slot"><div class="idx">${i+1}</div><div style="flex:1">${nlabel}
      ${applied.length? `<div class="small">적용카드: ${shown.join(', ')}</div>` : '<div class="small">적용 카드 없음</div>'}
      ${breakdownLine}
    </div></div>`;
  }
  return '';
}
function cancelDebuffCard(elemIdx,cardIdx){if(!iAmActive())return;
  const owner=curPlayer();
  if(!owner || (owner.immuneTokens||0)<=0) return;
  const elem=S.cur.plan[elemIdx];
  if(!elem || !elem.cards || !elem.cards[cardIdx]) return;
  const card=elem.cards[cardIdx];
  if(card.type!=='disrupt') return;
  elem.cards.splice(cardIdx,1);
  owner.immuneTokens--;
  if(!S.cur.log) S.cur.log=[];
  S.cur.log.push(owner.name+'가 "심판과의 포옹"으로 "'+card.name+'" 효과를 무효화했습니다.');
  render();
}
function playCard(ownerId,ci,targetId,autoTargetIdx){
  const owner=S.players.find(x=>x.id===ownerId);
  if(!(owner && owner.isAI) && MY_ID && MY_ID!==ownerId){ alert('본인의 카드만 사용할 수 있습니다. (이 카드의 주인: '+(owner||{}).name+')'); return; }
  const hand=S.phase==='short'?owner.handShort:owner.handFree;
  const card=hand[ci];
  if(!card) return;
  if(!(owner&&owner.isAI)) sfxCard();
  const target=S.players.find(x=>x.id===targetId);
  const ch=charOf(owner);
  let targetElemIdx=null;
  if(ch.banCard && card.name===ch.banCard){ alert(owner.name+'은(는) "'+card.name+'" 카드를 사용할 수 없습니다.'); return; }
  const yangC=S.players.find(pl=>pl.id!==owner.id && pl.charId==='양천사');
  if(card.type==='disrupt' && charOf(target).debuffImmune){
    hand.splice(ci,1);
    if(localPendingCard && localPendingCard.ownerId===ownerId) localPendingCard=null;
    if(yangC){ yangC.programState.otherCardsPlayed=(yangC.programState.otherCardsPlayed||0)+1; retroactiveRecalc([yangC.id]); }
    const cardTypeLabel0 = card.type==='disrupt'?'방해 카드':card.type==='buff'?'버프 카드':'중립 카드';
    if(!S.cur.log) S.cur.log=[];
    const immMsg = owner.name+'가 "'+card.name+'" 사용 → '+target.name+' (🛡️ 면역 — 효과 없음)';
    S.cur.log.push({ownerMsg:immMsg, otherMsg:immMsg, planOwnerId:targetId});
    S.log.push(immMsg);
    render();
    return;
  }
  // Determine target element for element-scope cards
  if(card.scope==='element'||card.scope==='nonjump'){
    const isSelfUse = ownerId===targetId;
    const eligible = isSelfUse
      ? S.cur.plan.map((e,idx)=>({e,idx})).filter(o=> !o.e.result && (card.scope==='element'? (o.e.kind==='jump'||o.e.kind==='combo') : ((o.e.kind==='spin'||o.e.kind==='step'||o.e.kind==='choreo'||o.e.kind==='choreospin') && !(card.excludeKinds&&card.excludeKinds.includes(o.e.kind)))))
      : S.cur.plan.map((e,idx)=>({e,idx})).filter(o=> !o.e.result);
    if(!eligible.length){ if(!(owner&&owner.isAI)) alert('적용할 대상 요소가 없습니다.'); return; }
    let idx;
    if(autoTargetIdx!==undefined && autoTargetIdx!==null){ idx=autoTargetIdx; }
    else{
      const opts=eligible.map(o=>o.idx+1).join(', ');
      const pick=prompt(target.name+'의 몇 번째 요소에 "'+card.name+'"을(를) 적용할까요? (가능: '+opts+')');
      idx=parseInt(pick)-1;
    }
    const found=eligible.find(o=>o.idx===idx);
    if(!found){ if(!(owner&&owner.isAI)) alert('취소되었습니다.'); return; }
    found.e.cards=found.e.cards||[];
    found.e.cards.push(card);
    if(card.bladeDull){
      // 회전수를 낮추면 이후의 성공률/GOE/롤 확정 등은 elem.level을 그대로 읽으니 자동으로 반영되지만,
      // "기초점"만은 예외다 - doRoll() 시점에 그 순간의 level로 미리 계산해서 elem.pendingScore에
      // 캐싱해두기 때문에, 주사위를 이미 굴린 뒤(아직 확정 전)에 이 카드를 쓰면 캐싱된 기초점이
      // 옛 레벨(다운그레이드 전) 값으로 그대로 남아 GOE만 새 레벨로 계산되는 불일치가 생긴다.
      // 그래서 이미 굴려진 요소라면 pendingScore/pendingScoreNormal을 새 레벨 기준으로 다시 계산한다.
      const recomputePending=(e,tgt)=>{
        if(e.pendingRoll===undefined) return; // 아직 안 굴렸으면 다음 doRoll에서 알아서 새 레벨로 계산됨
        const tCh=charOf(tgt);
        let scoreBase=charScoreBase(tCh,e.level,e.type);
        if(tgt.programState && tgt.programState.jumpBaseMult!==1) scoreBase=roundScore(scoreBase*tgt.programState.jumpBaseMult);
        let mult=e.late?1.1:1;
        mult*=dupPenaltyFactor(idx,-1);
        if(tCh.riskyTripleGamble && e.riskyGamble) scoreBase=roundScore(scoreBase*3);
        const finalScore=roundScore(scoreBase*mult);
        e.pendingScore=finalScore;
        e.pendingScoreNormal=(tCh.riskyTripleGamble && e.riskyGamble)?roundScore(finalScore/3):finalScore;
      };
      if(found.e.kind==='jump'){
        found.e.level=Math.max(1,(found.e.level||1)-1);
        recomputePending(found.e,target);
      }
      else if(found.e.kind==='combo'){
        (found.e.jumps||[]).forEach((j,k)=>{
          j.level=Math.max(1,(j.level||1)-1);
          if(j.pendingRoll===undefined) return;
          const tCh=charOf(target);
          let scoreBase=charScoreBase(tCh,j.level,j.type);
          if(target.programState && target.programState.jumpBaseMult!==1) scoreBase=roundScore(scoreBase*target.programState.jumpBaseMult);
          let mult=found.e.late?1.1:1;
          mult*=dupPenaltyFactor(idx,k);
          j.pendingScore=roundScore(scoreBase*mult);
        });
      }
    }
    targetElemIdx=idx;
  } else if(card.scope==='instant'){
    target.constAdj=(target.constAdj||0)+card.constDelta;
    target.constAdjCard=(target.constAdjCard||0)+card.constDelta;
  } else if(card.scope==='program'||card.scope==='firstHalf'||card.scope==='secondHalf'||card.scope==='firstlast'){
    target.programState.appliedProgramCards = target.programState.appliedProgramCards||[];
    target.programState.appliedProgramCards.push(card);
    recomputeProgramWideFields(target);
  } else if(card.scope==='equalizeConst'){ target.programState.constOverride='EQUALIZE_'+owner.id; S.players.forEach(pl=>pl.programState.constOverride='EQUALIZE_'+owner.id); retroactiveRecalc(S.players.map(pl=>pl.id)); }
  else if(card.scope==='nationEffect'){
    const affected = card.allPlayers ? S.players : S.players.filter(pl=>isKoreanChar(charOf(pl).id));
    affected.forEach(pl=>{
      if(card.constDelta){ pl.constAdj=(pl.constAdj||0)+card.constDelta; pl.constAdjCard=(pl.constAdjCard||0)+card.constDelta; }
      pl.programState.appliedProgramCards = pl.programState.appliedProgramCards||[];
      pl.programState.appliedProgramCards.push(Object.assign({},card,{scope:'program'}));
      recomputeProgramWideFields(pl);
    });
    // 이미 경기를 마친 선수(예: 마지막 순번 카드 사용 단계에서 발동)도 구성점이 소급 반영되도록
    retroactiveRecalc(affected.map(pl=>pl.id));
  }
  else if(card.scope==='vote'){
    const agree=(owner&&owner.isAI)? true : confirm(target.name+'의 "춤신춤왕" — 다른 선수 과반수가 동의합니까?');
    if(agree){ target.constAdj=(target.constAdj||0)+card.constDelta; target.constAdjCard=(target.constAdjCard||0)+card.constDelta; }
  } else if(card.scope==='draw'){
    if(owner.isAI){
      const drawn=[];
      for(let k=0;k<card.draw;k++){ if(S.deck.length){ const nc=S.deck.pop(); if(S.phase==='short') owner.handShort.push(nc); else owner.handFree.push(nc); drawn.push(nc); } }
      S.cur.lastDraw={playerId:owner.id, cards:drawn, ts:Date.now()};
    } else {
      S.cur.pendingDraw={playerId:owner.id, remaining:card.draw, drawn:[]};
    }
  } else if(card.scope==='immune'){
    owner.immuneTokens=(owner.immuneTokens||0)+1;
    if(ownerId===targetId && ch.judgeHugBonus){
      owner.constAdj=(owner.constAdj||0)+ch.judgeHugBonus;
      owner.constAdjCard=(owner.constAdjCard||0)+ch.judgeHugBonus;
    }
  } else if(card.scope==='lateOverride'){
    S.cur.plan.forEach(e=>{
      if(e.late){
        if(card.delta) e.lateOverrideDelta=(e.lateOverrideDelta||0)+(card.delta||0);
        if(card.devilsWhisper) e.devilsWhisperActive=true;
        if(card.goeOverride) e.lateOverrideGoe = Math.max(e.lateOverrideGoe||0, card.goeOverride);
      }
    });
  } else if(card.scope==='steal'){
    const targetHand = S.phase==='short'?target.handShort:target.handFree;
    const ownerHand2 = S.phase==='short'?owner.handShort:owner.handFree;
    if(targetHand.length){
      const si = Math.floor(Math.random()*targetHand.length);
      const stolen = targetHand.splice(si,1)[0];
      ownerHand2.push(stolen);
    } else if(owner.isAI){
      const drawn=[];
      for(let k=0;k<2;k++){ if(S.deck.length){ const nc=S.deck.pop(); if(S.phase==='short') owner.handShort.push(nc); else owner.handFree.push(nc); drawn.push(nc); } }
      S.cur.lastDraw={playerId:owner.id, cards:drawn, ts:Date.now()};
    } else {
      S.cur.pendingDraw={playerId:owner.id, remaining:2, drawn:[]};
    }
  } else if(card.scope==='buffCancel'){
    const progBuffIdxs=[]; (target.programState.appliedProgramCards||[]).forEach((c,i)=>{ if(c.type==='buff') progBuffIdxs.push(i); });
    const elemBuffRefs=[]; (S.cur.plan||[]).forEach((e,ei)=>{ (e.cards||[]).forEach((c,ci)=>{ if(c.type==='buff') elemBuffRefs.push({ei,ci}); }); });
    const pool=[...progBuffIdxs.map(i=>({kind:'program',i})), ...elemBuffRefs.map(r=>({kind:'elem',...r}))];
    if(pool.length){
      const pick=pool[Math.floor(Math.random()*pool.length)];
      if(pick.kind==='program'){ target.programState.appliedProgramCards.splice(pick.i,1); recomputeProgramWideFields(target); }
      else { S.cur.plan[pick.ei].cards.splice(pick.ci,1); }
    }
  }
  const isRecycled = card.type==='buff' && ownerId!==targetId && charOf(owner).recycleBuffOnOthers;
  if(isRecycled){ card.recycledMark=true; }
  else { hand.splice(ci,1); }
  if(localPendingCard && localPendingCard.ownerId===ownerId) localPendingCard=null;
  if(yangC){ yangC.programState.otherCardsPlayed=(yangC.programState.otherCardsPlayed||0)+1; retroactiveRecalc([yangC.id]); }
  const cardTypeLabel = card.type==='disrupt'?'방해 카드':card.type==='buff'?'버프 카드':'중립 카드';
  const elemNote = (targetElemIdx!==null && S.cur.plan[targetElemIdx]) ? ' ('+(targetElemIdx+1)+'번 요소)' : '';
  const suffix = (card.scope==='draw'?' (카드를 획득했습니다!)':'')+(isRecycled?' (재활용 — 손에 남음)':'');
  const maskedMsg = owner.name+'가 '+cardTypeLabel+' 사용 → '+target.name+suffix;
  const fullMsg = owner.name+'가 "'+card.name+'" 사용 → '+target.name+elemNote+suffix+(card.desc?' — '+card.desc:'');
  if(!S.cur.log) S.cur.log=[];
  S.cur.log.push({masked:maskedMsg, full:fullMsg});
  S.log.push(fullMsg);
  render();
}
function pickSpecificCardForDraw(defId,defType){
  if(!S.practiceMode && !S.gpfMode) return;
  const pd=S.cur.pendingDraw;
  if(!pd || pd.awaitingConfirm) return;
  const owner=S.players.find(p=>p.id===pd.playerId);
  if(!owner) return;
  if(ROOM && MY_ID && MY_ID!==owner.id) return;
  const defs = defType==='disrupt'?DISRUPT_DEFS:defType==='buff'?BUFF_DEFS:NEUTRAL_DEFS;
  const def=defs.find(d=>d.id===defId);
  if(!def) return;
  const nc=Object.assign({},def,{type:defType, uid:def.id+'_practice_'+Date.now()});
  if(S.phase==='short') owner.handShort.push(nc); else owner.handFree.push(nc);
  pd.drawn.push(nc);
  pd.remaining--;
  if(pd.remaining<=0){ pd.awaitingConfirm=true; }
  render();
}

function groupOccurrencesByElement(plan){
  const raw = {};
  plan.forEach((e,ei)=>{
    if(e.kind==='jump'){ const k=e.level+''+e.type; (raw[k]=raw[k]||[]).push({tag:ei+':-1', ei}); }
    else if(e.kind==='combo'){ (e.jumps||[]).forEach((j,ji)=>{ const k=j.level+''+j.type; (raw[k]=raw[k]||[]).push({tag:ei+':'+ji, ei}); }); }
  });
  const grouped = {};
  Object.keys(raw).forEach(k=>{
    const byEi = {};
    raw[k].forEach(entry=>{ (byEi[entry.ei]=byEi[entry.ei]||[]).push(entry.tag); });
    grouped[k] = Object.keys(byEi).map(ei=>({ei:parseInt(ei), tags:byEi[ei]}));
  });
  return grouped;
}
function isEffectivelySoloElement(plan,ei){
  const e=plan[ei];
  if(e.kind==='jump') return true;
  if(e.kind==='combo' && e.subResults && e.subResults[0] && e.subResults[0].success===false && !e.subResults[0].voided){
    return true; // lead failed (and wasn't itself voided) - the follow never gets a real attempt, so this combo is effectively just a failed solo try of the lead type
  }
  return false;
}
function computeTierDoublingVoids(plan, phase){
  if(phase!=='free') return [];
  const occurrences = groupOccurrencesByElement(plan);
  const doubledQuad=[], doubledTriple=[];
  Object.keys(occurrences).forEach(k=>{
    const level=parseInt(k[0]); const type=k.slice(1);
    if(level!==3 && level!==4) return;
    const list=occurrences[k]; // one entry per distinct element using this type
    if(list.length<2) return;
    const info={type, key:k, secondTags:list[1].tags, secondPlanIndex:list[1].ei};
    if(level===4) doubledQuad.push(info); else doubledTriple.push(info);
  });
  doubledQuad.sort((a,b)=>a.secondPlanIndex-b.secondPlanIndex);
  doubledTriple.sort((a,b)=>a.secondPlanIndex-b.secondPlanIndex);
  const voided=[];
  doubledQuad.slice(1).forEach(info=>info.secondTags.forEach(t=>voided.push(t))); // quad: only 1 type may be doubled
  const tripleMax = doubledQuad.length>=1 ? 1 : 2; // doubling a quad type uses up triple's budget too
  doubledTriple.slice(tripleMax).forEach(info=>info.secondTags.forEach(t=>voided.push(t)));
  return voided;
}
function computeDupPenalties(plan, phase){
  const occurrences = groupOccurrencesByElement(plan);
  const penalties=[], voided=[];
  if(phase==='short'){
    let exemptKey=null;
    const comboElem = plan.find(e=>e.kind==='combo');
    if(comboElem && comboElem.jumps && comboElem.jumps.length===2){
      const [j0,j1]=comboElem.jumps;
      if(j0 && j1 && j0.type===j1.type && j0.level===j1.level) exemptKey = j0.level+''+j0.type;
    }
    Object.keys(occurrences).forEach(k=>{
      const list=occurrences[k]; // one entry per distinct element
      const allowed = (k===exemptKey) ? 2 : 1;
      list.forEach((entry,i2)=>{ if(i2>=allowed) entry.tags.forEach(t=>voided.push(t)); }); // short: anything beyond the strict limit is void outright, no partial-credit tier
    });
  } else {
    Object.keys(occurrences).forEach(k=>{
      const list=occurrences[k]; // one entry per distinct element (a combo's own matching lead+follow count as ONE)
      list.forEach((entry,i2)=>{
        if(i2===0) return;
        if(i2>=2){ entry.tags.forEach(t=>voided.push(t)); return; } // exceeds the legal max of 2 distinct elements - void outright
        const isActingSolo = ei=>isEffectivelySoloElement(plan,ei); // literal solo, OR a combo whose lead already failed (follow never got a real chance)
        if(isActingSolo(list[0].ei) && isActingSolo(entry.ei)){
          entry.tags.forEach(t=>penalties.push(t)); // both are solo (literally, or a combo whose lead failed) - legal repeat, scores at 80%
        }
        // otherwise at least one side is a genuinely active combo (lead succeeded or not yet resolved) - fully recognized, no penalty at all
      });
    });
  }
  return {penalties, voided};
}
function dupPenaltyFactor(idx,subIdx){
  const dp = computeDupPenalties(S.cur.plan, S.phase);
  return dp.penalties.includes(idx+':'+subIdx) ? 0.8 : 1;
}
function isDupVoided(idx,subIdx){
  const dp = computeDupPenalties(S.cur.plan, S.phase);
  const tierVoids = computeTierDoublingVoids(S.cur.plan, S.phase);
  return dp.voided.includes(idx+':'+subIdx) || tierVoids.includes(idx+':'+subIdx);
}

function isPassiveNullified(ch){
  return !!(ch.passiveNullifiedBy && S && S.players && S.players.some(pl=>charOf(pl).name===ch.passiveNullifiedBy));
}
function computeElementRate(p,ch,elemInfo,isLead,isFollow){
  const {level,type,late,elemIndexAmongJumps,totalJumpElems,isCombo}=elemInfo;
  let base = isFollow? comboRate(level,type,ch.div) : soloRate(level,type,ch.div);
  // locked rates override (character)
  let locked=null;
  (ch.locked||[]).forEach(l=>{ if(l.level===level&&l.type===type) locked=l.rate; });
  let rate = locked!==null? locked : base;
  let negSum=0, posSum=0;
  function bump(d){ rate+=d; if(d<0) negSum+=d; else posSum+=d; }
  if(p.shortRank1PenaltyActive) bump(p.shortRank1PenaltyActive);
  const nullified = isPassiveNullified(ch);
  if(locked===null){
    if(!nullified) (ch.mods||[]).forEach(m=>{
      let ok=true;
      if(m.types && !m.types.includes(type)) ok=false;
      if(m.excludeTypes && m.excludeTypes.includes(type)) ok=false;
      if(m.levels && !m.levels.includes(level)) ok=false;
      if(m.exact && !(m.exact.level===level && m.exact.type===type)) ok=false;
    if(m.excludeExact && m.excludeExact.some(ex=>ex.level===level && ex.type===type)) ok=false;
      if(m.comboLeadOnly && !isLead) ok=false;
      if(m.comboFollowOnly && !isFollow) ok=false;
      if(m.soloOnly && isCombo) ok=false;
      if(ok) bump(m.delta);
    });
    // twin bonus
    if(ch.twinOf && S && S.players && S.players.some(pl=>pl.id!==p.id && charOf(pl).id===ch.twinOf)) bump(2);
    // program state deltas
    const ps=p.programState;
    if(ps.allDelta) bump(ps.allDelta);
    if(elemIndexAmongJumps < Math.ceil(totalJumpElems/2)) { if(ps.firstHalfDelta) bump(ps.firstHalfDelta); }
    else { if(ps.secondHalfDelta) bump(ps.secondHalfDelta); }
    if((elemIndexAmongJumps===0 || elemIndexAmongJumps===totalJumpElems-1)) { if(ps._firstLast) bump(ps._firstLast); }
    if(ps.doHaJinHit) bump(-2);
    if(ps.levelCapDelta && level<=ps.levelCapDelta.maxLevel) bump(ps.levelCapDelta.delta);
    if(ps.rinkPenalty) bump(-ps.rinkPenalty);
    // 알리사 리우 아우라: 바로 앞/뒤 순번 선수는 -1/12
    if(typeof S!=='undefined' && S && S.order){
      const myIdx=S.order.indexOf(p.id);
      if(myIdx>=0){
        [S.order[myIdx-1], S.order[myIdx+1]].forEach(nid=>{
          if(!nid) return;
          const neighbor=S.players.find(pl=>pl.id===nid);
          if(neighbor && charOf(neighbor).neighborDebuff) bump(-charOf(neighbor).neighborDebuff);
        });
      }
    }
    // cascading fails
    if(ch.cascadeFirstFail && S && S.cur && S.cur.firstJumpFailed) bump(-1);
    if(ch.cascadeLastFail && S && S.cur && S.cur.lastFailStreak>0) bump(-ch.cascadeLastFail);
    // favorite skater bonus: +1/12 when the device's own logged-in profile has this exact
    // character set as their favorite, and this device actually controls this player's seat
    // (so one person's favorite pick never leaks a bonus onto someone else's rolls).
    if(myProfile && myProfile.favoriteSkater && myProfile.favoriteSkater===ch.id && (!ROOM || MY_ID===p.id)) bump(1);
    // 📈 선수 커리어 모드: 시즌을 거치며 쌓인 성장 보너스 (커리어 게임에서만 p.careerGrowthBonus가 세팅됨)
    if(p.careerGrowthBonus) bump(p.careerGrowthBonus);
    // 🏅 정복(같은 캐릭터로 그 점프 50회 성공): 성공률 +1/12
    { const cb=conquerRateBonus(p, ch, level, type); if(cb) bump(cb); }
  }
  // late line
  let lateMultUsed=2;
  if(late){
    bump(-1);
    // check late override card on this element
  }
  if(rate<0) rate=0; if(rate>12) rate=12;
  return {rate, lateMult:lateMultUsed, lockedUsed:locked!==null, negSum, posSum, preCardBase:(locked!==null?locked:base)};
}

// 악마의 속삭임: 이 요소에 적용된 경우, 음수 보정(캐릭터/프로그램/후반가산점/다른 방해카드 + 이 카드 자체의 -1×중첩)은
// 뒤집기(12-x) 전에 먼저 반영하고, 양수 보정(캐릭터 보너스/즐겨찾기/버프카드)은 뒤집은 뒤에 더한다.
function devilsWhisperRate(elem, info, cards){
  const negCard = (cards||[]).filter(c=>c.scope==='element' && (c.delta||0)<0).reduce((s,c)=>s+c.delta,0);
  const posCard = (cards||[]).filter(c=>c.scope==='element' && (c.delta||0)>=0).reduce((s,c)=>s+c.delta,0);
  let negBase = info.preCardBase + info.negSum + negCard;
  if(negBase<0) negBase=0; if(negBase>12) negBase=12;
  let rate = (12-negBase) + info.posSum + posCard;
  if(rate<0) rate=0; if(rate>12) rate=12;
  return rate;
}
function isElementRevealed(e,i){

  // 오염시켜 조명 계산이 죽는 것이 가장 유력한 원인이다. 반사 효과보다 "보이는 것"이 우선.

  function buildLights(){
    // 조명은 넉넉하게. 이전 빌드에서 조명이 재질에 전혀 닿지 않아 전부 새까맣게

    scene.add(new THREE.AmbientLight(0x93a8c8, 0.30));

    key.position.set(9, 18, 8);
    key.castShadow = true;
    key.shadow.mapSize.set(1024,1024);
    // 그림자 카메라는 선수 주변만 좁게 잡는다. 범위가 넓으면 깊이 정밀도가 떨어져
    // 거대한 빙판 평면이 자기 자신에게 그림자를 드리우고(shadow acne) 전체가 새까매진다.
    key.shadow.camera.near = 8; key.shadow.camera.far = 36;

  var RINK = { L:60, W:30 };
  // 모든 점프가 "얼굴 방향과 무관하게" 실제로 이동하는 고정된 기준 방향.
  // (진입 시 몸의 방향(baseYaw)과는 별개 — baseYaw는 후진 진입 점프에서 180도가

  var TRAVEL_BEARING = Math.PI * 0.18;

  // 캔버스로 ISU 규격 링크 마킹 + 은은한 조명 반사를 구워서 얼음에 입힌다.
  // (실시간 환경맵 반사는 이전 빌드에서 렌더러를 통째로 죽인 원인이라 다시 안 쓴다 —
  //  대신 "미리 그려둔" 정적 반사 하이라이트로 같은 느낌만 안전하게 낸다)
  function buildIceTexture(){
    var W=1024, H=512;
    var cv = document.createElement('canvas'); cv.width=W; cv.height=H;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#eef4fb'; ctx.fillRect(0,0,W,H);
    // 천장 조명이 얼음에 만드는 길쭉한 반사 하이라이트 (고정으로 구워둠)
    for (var i=0;i<8;i++){
      var gx = (i+0.5)*(W/8);
      var g = ctx.createLinearGradient(gx-30,0,gx+30,0);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(0.5,'rgba(255,255,255,0.55)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(gx-30,0,60,H);
    }
    // ISU 링크 마킹 — 센터라인 + 센터서클
    ctx.strokeStyle = 'rgba(70,110,170,0.45)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W/2,H/2,70,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W/4,H/2,46,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W*3/4,H/2,46,0,Math.PI*2); ctx.stroke();
    // 얼음 특유의 미세한 스크래치 텍스처
    ctx.strokeStyle = 'rgba(180,200,225,0.18)';
    for (var s=0;s<260;s++){
      var sx=Math.random()*W, sy=Math.random()*H, len=10+Math.random()*40, ang=Math.random()*Math.PI;
      ctx.lineWidth = 0.6+Math.random()*0.8;
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+Math.cos(ang)*len, sy+Math.sin(ang)*len); ctx.stroke();
    }
    var tex = new THREE.CanvasTexture(cv);
    return tex;
  }

  // 보드 위 스폰서 광고판 느낌의 컬러 블록 (실제 방송에서 보이는 보드 배너를 흉내)
  function buildBoardTexture(seed){
    var W=1024, H=96;
    var cv = document.createElement('canvas'); cv.width=W; cv.height=H;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#f3f6fb'; ctx.fillRect(0,0,W,H);
    var palette = ['#1d59c0','#c9a227','#1a2547','#2f9670','#c0455a'];
    var x = 0;
    while (x < W){
      var w = 110 + Math.random()*90;
      ctx.fillStyle = palette[Math.floor(Math.random()*palette.length)];
      ctx.fillRect(x, H*0.18, Math.min(w, W-x), H*0.64);
      x += w + 14;
    }
    return new THREE.CanvasTexture(cv);
  }

  function buildRink(){
    var iceTex = buildIceTexture();
    iceTex.wrapS = iceTex.wrapT = THREE.RepeatWrapping;
    // emissive를 약간 넣어 어떤 조명/그림자 문제가 생겨도 빙판이 완전히 검게 죽지 않게 한다.
    var iceMat = new THREE.MeshPhysicalMaterial({
      color:0xffffff, map:iceTex, roughness:0.30, metalness:0.0,
      clearcoat:0.4, clearcoatRoughness:0.20, reflectivity:0.28,
      emissive:0x2a3a52, emissiveIntensity:0.24
    });
    var ice = new THREE.Mesh(new THREE.PlaneGeometry(RINK.L, RINK.W), iceMat);
    ice.rotation.x = -Math.PI/2;
    ice.receiveShadow = true;
    scene.add(ice);

    var adTex = buildBoardTexture();
    var boardMat = new THREE.MeshStandardMaterial({ color:0xffffff, map:adTex, roughness:0.55, emissive:0x28303d, emissiveIntensity:0.22 });
    var kickMat  = new THREE.MeshStandardMaterial({ color:0x1d59c0, roughness:0.5, emissive:0x0d2450, emissiveIntensity:0.35 });
    function board(w,x,z,ry){
      var g = new THREE.Group();
      var m = new THREE.Mesh(new THREE.BoxGeometry(w,1.1,0.22), boardMat);
      m.position.y = 0.55; m.receiveShadow = true; g.add(m);
      var k = new THREE.Mesh(new THREE.BoxGeometry(w,0.26,0.24), kickMat);
      k.position.y = 0.13; g.add(k);
      g.position.set(x,0,z); g.rotation.y = ry; return g;
    }
    scene.add(board(RINK.L,0, RINK.W/2,0));
    scene.add(board(RINK.L,0,-RINK.W/2,0));
    scene.add(board(RINK.W, RINK.L/2,0,Math.PI/2));
    scene.add(board(RINK.W,-RINK.L/2,0,Math.PI/2));
  }

  // 관중석 — 몸통 + 머리를 따로 둔 InstancedMesh 두 개로 "사람 실루엣"이 나오게 한다.
  // (몸통 박스 하나만 쓰면 체크무늬처럼 뭉개져 보인다는 피드백을 반영)
  function buildCrowd(){
    var COUNT = 2200;
    var bodyMesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.40,0.58,0.34),
      new THREE.MeshStandardMaterial({ roughness:0.9, emissive:0x10151f, emissiveIntensity:0.32 }), COUNT);
    var headMesh = new THREE.InstancedMesh(
      new THREE.SphereGeometry(0.14,8,6),
      new THREE.MeshStandardMaterial({ roughness:0.7, emissive:0x2a1f18, emissiveIntensity:0.4 }), COUNT);
    var d = new THREE.Object3D(), col = new THREE.Color(), skin = new THREE.Color(), i = 0;
    for (var r=0; r<13 && i<COUNT; r++){
      var depth = 2.4 + r*0.86, hh = 1.0 + r*0.50;
      for (var side=-1; side<=1 && i<COUNT; side+=2){
        var n = 60;
        for (var k=0; k<n && i<COUNT; k++){
          var t = (k+0.5)/n - 0.5;
          var jx = (Math.random()-0.5)*0.22, jz=(Math.random()-0.5)*0.15;
          var bx = t*RINK.L*0.95+jx, bz = side*(RINK.W/2+depth)+jz;
          var sc = 0.84+Math.random()*0.32;
          d.position.set(bx, hh, bz);
          d.rotation.y = (Math.random()-0.5)*0.5;
          d.scale.set(sc,sc,sc);
          d.updateMatrix(); bodyMesh.setMatrixAt(i, d.matrix);
          d.position.set(bx, hh+0.44*sc, bz);
          d.scale.set(sc,sc,sc);
          d.updateMatrix(); headMesh.setMatrixAt(i, d.matrix);

          var v = Math.random();
          if (v>0.93) col.setHSL(Math.random(),0.55,0.55);
          else if (v>0.8) col.setHSL(0.58+Math.random()*0.08,0.28,0.34);
          else col.setHSL(0.62,0.15,0.10+Math.random()*0.12);
          bodyMesh.setColorAt(i, col);
          skin.setHSL(0.07+Math.random()*0.04, 0.35, 0.35+Math.random()*0.25);
          headMesh.setColorAt(i, skin);
          i++;
        }
      }
    }
    [bodyMesh, headMesh].forEach(function(m){
      m.count = i; m.instanceMatrix.needsUpdate = true;
      if (m.instanceColor) m.instanceColor.needsUpdate = true;
      scene.add(m);
    });
  }

  // -------------------------------------------------------------------------
  // 선수 리그 — GLTF 휴머노이드 본 이름 규약과 동일한 계층
  // -------------------------------------------------------------------------
  // ---------------------------------------------------------------------
  // 3D 선수 모델 — 게임의 캐릭터 일러스트와 같은 디자인으로 만든다.
  // (실버블루 드레스 / 네이비 수트, 얼굴·헤어·스케이트 부츠와 날까지)
  // 본 계층 이름은 GLTF 휴머노이드 규약과 동일해서, 나중에 실제 GLB를 끼우면
  // 포즈·애니메이션 코드를 그대로 재사용할 수 있다.
  // ---------------------------------------------------------------------
  // =========================================================================
  // 3D 선수 모델 — 전면 재설계
  // -------------------------------------------------------------------------
  // 이전 버전의 문제: 원통 하나짜리 몸통 + 팔다리를 이어붙인 "도형 인형" 구조라
  // 목/어깨 위치 계산이 어긋나기 쉬웠고(실제로 두 번 어긋났었다), 비율도 인체와
  // 멀었다. 이번엔 좌표를 먼저 종이 위에서(주석으로) 계산해 확정한 뒤 코드로
  // 옮겼다 — hips 로컬 Y 기준으로:
  //   골반 0.00 → 허리(가장 좁음) 0.18 → 가슴 0.36 → 어깨 0.47 → 목밑동 0.50
  //   → 머리 중심 0.63 (목/어깨가 반드시 머리보다 아래에 오도록 검증된 값)
  // 다리는 허벅지 0.46 + 정강이 0.42로 길게 잡아 피겨 선수 비율(짧은 몸통,
  // 긴 다리)을 낸다.
  // =========================================================================
  // =========================================================================
  // GLB 스켈레톤 로더 (Mixamo 등 외부 리깅 모델용) — 1단계: 로드/검증만.
  // 지금은 primitive rig(buildSkater)를 그대로 쓰고, 이 함수는 GLB가 정상적으로
  // 불러와지는지 + 필요한 본이 다 있는지만 콘솔로 확인하는 용도다. 실제로 skater를
  // 이 모델로 교체하려면 리타겟팅(내 rig의 회전값 관례 ↔ Mixamo T포즈 관례 변환)이
  // 먼저 되어 있어야 하는데, 그건 아직 안 돼 있다 — 렌더링 확인 없이 각도 매핑을
  // 밀어붙이면 지금까지처럼 또 몇 번을 왔다갔다 할 게 뻔해서, 로딩 파이프라인부터
  // 검증하고 다음 단계로 넘어가는 게 맞다고 판단했다.
  const MIXAMO_BONE_NAMES = ['Hips','Spine','Spine1','Spine2','Neck','Head',
    'LeftShoulder','LeftArm','LeftForeArm','LeftHand',
    'RightShoulder','RightArm','RightForeArm','RightHand',
    'LeftUpLeg','LeftLeg','LeftFoot','LeftToeBase',
    'RightUpLeg','RightLeg','RightFoot','RightToeBase'];
  function loadSkaterGLB(url, onLoaded, onError){
    if(!window.THREE || !THREE.GLTFLoader){ onError && onError(new Error('GLTFLoader not available')); return; }
    const loader = new THREE.GLTFLoader();
    loader.load(url, (gltf)=>{
      const bones = {};
      gltf.scene.traverse(o=>{ if(o.isBone || o.type==='Bone') bones[o.name]=o; });
      const missing = MIXAMO_BONE_NAMES.filter(n=>!bones[n]);
      console.log('[GLB] loaded', url);
      console.log('[GLB] bones found:', Object.keys(bones).length, bones);
      if(missing.length) console.warn('[GLB] missing expected bones:', missing);
      else console.log('[GLB] all expected Mixamo bones present ✓');
      const meshes=[]; gltf.scene.traverse(o=>{ if(o.isSkinnedMesh || o.isMesh) meshes.push(o.name||'(unnamed)'); });
      console.log('[GLB] meshes:', meshes);
      onLoaded && onLoaded(gltf, bones);
    }, undefined, (err)=>{
      console.error('[GLB] load failed', err);
      onError && onError(err);
    });
  }

  // =========================================================================
  function buildSkater(){
    // 재질: 예전엔 전신에 clearcoat(광택 코팅)+emissive(자체 발광)를 걸어놔서 사탕/설탕공예처럼
    // 반들거리고 안에서 빛나는 것처럼 보였다. 사람 피부·직물은 매트에 가깝고 스스로 빛나지
    // 않는다 — clearcoat는 실제로 광택 코팅(락커/사탕 표면 등)을 흉내내는 속성이라 피부/옷에
    // 걸어두면 그 자체로 "매끈한 사탕 표면"처럼 보이는 게 당연했다. roughness를 올리고
    // clearcoat/emissive를 걷어내거나 거의 0에 가깝게 낮춰서 자연광을 받는 매트한 재질로 바꾼다.
    var M = {
      skin:    new THREE.MeshPhysicalMaterial({ color:0xf2cda6, roughness:0.82, metalness:0, clearcoat:0, emissive:0x1a130c, emissiveIntensity:0.03 }),
      hair:    new THREE.MeshPhysicalMaterial({ color:0x6b4a32, roughness:0.62, metalness:0.02, clearcoat:0.08, clearcoatRoughness:0.7, emissive:0x0b0805, emissiveIntensity:0.03 }),
      top:     new THREE.MeshPhysicalMaterial({ color:0x6fa8dc, roughness:0.58, metalness:0.02, clearcoat:0.08, clearcoatRoughness:0.65, emissive:0x0a0f1c, emissiveIntensity:0.03 }),
      bottom:  new THREE.MeshStandardMaterial({ color:0xf2cda6, roughness:0.70, emissive:0x1a130c, emissiveIntensity:0.03 }), // 여자: 스킨톤 타이츠 / 남자: setDivision에서 팬츠색으로
      accent:  new THREE.MeshPhysicalMaterial({ color:0xeaf4fd, roughness:0.35, metalness:0.25, clearcoat:0.15, emissive:0x141c28, emissiveIntensity:0.04 }),
      glove:   new THREE.MeshStandardMaterial({ color:0xeaf4fd, roughness:0.58, emissive:0x161c26, emissiveIntensity:0.03 }),
      boot:    new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.55, emissive:0x14161c, emissiveIntensity:0.03 }),
      blade:   new THREE.MeshStandardMaterial({ color:0xd7dee8, roughness:0.25, metalness:0.6, emissive:0x22262c, emissiveIntensity:0.04 }),
      dark:    new THREE.MeshStandardMaterial({ color:0x2a2018, roughness:0.65, emissive:0x090705, emissiveIntensity:0.03 })
    };

    function cyl(a,b,h,mat,seg){ var m=new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,seg||18), mat); m.castShadow=true; return m; }
    function sph(r,mat,seg){ var m=new THREE.Mesh(new THREE.SphereGeometry(r,seg||18,(seg||18)-4), mat); m.castShadow=true; return m; }
    function box(w,h,d,mat){ var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.castShadow=true; return m; }
    // 관절 이음새 — 인접 세그먼트 반지름과 비슷한 크기로만 살짝 끼워 매끄럽게 잇는다
    // (이전 버전은 이 구가 상대적으로 너무 커서 위치까지 어긋나자 "혹"처럼 보였다)
    function joint(r,mat){ return sph(r,mat,12); }
    // 관절구는 인접한 팔다리 세그먼트 끝 반지름과 거의 같게 맞춰놨지만, 완전한 구는 어느 각도에서
    // 봐도 "둥근 알"로 보여서 그 자체가 구체관절인형처럼 읽히는 원인 중 하나다. 팔다리 축 방향으로
    // 살짝 늘여서(캡슐에 가깝게) 원통형 팔다리의 연장처럼 보이게 하고, 반지름도 약간 줄여서
    // 바깥으로 튀어나온 "구슬"처럼 보이지 않고 안쪽으로 맞물리게 한다.
    function slimJoint(r,mat,stretch){ var m=joint(r*0.86,mat); m.scale.set(1, stretch||1.35, 1); return m; }

    // ---- 본 계층 (GLTF 휴머노이드 규약과 동일) ----
    var rt    = new THREE.Group(); rt.name='root';
    var hips  = new THREE.Group(); hips.name='hips';  hips.position.y=0.95; rt.add(hips);
    var spine = new THREE.Group(); spine.name='spine'; spine.position.y=0.18; hips.add(spine);
    var chest = new THREE.Group(); chest.name='chest'; chest.position.y=0.24; spine.add(chest);   // hips-local 0.42
    var neck  = new THREE.Group(); neck.name='neck';   neck.position.y=0.08;  chest.add(neck);    // hips-local 0.50
    var head  = new THREE.Group(); head.name='head';   head.position.y=0.13;  neck.add(head);     // hips-local 0.63

    // ---- 몸통: 골반(hips 고정) + 상체(spine에서 회전) 두 조각으로 나눈다 ----
    // 카멜/레이백처럼 상체를 굽히는 포즈에서, 회전하는 건 spine 위쪽뿐이고 골반은
    // 다리와 함께 제자리에 있어야 한다. 예전엔 몸통 전체를 통으로 hips에 붙여서
    // 상체를 굽혀도 몸통 껍데기가 서 있었고(→ 목이 분리되어 보임), 그걸 통으로
    // spine에 옮기니 이번엔 골반까지 같이 스윙해 다리와 떨어져 보였다. 그래서 분리.
    // 골반 — hips 기준 0.00~0.18 (다리와 항상 붙어있는 부분)
    var pelvisProfile = [
      new THREE.Vector2(0.100, 0.00),
      new THREE.Vector2(0.088, 0.08),
      new THREE.Vector2(0.072, 0.18)
    ];
    var pelvis = new THREE.Mesh(new THREE.LatheGeometry(pelvisProfile, 32), M.top);
    pelvis.castShadow = true;
    hips.add(pelvis);
    // 상체 — spine 기준 0.00~0.32 (= hips 기준 0.18~0.50). spine과 함께 회전한다.
    var torsoProfile = [
      new THREE.Vector2(0.072, 0.00),   // 허리 — 가장 좁음 (골반 윗면과 이어짐)
      new THREE.Vector2(0.082, 0.10),
      new THREE.Vector2(0.098, 0.18),   // 가슴
      new THREE.Vector2(0.085, 0.26),
      new THREE.Vector2(0.048, 0.32)    // 목밑동 — 급격히 좁아짐
    ];
    var torso = new THREE.Mesh(new THREE.LatheGeometry(torsoProfile, 32), M.top);
    torso.castShadow = true;
    spine.add(torso);
    // 허리 관절 이음새 — 골반과 상체가 꺾일 때 틈이 보이지 않게 메워준다
    var waistJoint = sph(0.074,M.top,16); waistJoint.scale.set(1,1.2,0.9); spine.add(waistJoint);

    // 하의(타이츠/팬츠) — 골반~허리 구간을 겹쳐 감싸서 상/하의가 갈리는 라인을 만든다
    // (골반 쪽 옷이므로 hips에 그대로 둔다)
    var bottomProfile = [
      new THREE.Vector2(0.104, -0.02),
      new THREE.Vector2(0.096, 0.02),
      new THREE.Vector2(0.084, 0.10),
      new THREE.Vector2(0.075, 0.19)
    ];
    var bottomWrap = new THREE.Mesh(new THREE.LatheGeometry(bottomProfile, 32), M.bottom);
    bottomWrap.castShadow = true;
    hips.add(bottomWrap);

    // 허리 장식 벨트 (대비색 트림)
    var belt = cyl(0.083,0.086,0.035,M.accent); belt.position.y=0.185; hips.add(belt);

    // ---- 스커트 (여자싱글만 보임) ----
    // ConeGeometry는 기본값으로 이미 끝점(apex)이 +y(위), 넓은 밑면이 -y(아래)를 향한다 —
    // 즉 허리(좁음)가 위, 치마단(넓음)이 아래인 정상 치마 모양 그대로다. 예전에 rotation.x=PI로
    // 180도 뒤집어서 허리가 넓고 치마단이 뾰족하게 모이는 "뒤집힌 치마"가 되고 있었다.
    var skirt = new THREE.Mesh(new THREE.ConeGeometry(0.30,0.26,32,1,true), M.top);
    skirt.position.y = 0.05; skirt.material.side = THREE.DoubleSide;
    skirt.castShadow = true; hips.add(skirt);

    // ---- 목 ----
    var neckM = cyl(0.036,0.044,0.10,M.skin,24); neckM.position.y=0.045; neck.add(neckM);
    // 승모근 — 목이 몸통에 "꽂힌" 게 아니라 어깨로 흘러내리듯 이어지게
    var trap = new THREE.Mesh(new THREE.LatheGeometry([
      new THREE.Vector2(0.045, 0.06), new THREE.Vector2(0.085, 0.02), new THREE.Vector2(0.125, -0.02)
    ], 24), M.top); trap.castShadow=true; neck.add(trap);

    // ---- 머리 / 얼굴 ----
    // 두상: 위는 둥글고 아래로 갈수록 좁아지는 계란형 + 턱 라인 + 광대 볼륨 + 귀
    var skull = sph(0.098,M.skin,32); skull.scale.set(0.92,1.10,0.94); head.add(skull);
    var jaw = sph(0.080,M.skin,28); jaw.scale.set(0.80,0.70,0.82); jaw.position.set(0,-0.065,0.018); head.add(jaw);
    var face  = sph(0.088,M.skin,28); face.scale.set(0.88,0.96,0.58); face.position.set(0,-0.010,0.040); head.add(face);
    [-1,1].forEach(function(sg){
      var cheek=sph(0.034,M.skin,16); cheek.scale.set(1,0.85,0.7); cheek.position.set(sg*0.058,-0.028,0.052); head.add(cheek);
      var ear=sph(0.024,M.skin,14); ear.scale.set(0.45,1,0.7); ear.position.set(sg*0.092,-0.004,-0.006); head.add(ear);
      var eye=sph(0.014,M.dark,10); eye.position.set(sg*0.036,0.006,0.084); head.add(eye);
      var brow=box(0.036,0.006,0.008,M.hair); brow.position.set(sg*0.037,0.032,0.088); brow.rotation.z=sg*-0.12; head.add(brow);
    });
    var nose = sph(0.014,M.skin,10); nose.scale.set(0.7,1,1.1); nose.position.set(0,-0.012,0.098); head.add(nose);
    var mouth = box(0.028,0.005,0.006,M.dark); mouth.position.set(0,-0.048,0.086); head.add(mouth);
    // 헤어 — 정수리를 덮는 캡 + 앞머리 볼륨 + 옆머리 두 덩어리 + 뒷머리로 층을 만든다
    var hairCap = sph(0.106,M.hair,32); hairCap.scale.set(0.98,1.00,1.00); hairCap.position.set(0,0.024,-0.012); head.add(hairCap);
    var fringe  = sph(0.078,M.hair,24); fringe.scale.set(1.18,0.55,0.75); fringe.position.set(0,0.070,0.052); head.add(fringe);
    [-1,1].forEach(function(sg){
      var sideH=sph(0.050,M.hair,18); sideH.scale.set(0.7,1.25,0.95); sideH.position.set(sg*0.084,0.012,-0.012); head.add(sideH);
    });
    var hairBack = sph(0.075,M.hair,24); hairBack.scale.set(0.95,1.25,0.85); hairBack.position.set(0,-0.01,-0.075); head.add(hairBack);
    var bun = sph(0.050,M.hair,18); bun.position.set(0,0.052,-0.095); head.add(bun);

    // ---- 근육 테이퍼가 있는 사지 (선반 프로파일) ----
    // 원통 대신 위아래 두께가 다르고 중간이 살짝 불룩한 실루엣으로 깎는다.
    function limb(profile, mat){ var m=new THREE.Mesh(new THREE.LatheGeometry(profile,24), mat); m.castShadow=true; return m; }
    function tapered(r0, rMid, r1, len, mat){
      return limb([ new THREE.Vector2(r0,0), new THREE.Vector2(rMid,-len*0.40), new THREE.Vector2(r1*1.08,-len*0.85), new THREE.Vector2(r1,-len) ], mat);
    }

    // ---- 팔 ----
    function arm(side){
      var sg = side==='L'?1:-1;
      var up = new THREE.Group(); up.name='upperArm'+side; up.position.set(sg*0.118,0.040,0); chest.add(up);
      // 삼각근 — 어깨가 몸통에서 바로 꺾이지 않고 둥글게 감싸도록
      var delt = sph(0.052,M.top,20); delt.scale.set(1,0.85,0.95); delt.position.set(sg*0.006,0.012,0); up.add(delt);
      var um = tapered(0.040,0.038,0.030,0.25,M.top); up.add(um);
      var fo = new THREE.Group(); fo.name='foreArm'+side; fo.position.y=-0.25; up.add(fo);
      fo.add(slimJoint(0.031,M.skin));
      var fm = tapered(0.031,0.032,0.021,0.23,M.skin); fo.add(fm);
      var hand = new THREE.Group(); hand.name='hand'+side; hand.position.y=-0.23; fo.add(hand);
      // 손 — 납작한 손바닥 + 엄지 (구 하나로 뭉뚱그리지 않는다)
      var palm = box(0.046,0.062,0.022,M.glove); palm.position.set(0,-0.030,0); hand.add(palm);
      var fingers = box(0.044,0.040,0.020,M.glove); fingers.position.set(0,-0.078,0); hand.add(fingers);
      var thumb = sph(0.012,M.glove,10); thumb.scale.set(0.8,1.5,0.8); thumb.position.set(sg*-0.026,-0.030,0.006); hand.add(thumb);

  // -------------------------------------------------------------------------

  var MU = THREE.MathUtils;
  // 이즈 커브 — 구체관절인형처럼 등속으로 뚝뚝 끊겨 움직이는 걸 막기 위한 가속/감속 곡선.
  // 사람 관절은 절대 일정한 속도로 움직이지 않는다: 시작은 천천히 가속하고, 멈추기 직전엔
  // 감속한다. easeInOut은 대칭적인 가감속, easeOutBack은 도착 직전 살짝 오버슈트했다가
  // 제자리로 돌아오는 "정착(settle)" 느낌을 준다 — 포즈가 딱 멈추는 순간에 쓰면 자연스럽다.
  function easeInOutCubic(x){ x=Math.max(0,Math.min(1,x)); return x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }
  function easeOutBack(x){
    x=Math.max(0,Math.min(1,x));
    var c1=1.70158, c3=c1+1;
    return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2);

  // 먼저 움직이기 시작하고 팔다리가 살짝 뒤늦게 따라오는 자연스러운 순차 동작(follow-through)을 만든다.

    r.armR.upper.rotation.set(0,0, 0.28); r.armR.fore.rotation.set(0,0, 0.10);

    r.legR.upper.rotation.set(0,0,0); r.legR.lower.rotation.set(0,0,0); r.legR.foot.rotation.set(0,0,0);

  // 공중 조인 자세 — 4S 공중 프레임(1000097335.png)에서 확인한 실제 모양:

    r.armL.upper.rotation.x = MU.lerp(-0.15, -0.22, tuck);   // 거의 수직 유지
    r.armR.upper.rotation.x = MU.lerp(-0.15, -0.22, tuck);
    r.armL.fore.rotation.x  = MU.lerp(0,     -2.35, tuck);   // 아래팔을 가슴 위로 접어 올림

  var cur = null;   // { kind, def, rot, phases, i, t, y, vy, spin, spinRate, v0 }

  function makeJump(type, level){
    var def = JUMP_DB[type] || JUMP_DB.T;
    var rotations = (level||3) + (def.extraHalf ? 0.5 : 0);
    var v0 = ({2:0.52,3:0.68,4:0.80}[level] || 0.68) * 4.9 * (def.arc||1);
    var flight = 2*v0/9.8;
    var air = 0.10;
    var rotDur = Math.max(0.18, flight - air);
    var eff = air*0.5 + rotDur*(1 - 0.15*0.45*0.5);
    return {
      kind:'jump', def:def, rot:rotations, v0:v0,
      travel: (def.travel||2.2), flight: flight,
      spinRate: (rotations*Math.PI*2)/eff,
      phases:[['APPROACH',0.85],['TAKEOFF',0.26],['AIRBORNE',air],['ROTATION',rotDur],['LANDING',0.32],['EXIT',1.30]]
    };
  }
  function makeSpin(spinType){
    spinType = spinType || 'FCSp';
    // 플라잉 카멜은 이름 그대로 "날아서" 들어간다. 영상 분석 결과 진입은
    // 압축→도약→비행(가위차기)→착지가 약 0.55초에 걸쳐 일어나고, 그 뒤 카멜 자세로
    // 길게 회전하다가 마지막에 몸을 일으키며 빠져나온다.
    var flying = (spinType === 'FCSp');

    // SPIN 구간을 늘렸다 — 예전엔 3.0s라 전환이 끝나기 전에 EXIT로 넘어가 버렸다.
    var phases = flying ? [['ENTRY',0.60],['SPIN',4.6],['EXIT',0.70]]

    return { kind:'spin', spinType:spinType, flying:flying, phases:phases };

  function makeFall(type, level){
    var def = JUMP_DB[type] || JUMP_DB.T;
    var v0 = ({2:0.52,3:0.68,4:0.80}[level] || 0.68) * 4.9;
    return { kind:'fall', def:def, v0:v0, spinRate:Math.PI*2*2.4,

  function poseJump(r, phase, t, c){

    var take = legOf(r, d.takeoffLeg);

      // 반대로 감아 들어가는 카운터 로테이션이 최대 특징.
      var lean = (d.entryLean!=null ? d.entryLean : 0.16) * Math.sin(Math.min(1,t*1.4)*Math.PI*0.5);
      r.spine.rotation.z = lean;
      r.chest.rotation.y = (d.preTurns||0) * t * 2.2;
      r.head.rotation.y  = (d.preTurns||0) * t * 1.2;

        r.armL.upper.rotation.z = -0.28-0.18*t; r.armR.upper.rotation.z = 0.28+0.18*t;

        r.armL.upper.rotation.z = -0.28+0.20*t;  // 왼팔: 몸 앞을 가로질러 앞으로
        r.armL.upper.rotation.x = -0.95*t;
        r.armL.fore.rotation.z  = 0.32*t;
        r.armR.upper.rotation.z = 0.28+0.28*t;   // 오른팔: 뒤/아래로 흘린다
        r.armR.upper.rotation.x = 0.55*t;
        r.armR.fore.rotation.z  = -0.24*t;
      }

      else if (d.swing==='wide'){

        // 백인엣지를 깊게 눌러 타다가 프리레그(오른발)를 뒤·바깥으로 크게 감아 들어간다.
        free.upper.rotation.z = free.sgn*0.52*t;
        free.upper.rotation.x = 0.60*t;              // 뒤로 감음 (양수 = 뒤)
        free.lower.rotation.x = -0.35*t;

        r.spine.rotation.y = -0.30*t;                // 상체를 감아 비튼다

      else if (d.swing==='through'){ free.upper.rotation.x=0.26*t; }

      // 악셀은 뒤로 뺐던 양팔을 앞·위로 크게 휘둘러 올리는 반동이 도약의 핵심.

        r.armR.upper.rotation.x = MU.lerp( 0.80, -0.22, e);
        r.armL.upper.rotation.z = MU.lerp(-0.46, -0.10, e);
        r.armR.upper.rotation.z = MU.lerp( 0.46,  0.10, e);

        r.armR.fore.rotation.x  = MU.lerp(-0.20, -2.35, e);
        r.armL.fore.rotation.z  = MU.lerp(-0.13, -0.62, e);
        r.armR.fore.rotation.z  = MU.lerp( 0.13,  0.62, e);
      } else {

        r.armL.upper.rotation.x = MU.lerp(-0.95, -0.22, e);
        r.armL.fore.rotation.x  = MU.lerp(-0.12, -2.35, e);
        r.armL.fore.rotation.z  = MU.lerp( 0.32, -0.62, e);
        r.armR.upper.rotation.z = MU.lerp( 0.56,  0.10, e);
        r.armR.upper.rotation.x = MU.lerp( 0.55, -0.22, e);
        r.armR.fore.rotation.x  = MU.lerp(-0.12, -2.35, e);

        free.lower.rotation.x = -0.35 + 0.30*e;
        take.upper.rotation.x = 0.05 - 0.20*e;

      } else if (d.swing==='through'){

      // "가위"처럼 벌어져 버렸다 — 실제 공중 자세는 두 다리를 거의 붙여서 하나처럼
      // 보이게 모으는 것이다. z는 거의 0에 가깝게 되돌리고, 두 다리를 "같은 방향"으로
      // 함께 접어 올리는 x축 위주로 다시 짰다(룹만 발목을 아주 살짝 겹쳐 꼰다).
      // 무릎을 굽혀 "앉은" 것처럼 보이던 걸 뺐다 — 실제 공중 자세는 다리를 붙인 채
      // 곧게 편다(주저앉는 자세가 아니다). knees()는 아예 호출하지 않고, 다리도
      // 거의 직선에 가깝게 아주 살짝만 앞으로 기울인다.
      // z축 부호가 반대였다 — 이전엔 다리가 서로 "벌어지는" 방향으로 돌고 있었다.
      // legL/legR의 z 부호를 뒤집어서 서로 "모이며 살짝 겹치는" 방향으로 바꿨다.
      var pose = d.airPose || 'tight';
      if (pose === 'cross'){
        // 룹: 발목을 겹쳐 꼰다(가장 많이 꼬이는 점프) — 방향은 맞았으니 각도만 완화
        arms(r, 1.0);
        r.legL.upper.rotation.z = -0.09; r.legR.upper.rotation.z =  0.11;
        r.legL.upper.rotation.x = -0.10; r.legR.upper.rotation.x = -0.14;
        r.legL.lower.rotation.z = -0.05; r.legR.lower.rotation.z =  0.07;
        r.legL.lower.rotation.x =  0.08; r.legR.lower.rotation.x =  0.05;
        r.spine.rotation.z = 0.02;
      } else if (pose === 'open'){
        // 악셀·살코: 다리는 모으되 아주 약간만 꼰다
        arms(r, 0.82);
        r.legL.upper.rotation.z = -0.06; r.legR.upper.rotation.z =  0.07;
        r.legL.upper.rotation.x = -0.08; r.legR.upper.rotation.x = -0.10;
        r.legL.lower.rotation.z = -0.03; r.legR.lower.rotation.z =  0.04;
        r.legL.lower.rotation.x =  0.06; r.legR.lower.rotation.x =  0.05;
        r.spine.rotation.z = 0.10;
      } else {
        // 토룹·플립·러츠: 다리를 모으고 살짝 꼰다
        arms(r, 0.98);
        r.legL.upper.rotation.z = -0.07; r.legR.upper.rotation.z =  0.09;
        r.legL.upper.rotation.x = -0.09; r.legR.upper.rotation.x = -0.12;
        r.legL.lower.rotation.z = -0.04; r.legR.lower.rotation.z =  0.06;
        r.legL.lower.rotation.x =  0.07; r.legR.lower.rotation.x =  0.05;
        r.spine.rotation.z = 0.05;
      }
      if (t>0.85){
        var u=(t-0.85)/0.15;
        arms(r, (pose==='open'?0.82:0.98)*(1-u*0.55));
      }
    }
    else if (phase==='LANDING'){
      var land = legOf(r, d.landLeg);
      var fr = legOf(r, d.landLeg==='L'?'R':'L');
      var ab = Math.sin(Math.min(1,t*1.6)*Math.PI);
      knees(r, 0.12+0.55*ab);
      land.upper.rotation.x = -0.30*ab; land.lower.rotation.x = 0.72*ab;
      fr.upper.rotation.x = 0.25+0.55*t; fr.upper.rotation.z = fr.sgn*0.12; fr.lower.rotation.x = -0.30*t;
      // 착지 — 양팔을 좌우로 "쫙" 뻗는다. 팔꿈치와 교차(z)를 확실히 0으로 풀어야
      // X자로 겹쳐 보이지 않는다. 공중에서 조였던 값에서 시작해 연속되게 잇되,
      // 팔꿈치는 벌리는 것보다 빠르게 펴서 곧은 일자 팔이 되도록 한다.
      var st = (d.airPose==='open') ? 0.369 : 0.441;
      var sUZ = MU.lerp(-0.28, -0.10, st);    // 공중 자세가 끝난 시점의 실제 값
      var sUX = MU.lerp(-0.15, -0.22, st);
      var sFX = MU.lerp(0,     -2.35, st);
      var sFZ = MU.lerp(-0.10, -0.62, st);
      var fe = Math.min(1, t*2.4);            // 팔꿈치·교차는 빠르게 풀린다
      r.armL.upper.rotation.z = MU.lerp( sUZ,  1.25, t);   // 부호 주의: 왼팔 양수 = 바깥
      r.armR.upper.rotation.z = MU.lerp(-sUZ, -1.25, t);
      r.armL.upper.rotation.x = MU.lerp(sUX, -0.05, t);
      r.armR.upper.rotation.x = MU.lerp(sUX, -0.05, t);
      r.armL.fore.rotation.x  = MU.lerp(sFX, 0, fe);   // 팔꿈치를 쭉 편다
      r.armR.fore.rotation.x  = MU.lerp(sFX, 0, fe);
      r.armL.fore.rotation.z  = MU.lerp( sFZ, 0, fe);  // 교차를 완전히 푼다
      r.armR.fore.rotation.z  = MU.lerp(-sFZ, 0, fe);
    }
    else if (phase==='EXIT'){
      var fr2 = legOf(r, d.landLeg==='L'?'R':'L');
      var h = Math.min(1,t*2.4);
      // 체크아웃 팔 — 착지에서 활짝 벌린 양팔(z ±1.25)을 그대로 이어받아 유지한다.
      // 부호 주의: upper.z 왼팔 양수 = 바깥. 예전엔 여기서 음수로 갔기 때문에 착지에서
      // 벌렸던 팔이 체크아웃 순간 다시 몸 앞으로 접혀 X자가 됐다.
      r.armL.upper.rotation.z = MU.lerp( 1.25,  1.08, h);
      r.armR.upper.rotation.z = MU.lerp(-1.25, -1.08, h);
      r.armL.fore.rotation.x = 0; r.armR.fore.rotation.x = 0;
      r.armL.fore.rotation.z = 0; r.armR.fore.rotation.z = 0;
      if (d.toePick){
        // 토룹·플립·러츠 체크아웃 — 상체를 꽤 깊게 앞으로 숙인 채 프리레그를 낮고
        // 길게 뒤로 뻗어 한참 활주한다. 팔은 벌린 채 살짝 앞으로 낮춘다.
        knees(r, 0.22*(1-h*0.3));
        fr2.upper.rotation.x = MU.lerp(0.55,0.72,h); fr2.upper.rotation.z = fr2.sgn*0.10; fr2.lower.rotation.x = -0.16;
        r.spine.rotation.x = MU.lerp(0.15,0.62,h);
        r.armL.upper.rotation.x = MU.lerp(-0.05, 0.20,h);
        r.armR.upper.rotation.x = MU.lerp(-0.05, 0.20,h);
      } else {
        // 악셀·살코·룹 체크아웃 — 상체를 세우고 양팔을 대칭으로 활짝 편 개방적 자세
        knees(r, 0.16*(1-h*0.4));
        fr2.upper.rotation.x = MU.lerp(0.80,0.95,h); fr2.upper.rotation.z = fr2.sgn*0.16; fr2.lower.rotation.x = -0.22;
        r.spine.rotation.x = -0.10*h;
        r.armL.upper.rotation.x=-0.08; r.armR.upper.rotation.x=-0.08;
      }
    }
  }

  // 스텝/코레오 시퀀스 — 제자리에 서 있지 않고 실제로 커브를 그리며 링크를 가로지른다.
  // 트위즐(제자리 회전) → 이글/스프레드 → 방향 전환이 한 사이클로 반복된다.
  function poseStep(r, t, c){
    var w = t * 2.4;                       // 사이클 진행
    var cyc = w % (Math.PI*2);

    // 무릎: 에지를 깊게 밀 때마다 눌렀다 편다
    knees(r, 0.22 + Math.sin(w*2)*0.16);

    // 상체: 진행 방향으로 몸을 틀고, 커브 안쪽으로 기울인다
    r.spine.rotation.z = Math.sin(w)*0.30;
    r.spine.rotation.y = Math.sin(w*0.5)*0.45;
    r.chest.rotation.y = Math.sin(w*0.5+0.6)*0.30;
    r.head.rotation.y  = Math.sin(w*0.5+1.0)*0.35;

    // 팔: 좌우로 크게 휘두르는 코레오 동작
    r.armL.upper.rotation.z = -0.28 - Math.sin(w)*0.95;
    r.armR.upper.rotation.z =  0.28 + Math.sin(w+Math.PI*0.6)*0.95;
    r.armL.upper.rotation.x = Math.cos(w)*0.65;
    r.armR.upper.rotation.x = Math.cos(w+Math.PI*0.6)*0.65;
    r.armL.fore.rotation.z = -0.10 - Math.max(0,Math.sin(w))*0.35;
    r.armR.fore.rotation.z =  0.10 + Math.max(0,Math.sin(w+2))*0.35;

    // 다리: 좌우 발을 번갈아 밀어낸다 (스트로킹)
    r.legL.upper.rotation.x = -0.25 + Math.sin(w*2)*0.42;
    r.legR.upper.rotation.x = -0.25 - Math.sin(w*2)*0.42;
    r.legL.upper.rotation.z =  Math.sin(w*2)*0.20;
    r.legR.upper.rotation.z =  Math.sin(w*2)*0.20;
    r.legL.lower.rotation.x = 0.30 + Math.max(0,-Math.sin(w*2))*0.55;
    r.legR.lower.rotation.x = 0.30 + Math.max(0, Math.sin(w*2))*0.55;

    // 코레오 시퀀스는 한 구간에서 이글(양발 벌려 활주) 자세를 크게 잡는다
    if (c.stepKind === 'choreo' && cyc > 4.0 && cyc < 5.4){
      var k = Math.sin((cyc-4.0)/1.4*Math.PI);
      r.spine.rotation.x = -0.45*k;        // 상체를 젖힌 이나바우어 (음수 = 뒤로)
      r.head.rotation.x  = -0.30*k;
      r.armL.upper.rotation.z = -0.28 + 1.73*k;
      r.armR.upper.rotation.z =  0.28 - 1.73*k;
      r.legL.upper.rotation.z =  0.35*k;
      r.legR.upper.rotation.z = -0.35*k;
      knees(r, 0.12);
    }

    // 실제 이동: 링크 위를 S자로 가로지른다 (제자리에 붙어있지 않게)
    var R = 2.3;
    r.root.position.set(Math.sin(w)*R, 0, Math.cos(w*0.5)*R*0.55);
    r.root.rotation.y = w + Math.PI*0.5;   // 진행 방향을 바라본다
    r.root.rotation.z = -Math.sin(w)*0.16; // 커브 원심력 기울기
  }

  // 토 아라비안 진입 — 플라잉 카멜의 도입을 "가위차기"가 아니라 토 아라비안으로 구성한다.
  // 토픽을 찍어 몸을 앞아래로 던지면서 두 다리를 앞뒤로 크게 벌린(스플릿) 채 카트휠처럼
  // 옆으로 넘어갔다가, 앞다리로 내려앉아 그대로 카멜 자세로 이어지는 진입.
  //   ① 준비(0~0.30)   : 무릎을 깊게 눌러 앉으며 상체를 숙이고 토픽 찍을 다리를 뒤로 뺀다
  //   ② 넘김(0.30~0.66): 토픽을 찍고 상체를 던지며 두 다리가 앞뒤로 활짝 갈라진다.
  //                      동시에 몸이 옆으로 크게 기울어(spine.z) 카트휠처럼 넘어간다
  //   ③ 착지(0.66~1.0) : 기울기가 풀리고 앞다리가 내려와 빙면을 잡으며 카멜 업워드로 수렴
  function poseFlyingEntry(r, t){
    if (t < 0.30){
      var kRaw = t/0.30;
      // 상체가 먼저 움직이기 시작하고, 다리·팔은 아주 살짝 뒤따라오게 스태거 — 모든 관절이
      // 똑같은 타이밍으로 동시에 꺾이면 그게 바로 "구체관절인형" 느낌이 된다.
      var k  = easeInOutCubic(kRaw);
      var kL = easeInOutCubic(stagger(kRaw,0.06,0.94));
      var kA = easeInOutCubic(stagger(kRaw,0.10,0.90));
      knees(r, 0.30 + 0.45*kL);
      r.spine.rotation.x = 0.60*k;
      r.head.rotation.x  = -0.25*k;
      r.legR.upper.rotation.x = 0.35*kL;            // 토픽 찍을 다리를 뒤로
      r.legR.lower.rotation.x = -0.30*kL;
      r.armL.upper.rotation.z = -0.28+0.55*kA; r.armR.upper.rotation.z = 0.28-0.55*kA;
      r.armL.upper.rotation.x = -0.55*kA;      r.armR.upper.rotation.x = -0.55*kA;
    } else if (t < 0.66){
      var k2Raw = (t-0.30)/0.36;
      var k2  = easeInOutCubic(k2Raw);
      var k2L = easeInOutCubic(stagger(k2Raw,0.05,0.95));
      var k2A = easeInOutCubic(stagger(k2Raw,0.08,0.92));
      knees(r, 0.75*(1-k2*0.88));
      r.spine.rotation.x = 0.60 + 0.75*k2;
      r.spine.rotation.z = 0.95*Math.sin(k2*Math.PI*0.9);   // 카트휠처럼 옆으로 넘어간다
      r.head.rotation.x  = -0.25 - 0.35*k2;
      r.legR.upper.rotation.x = 0.35 + 1.20*k2L;    // 뒷다리를 높이 차올리고
      r.legR.lower.rotation.x = -0.30 + 0.15*k2L;
      r.legL.upper.rotation.x = -1.10*k2L;          // 앞다리는 앞으로 — 크게 스플릿
      r.legL.lower.rotation.x = 0.32*k2L;
      r.armL.upper.rotation.z = 0.27+0.91*k2A; r.armR.upper.rotation.z = -0.27-0.91*k2A;
      r.armL.upper.rotation.x = -0.55+0.95*k2A; r.armR.upper.rotation.x = -0.55+0.95*k2A;
    } else {
      var k3Raw = (t-0.66)/0.34;
      // 착지 순간은 이즈아웃백으로 아주 살짝 정착(settle)시켜서 카멜 자세로 "툭" 멈추지 않고
      // 자연스럽게 자리를 잡는 느낌을 준다.
      var k3  = easeOutBack(k3Raw);
      var k3L = easeOutBack(stagger(k3Raw,0.04,0.96));
      knees(r, 0.10);
      // 업워드(유나카멜) 시작값으로 정확히 수렴시킨다: 지지다리는 수직, 상체는 앞으로 숙이고
      // (spine -1.35) 프리레그는 무릎을 편 채 앞으로 높이 들어(-1.65) — 상체·프리레그가 힙을
      // 사이에 두고 정반대 방향을 향해야 진짜 T자가 된다. poseSpin의 ps=0 값과 동일해야
      // 스핀 시작 순간 자세가 툭 끊기지 않는다.
      r.spine.rotation.x = MU.lerp(1.35, -1.35, k3);
      r.spine.rotation.z = 0.95*(1-k3Raw)*(1-k3Raw);     // 옆 기울기가 부드럽게 풀린다
      r.head.rotation.x  = MU.lerp(-0.60, 0.15, k3);
      r.legR.upper.rotation.x = MU.lerp(1.55, -1.65, k3L);
      r.legR.lower.rotation.x = MU.lerp(-0.15, 0.20, k3L);
      r.legL.upper.rotation.x = -1.10*(1-k3Raw);      // 앞다리를 내려 빙면을 잡는다
      r.legL.lower.rotation.x = 0.32*(1-k3Raw);
      r.armL.upper.rotation.z = MU.lerp( 1.18,  1.20, k3);
      r.armL.upper.rotation.x = MU.lerp(0.40, 0.40, k3);
      r.armR.upper.rotation.z = MU.lerp(-1.18, -1.20, k3);
      r.armR.upper.rotation.x = MU.lerp(0.40, 0.40, k3);
    }
  }

  function poseSpin(r, t, c){
    var k = Math.min(1,t*2.5);
    if (c.spinType==='FCSp'){
      // 플라잉 카멜 — 토 아라비안 도입 → 카멜 업워드(유나카멜) → 카멜 사이드웨이(도넛 스핀).
      // 업로드된 영상으로 확인: 도넛(사이드웨이)은 사실 캐치풋이 아니라, 업워드와 정확히
      // 앞뒤가 뒤바뀐 거울상의 같은 T자다 — 상체를 앞으로 깊이 숙이고(클래식 카멜처럼) 프리레그를
      // 곧게 편 채 등 뒤로 높이 뻗는다. 무릎을 접거나 손으로 발을 잡지 않는다.
      //   ⓐ 업워드: 지지다리는 수직. 상체는 뒤로 누워 하늘을 보고(뒤 방향), 프리레그는
      //      반대로 앞으로 높이 들어 올린다(앞 방향) — 힙을 사이에 두고 정확히 반대 방향.
      //   ⓑ 도넛(사이드웨이): 정반대로 상체는 앞으로 깊이 숙이고(정면), 프리레그는 등 뒤로
      //      곧게 편 채 높이 든다(뒤 방향) — 업워드와 거울처럼 앞뒤만 바뀐 같은 T자.
      knees(r,0.08);
      var psRaw = Math.min(1, Math.max(0, t-0.40)/0.15);     // 업워드 → 도넛 전환 (다리가 앞→뒤로 크게 돌아간다)
      var ps     = easeInOutCubic(psRaw);
      var psLeg  = easeInOutCubic(stagger(psRaw,0.05,0.95));
      var psArm  = easeInOutCubic(stagger(psRaw,0.10,0.90));
      // 상체: 업워드(뒤로 누움) → 도넛(정반대로 앞으로 깊이 숙임) — 거울상 T자
      r.spine.rotation.x = MU.lerp(-1.35, 1.35, ps);
      r.head.rotation.x  = MU.lerp(0.15, -0.15, ps);
      // 프리레그: 업워드(앞으로 높이) → 도넛(정반대로 등 뒤로 곧게 높이) — 무릎은 펴진 채 유지
      r.legR.upper.rotation.x = MU.lerp(-1.65, 1.65, psLeg);
      r.legR.lower.rotation.x = MU.lerp(0.20, -0.20, psLeg);
      r.legR.upper.rotation.z = 0;
      // 팔: 양쪽 다 균형을 위해 넓게 벌린 채 유지 — 방향만 거울처럼 뒤집힌다.
      r.armL.upper.rotation.z = MU.lerp(1.20, 1.20, psArm);
      r.armL.upper.rotation.x = MU.lerp(0.40, 0.40, psArm);
      r.armR.upper.rotation.z = MU.lerp(-1.20, -1.20, psArm);
      r.armR.upper.rotation.x = MU.lerp(0.40, 0.40, psArm);
      return 1.0 + 0.45*psRaw;
    }
    if (c.spinType==='CSSp'){          // 싯
      knees(r, 0.15+0.85*k); r.legR.upper.rotation.x=-1.25*k; r.legR.lower.rotation.x=0.25*k;
      r.spine.rotation.x=0.30*k; arms(r,0.20);
      r.armL.upper.rotation.x=-1.0*k; r.armR.upper.rotation.x=-1.0*k;
      return 1.15;
    }
    if (c.spinType==='LSp'){           // 레이백 — 이름 그대로 상체를 "뒤로" 젖힌다 (부호 음수)
      knees(r,0.10);                   // 여기서도 마찬가지로 프리레그보다 먼저
      r.spine.rotation.x=-0.75*k; r.chest.rotation.x=-0.35*k; r.head.rotation.x=-0.30*k;
      r.legR.upper.rotation.x=0.85*k; r.legR.lower.rotation.x=-0.95*k;
      r.armL.upper.rotation.z=2.05*k; r.armR.upper.rotation.z=-2.05*k;
      return 1.05;
    }
    // CCoSp — 카멜 → 싯 → 업라이트로 자세가 바뀌며 속도도 변한다
    if (t<0.34){ c.spinType='FCSp'; var v=poseSpin(r,t/0.34,c); c.spinType='CCoSp'; return v; }
    if (t<0.68){ c.spinType='CSSp'; var v2=poseSpin(r,(t-0.34)/0.34,c); c.spinType='CCoSp'; return v2; }
    var u = Math.min(1,(t-0.68)/0.32);
    knees(r,0.08); r.legR.upper.rotation.x=0.10; r.legR.lower.rotation.x=0.55;
    arms(r, u*0.95);
    return 1.0 + u*1.35;               // 팔을 모을수록 빨라진다 (각운동량 보존)
  }

  // 쿼드러플 살코 낙상 영상(30fps 프레임 분석) 기준으로 다시 만든 낙상 동작.
  // 관측된 실제 순서 — 중요한 건 "엉덩방아" 단계가 분명히 있다는 것:
  //   3.53s ① 착지 충격  : 회전이 덜 풀린 채 내려와 상체가 앞으로 확 쏠리고, 프리레그가
  //                        뒤로 크게 휘둘리며 양팔이 균형을 잡으려 활짝 벌어진다
  //   3.67s ② 주저앉음   : 착지 무릎이 버티지 못하고 푹 꺾이며 엉덩이가 빠르게 내려간다
  //   3.83s ③ 엉덩방아   : 엉덩이로 빙판에 앉는다. 두 다리는 앞으로 뻗고 상체는 오히려
  //                        거의 세워진 채로 미끄러진다  ← 예전 구현에 아예 없던 단계
  //   4.03s ④ 옆으로 구름: 한쪽 엉덩이/옆구리로 돌아누우며 손으로 빙판을 짚는다
  //   4.27s ⑤ 웅크림     : 무릎을 접고 몸을 말아 머리가 낮아진 채 미끄러짐이 멎는다
  //   4.53s ⑥ 일어나기   : 두 손과 무릎으로 짚고 몸을 일으키기 시작
  // 예전 구현은 ③이 없어서 착지하자마자 앞으로 엎어지는 것처럼 보였다.
  function poseFall(r, t){
    if (t < 0.12){
      // ① 착지 충격 — 상체가 앞으로 쏠리고 프리레그가 뒤로 휘둘리며 양팔이 벌어진다
      var k = t/0.12;
      knees(r, 0.35+0.40*k);
      r.hips.position.y = 0.95 - 0.16*k;
      r.spine.rotation.x = 0.50*k;
      r.armL.upper.rotation.z = -0.28+1.53*k; r.armR.upper.rotation.z = 0.28-1.33*k;
      r.armL.upper.rotation.x = -0.30*k; r.armR.upper.rotation.x = -0.20*k;
      r.legL.upper.rotation.x = -0.25*k; r.legR.upper.rotation.x = 0.55*k;
      r.legR.upper.rotation.z = r.legR.sgn*0.30*k;
    } else if (t < 0.26){
      // ② 주저앉음 — 무릎이 완전히 꺾이며 엉덩이가 빠르게 빙판으로 내려간다
      var k2 = (t-0.12)/0.14;
      knees(r, 0.75+0.25*k2);
      r.hips.position.y = 0.79 - 0.50*k2;
      r.spine.rotation.x = 0.50 - 0.22*k2;         // 쏠렸던 상체가 오히려 다시 세워진다
      r.armL.upper.rotation.z = 1.25+0.20*k2; r.armR.upper.rotation.z = -1.05-0.15*k2;
      r.armL.upper.rotation.x = -0.30-0.25*k2; r.armR.upper.rotation.x = -0.20-0.20*k2;
      r.legL.upper.rotation.x = -0.25-0.55*k2; r.legR.upper.rotation.x = 0.55-0.75*k2;
      r.legL.lower.rotation.x = 0.90*k2; r.legR.lower.rotation.x = 0.80*k2;
      r.legR.upper.rotation.z = r.legR.sgn*0.30*(1-k2*0.5);
    } else if (t < 0.42){
      // ③ 엉덩방아 — 엉덩이로 앉은 채 두 다리를 앞으로 뻗고 상체는 세운 채 미끄러진다
      var k3 = (t-0.26)/0.16;
      r.hips.position.y = 0.29 - 0.06*k3;
      r.spine.rotation.x = 0.28 - 0.10*k3;         // 거의 세워진 상체
      r.spine.rotation.z = 0.20*k3;                // 서서히 한쪽으로 기울기 시작
      r.legL.upper.rotation.x = -0.80-0.55*k3; r.legR.upper.rotation.x = -0.20-1.05*k3;
      r.legL.lower.rotation.x = 0.90-0.55*k3; r.legR.lower.rotation.x = 0.80-0.45*k3;
      r.legL.upper.rotation.z = 0; r.legR.upper.rotation.z = r.legR.sgn*0.15*(1-k3);
      r.armL.upper.rotation.z = 1.45-0.35*k3; r.armR.upper.rotation.z = -1.20+0.25*k3;
      r.armL.upper.rotation.x = -0.55-0.35*k3; r.armR.upper.rotation.x = -0.40-0.30*k3;
    } else if (t < 0.62){
      // ④ 옆으로 구름 — 한쪽 엉덩이/옆구리로 돌아누우며 손으로 빙판을 짚는다
      var k4 = (t-0.42)/0.20;
      r.hips.position.y = 0.23 - 0.04*k4;
      r.spine.rotation.x = 0.18 + 0.65*k4;         // 옆으로 돌며 상체가 다시 숙여진다
      r.spine.rotation.z = 0.20 + 0.55*k4;
      r.spine.rotation.y = 0.35*k4;
      r.legL.upper.rotation.x = -1.35+0.45*k4; r.legR.upper.rotation.x = -1.25+0.55*k4;
      r.legL.lower.rotation.x = 0.35+0.70*k4; r.legR.lower.rotation.x = 0.35+0.80*k4;
      r.armL.upper.rotation.z = 1.10-0.30*k4; r.armR.upper.rotation.z = -0.95+0.55*k4;
      r.armL.upper.rotation.x = -0.90-0.35*k4; r.armR.upper.rotation.x = -0.70-0.40*k4;
      r.armL.fore.rotation.x = -0.30*k4; r.armR.fore.rotation.x = -0.45*k4;
    } else if (t < 0.82){
      // ⑤ 웅크림 — 무릎을 접고 몸을 말아 머리가 낮아진 채 미끄러짐이 멎는다
      var k5 = (t-0.62)/0.20;
      r.hips.position.y = 0.19 + 0.16*k5;
      r.spine.rotation.x = 0.83 + 0.30*k5;
      r.spine.rotation.z = 0.75 - 0.30*k5;
      r.spine.rotation.y = 0.35 - 0.20*k5;
      r.head.rotation.x = 0.30*k5;
      r.legL.upper.rotation.x = -0.90+0.55*k5; r.legR.upper.rotation.x = -0.70+0.45*k5;
      r.legL.lower.rotation.x = 1.05+0.25*k5; r.legR.lower.rotation.x = 1.15+0.20*k5;
      r.armL.upper.rotation.z = 0.80-0.35*k5; r.armR.upper.rotation.z = -0.40+0.25*k5;
      r.armL.upper.rotation.x = -1.25-0.15*k5; r.armR.upper.rotation.x = -1.10-0.20*k5;
      r.armL.fore.rotation.x = -0.30-0.15*k5; r.armR.fore.rotation.x = -0.45-0.10*k5;
    } else {
      // ⑥ 일어나기 — 두 손과 무릎으로 짚고 몸을 일으키기 시작
      var k6 = (t-0.82)/0.18;
      r.hips.position.y = 0.35 + 0.22*k6;
      r.spine.rotation.x = 1.13 - 0.45*k6;
      r.spine.rotation.z = 0.45 - 0.35*k6;
      r.spine.rotation.y = 0.15 - 0.15*k6;
      r.head.rotation.x = 0.30 - 0.45*k6;          // 고개를 든다
      r.legL.upper.rotation.x = -0.35+0.20*k6; r.legR.upper.rotation.x = -0.25+0.15*k6;
      r.legL.lower.rotation.x = 1.30-0.35*k6; r.legR.lower.rotation.x = 1.35-0.40*k6;
      r.armL.upper.rotation.z = 0.45-0.35*k6; r.armR.upper.rotation.z = -0.15+0.15*k6;
      r.armL.upper.rotation.x = -1.40+0.55*k6; r.armR.upper.rotation.x = -1.30+0.50*k6;
      r.armL.fore.rotation.x = -0.45+0.25*k6; r.armR.fore.rotation.x = -0.55+0.30*k6;
    }
  }

  // -------------------------------------------------------------------------
  // 루프
  // -------------------------------------------------------------------------
  function frame(){
    raf = requestAnimationFrame(frame);
    if (!host || !cur) return;
    var dt = Math.min(clock.getDelta(), 0.05);

    // 단계 진행
    cur.t += dt;
    var ph = cur.phases[cur.i];
    while (ph && cur.t >= ph[1] && cur.i < cur.phases.length-1){
      cur.t -= ph[1]; cur.i++; ph = cur.phases[cur.i];
    }
    var name = ph[0];
    var tt = Math.min(1, cur.t / ph[1]);

    // 회전 단계가 끝나고 착지로 넘어가는 그 순간, 누적 적분값에 기대지 않고
    // 목표 회전수(cur.rot)에 정확히 맞춰 스냅한다. 악셀은 +0.5바퀴가 남아야 정확히
    // 뒤돌아 착지하는데, 감속 구간의 적분 오차가 조금만 있어도 그 절반 바퀴가
    // 안 채워져 "앞을 보고 착지"하는 것처럼 보일 수 있다 — 그래서 여기서 확정한다.
    if (name==='LANDING' && (cur.kind==='jump') && !cur._snapped && cur.rot!=null){
      cur.spin = cur.rot * Math.PI * 2;
      cur._snapped = true;
    }

    reset(skater);

    if (cur.kind==='jump' || cur.kind==='fall'){
      if (name==='FALL'){ poseFall(skater, tt); }
      else { poseJump(skater, name, tt, cur); }

      // 공중 물리
      if (cur._off){
        cur.vy -= 9.8*dt; cur.y += cur.vy*dt;
        if (cur.y < 0){ cur.y = 0; cur.vy = 0; }
      }
      // 회전 누적 — 낙상 순간에는 회전을 계속 더하지 않는다. 착지 실패 직후
      // 남아있던 회전 관성만 짧게(0~16%) 풀리고, 이후엔 빙판 마찰로 바로 멎는다
      // (예전엔 슬라이딩 내내 계속 돌아서 "목이 꺾이는" 것처럼 보이는 원인 중 하나였다).
      if (name==='AIRBORNE')      cur.spin += cur.spinRate * tt * dt;
      else if (name==='ROTATION') cur.spin += cur.spinRate * (tt>0.85 ? (1-(tt-0.85)/0.15*0.45) : 1) * dt;
      else if (name==='FALL' && tt<0.16) cur.spin += 2.4*(1-tt/0.16)*dt;

      // 스케이팅 → 진입 → 도약 → 공중 → 착지 → 다음 동작이 하나로 이어지도록,
      // 도약 전(APPROACH)에도 실제로 활주해 들어오게 한다 (멈춰 서 있다가 갑자기
      // 뛰는 게 아니라, 진입 속도가 그대로 도약으로 이어진다).
      if (name==='APPROACH'){
        cur.dist = (cur.dist||0) + 2.0*dt;   // 진입 활주
      } else if (cur._off && cur.travel){
        cur.dist = (cur.dist||0) + (cur.travel / Math.max(0.2, cur.flight||0.7)) * dt;
      } else if (name==='FALL' && tt<0.75){
        // 넘어진 뒤에도 관성으로 빙판 위를 미끄러진다 (영상에서 실제로 몇 미터 밀려남),
        // 마찰로 점점 느려지다가 멈춘다
        cur.dist = (cur.dist||0) + 2.6*(1-tt/0.75)*dt;
      }
      // dz 부호 주의: root.rotation.y=θ는 모델의 정면(local +Z)을 (sinθ, cosθ)로 향하게
      // 한다. 이동도 같은 부호를 쓰면 "얼굴이 향한 쪽"으로 나아가 버린다 — 실제로 그래서
      // 모든 점프가 앞으로(얼굴부터) 착지·활주하고 있었다. 후진 진입 점프(T/S/Lo/F/Lz)는
      // baseYaw에 +180도가 들어가 있으므로, 이동은 +dist 방향이어야 등이 진행 방향을
      // 향한다(=뒤로 활주). 악셀도 앞으로 도약해 3.5바퀴 후 뒤로 착지하는 게 맞게 된다.
      // (test_landing_dir.js 로 6종 점프 전부 진입/착지 방향 검증함)
      var dz = (cur.dist||0);
      // 이동 방향은 "얼굴이 어느 쪽을 보는지"와 무관하게, 링크를 가로지르는 고정된
      // 기준 방향(TRAVEL_BEARING)을 써야 한다. 그동안은 cur.baseYaw(=진입 시 몸의
      // 방향, 후진 진입 점프는 +180도가 이미 더해져 있음)를 그대로 이동 방향에도
      // 써버려서, 악셀이 착지 후 뒤돈 다음에도 "뒷통수 방향"이 아니라 원래 얼굴
      // 방향 그대로 미끄러지고 있었다 — 즉 회전은 맞는데 이동만 반대였다.
      skater.root.position.set(Math.sin(TRAVEL_BEARING)*dz, cur.y, Math.cos(TRAVEL_BEARING)*dz);
      skater.root.rotation.y = cur.baseYaw + cur.spin * (cur.def && cur.def.counter ? -1 : 1);
      skater.root.rotation.z = 0;
      if (name==='FALL'){
        // 몸이 빙판으로 내려가는 높이는 이제 poseFall()이 hips.position.y로 직접 만든다
        // (엉덩방아→옆으로 구름→웅크림까지 자세와 높이가 함께 가야 하므로).
        // 여기서는 착지 직후 남아있던 공중 높이만 빠르게 0으로 흡수한다 — 예전처럼
        // root까지 따로 내리면 높이가 두 번 적용돼 빙판 아래로 꺼져 보인다.
        var fd = (tt < 0.12) ? cur.y*(1-tt/0.12) : 0;
        skater.root.position.y = Math.max(0, fd);
      }
    }
    else if (cur.kind==='spin'){
      if (name==='ENTRY'){
        poseFlyingEntry(skater, tt);
        // 실제로 빙면에서 떴다가 내려앉는 궤적. 영상에서 양발이 모두 떨어지는 구간은
        // 진입의 중후반(도약~착지)이므로, 그 구간에만 포물선 높이를 준다.
        var air = 0;
        if (tt > 0.32 && tt < 1.0){
          var u = (tt-0.32)/0.68;
          air = Math.sin(u*Math.PI) * 0.30;
        }
        cur.y = air;
        // 진입 활주 — 도약 직전까지 앞으로 미끄러져 들어오다가, 착지하며 제자리를 잡는다
        cur.dist = (cur.dist||0) + (tt<0.62 ? 1.9 : 1.9*(1-(tt-0.62)/0.38)) * dt;
        var edz = (cur.dist||0);
        skater.root.position.set(Math.sin(TRAVEL_BEARING)*edz, air, Math.cos(TRAVEL_BEARING)*edz);
        // 플라잉 카멜은 도약하면서 이미 돌기 시작한다 (착지 순간 갑자기 도는 게 아니다)
        if (tt > 0.45) cur.spin = (cur.spin||0) + (Math.PI*2*1.15) * ((tt-0.45)/0.55) * dt;
        skater.root.rotation.y = (cur.baseYaw||0) + (cur.spin||0);
      } else if (name==='EXIT'){
        // ⓓ 마무리 — 카멜(T자) 그대로 유지하던 상체는 그대로 두고, 접었던 프리레그 무릎만 펴서
        // 뒤로 낮게 길게 뻗은 채, 양팔을 좌우로 활짝 편 자세로 활주해 나간다.
        var e = easeInOutCubic(tt);
        var eLeg = easeInOutCubic(stagger(tt,0.06,0.94));
        knees(skater, 0.10 + 0.12*e);
        // 도넛 종료 자세(spine.x 1.35 = 클래식 카멜(정면 숙임) / 프리레그 허벅지 1.65·무릎 -0.20)에서
        // 다리를 뒤로 낮게 뻗으며 상체를 세우는 체크아웃으로 풀어준다.
        skater.spine.rotation.x = MU.lerp(1.35, 0.10, e);     // 숙여있던 상체가 거의 직립으로
        skater.head.rotation.x  = MU.lerp(-0.15, 0.0, e);
        skater.legR.upper.rotation.x = MU.lerp(1.65, 0.62, eLeg); // 뒤로 낮게 뻗은 체크아웃
        skater.legR.lower.rotation.x = MU.lerp(-0.20, -0.10, eLeg);
        skater.legR.upper.rotation.z = 0;
        skater.armL.upper.rotation.z = MU.lerp(1.20,  1.15, e);
        skater.armR.upper.rotation.z = MU.lerp(-1.20, -1.15, e);
        skater.armL.upper.rotation.x = MU.lerp(0.40, -0.12, e);
        skater.armR.upper.rotation.x = MU.lerp(0.40, -0.12, e);
        skater.armL.fore.rotation.x  = MU.lerp(0, -0.28, e); skater.armR.fore.rotation.x = MU.lerp(0, -0.28, e);
        // 회전은 풀리고, 대신 앞으로 미끄러져 나간다 (물리 누적은 원래 tt 그대로 — 이즈는 포즈만)
        cur.spin = (cur.spin||0) + (Math.PI*2*2.1) * (1-tt) * (1-tt) * dt;
        cur.dist = (cur.dist||0) + 2.2*tt*dt;
        cur.y = 0;
        var xdz = (cur.dist||0);
        skater.root.position.set(Math.sin(TRAVEL_BEARING)*xdz, 0, Math.cos(TRAVEL_BEARING)*xdz);
        skater.root.rotation.y = (cur.baseYaw||0) + cur.spin;
      } else {
        var mul = poseSpin(skater, tt, cur);
        cur.spin = (cur.spin||0) + (Math.PI*2*2.1) * mul * dt;
        cur.y = 0;

function currentLeaderInfo(activePlayerId){

  const finished = S.players.filter(pl=> pl.id!==activePlayerId && (S.phase==='short'? pl.scoreShort!=null : pl.scoreFree!=null));
  if(!finished.length) return null;

function lastElementBaseGoe(e){

  if(e.kind==='combo'){
    const results=(e.subResults||[]).filter(Boolean);
    if(!results.length || !e.result) return null;
    const totalGoe = results.reduce((s,r)=>s+(r.goe||0),0);
    const base = roundScore(e.result.score-totalGoe);
    return {base, goe:totalGoe};
  }
  const r=e.result;
  if(!r || r.voided) return null;
  if(!r.success) return {base:roundScore(r.score*2), goe:0, failed:true};
  const base=roundScore(r.score-(r.goe||0));
  return {base, goe:r.goe||0};
}

  if(!e) return null;

    if(!e.result) return null;
    return e.result.success!==false; // combo overall counts as "succeeded" unless explicitly marked failed
  }

  if(r.voided) return false;

  if(elem.pendingRoll===undefined) return null;
  let lvl;
  if(elem.kind==='spin'){
    if(ch.spinLevelMapByType && elem.spinType && ch.spinLevelMapByType[elem.spinType]) lvl = ch.spinLevelMapByType[elem.spinType][elem.pendingRoll];
    else if(ch.spinLevelMap) lvl = ch.spinLevelMap[elem.pendingRoll];
    else lvl = spinLevelFor(elem.pendingRoll);
  } else if(elem.kind==='step' && ch.stepLevelMap){
    lvl = ch.stepLevelMap[elem.pendingRoll];
  } else {
    lvl = spinLevelFor(elem.pendingRoll);
  }
  // 스핀 룰 개정 등, 굴린 레벨 자체를 낮추는 카드는 결과 레벨에 직접 반영(최소 1, 최대 4로 클램프).
  // 이렇게 elem.cards를 여기서 한 번만 체크해두면 기초점(nonjumpBaseScore)·GOE 배율 계산이
  // 모두 이 함수를 거쳐가므로 자동으로 낮아진 레벨 기준으로 계산된다.
  const levelDelta=(elem.cards||[]).reduce((sum,c)=>sum+(c.levelDelta||0),0);
  if(levelDelta && lvl!=null) lvl=Math.max(1,Math.min(4,lvl+levelDelta));
