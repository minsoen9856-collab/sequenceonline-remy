}
function nonjumpBaseScore(elem,ch){
  if(elem.kind==='choreo') return 3.5;
  if(elem.kind==='choreospin') return 3.5;
  if(elem.kind==='spin' && elem.pendingRoll!==undefined) return spinTypeScore(elem.spinType, nonjumpLevel(elem,ch));
  if(elem.kind==='step' && elem.pendingRoll!==undefined) return STEP_LEVEL_SCORE[nonjumpLevel(elem,ch)];
  return 0;
}
function nonjumpGOEBonus(elem,ch,roll){
  const isFlat = (elem.kind==='choreo' || elem.kind==='choreospin');
  const goe = isFlat ? computeGOE(5,roll) : nonjumpGOE(roll, nonjumpHasWideLevel4(elem,ch));
  if(!goe) return 0;
  if(isFlat) return roundScore(goe*0.5);
  return roundScore(goe*nonjumpBaseScore(elem,ch)*0.1);
}
function nonjumpRow(p,ch,elem,idx){
  const names={spin:(elem.spinType||'스핀'),step:'StSq',choreo:'ChSq1',choreospin:'ChSp1'};
  const cards=elem.cards||[];
  const isFixedLevel = (elem.kind==='choreo' || elem.kind==='choreospin');
  let forceFail=false, extraConstFail=0, goeDeltaScaled=0, goeDeltaRaw=0;
  cards.forEach(c=>{
    if(c.scope==='nonjump'){
      if(c.forceFail) forceFail=true;
      // 코레오/코레오스핀은 GOE 팩터가 고정 0.5라서 바로 환산되지만, 스핀/스텝은 굴려서 나온
      // 레벨(1~4)에 따라 기초점이 다르므로 그 레벨의 기초점을 알기 전까지는 원시(grade) 단위로 모아둠
      if(c.goeDelta){ if(isFixedLevel) goeDeltaScaled=roundScore(goeDeltaScaled+c.goeDelta*0.5); else goeDeltaRaw+=c.goeDelta; }
      if(c.constDelta) extraConstFail+=c.constDelta;
    }
  });
  const charBonus = (ch.stepChoreoBonus && (elem.kind==='step'||elem.kind==='choreo')) ? ch.stepChoreoBonus : 0;
  if(!forceFail){
    if(elem.pendingRoll===undefined){
      return `<div>
        <h3>${names[elem.kind]}${isFixedLevel?' (레벨1 고정)':''}</h3>
        ${skaterStage('step', names[elem.kind], {stepKind:elem.kind})}
        ${cards.length?'<div class="mini-card-list">'+cards.map(c=>'<div class="mini-card-tag">🃏 <b>'+c.name+'</b> — '+(c.desc||'')+'</div>').join('')+'</div>':''}
        <div class="sticky-action-bar"><button class="btn-main ${tutorialGlow(true)}" style="width:100%" onclick="rollNonjumpLevel(${idx})"><span class="btn-icon">${navIcon('dice')}</span>주사위 굴리기${isFixedLevel?' (GOE 결정)':' ('+names[elem.kind]+' 레벨 결정)'}</button></div>
      </div>`;
    }
    const lvl = nonjumpLevel(elem,ch);
    const baseScoreLvl = nonjumpBaseScore(elem,ch);
    const goe = nonjumpGOE(elem.pendingRoll, nonjumpHasWideLevel4(elem,ch));
    // 스핀/스텝 카드의 GOE 보정도 자연 GOE와 똑같이 "그 레벨의 기초점 × 0.1" 팩터로 환산해야
    // 낮은 레벨/높은 레벨에서 카드 효과의 실제 점수 영향이 요소 크기에 비례하게 맞음
    const goeDelta = isFixedLevel ? goeDeltaScaled : roundScore(goeDeltaRaw*baseScoreLvl*0.1);
    const goeBonus = roundScore(nonjumpGOEBonus(elem,ch,elem.pendingRoll)+goeDelta);
    const score = roundScore(baseScoreLvl + goeBonus + charBonus);
    // 주사위 12가 뜨면 "폴 후보" - rollNonjumpLevel에서 즉시 확인용 주사위를 하나 더 굴려뒀다.
    // 그 확인 주사위도 12일 때만 확정 시 낙상(폴) 처리된다는 걸 미리 알려준다.
    const isFallCandidate = elem.pendingRoll===12;
    const willFallOn12 = isFallCandidate && elem.pendingFallConfirmRoll===12;
    return `<div>
      <h3>${(elem.kind==='spin'||elem.kind==='step')?(names[elem.kind]+lvl):(names[elem.kind]+' (기초점 '+baseScoreLvl+')')}</h3>
      ${skaterStage(willFallOn12?'fail':(elem.kind==='spin'?'spin':'step'), names[elem.kind], {spinType:elem.spinType, stepKind:elem.kind})}
      ${cards.length?'<div class="mini-card-list">'+cards.map(c=>'<div class="mini-card-tag">🃏 <b>'+c.name+'</b> — '+(c.desc||'')+'</div>').join('')+'</div>':''}
      <div class="protocol-row ${willFallOn12?'bad':'ok'}">
        <div class="pr-left">
          <div class="pr-name">${willFallOn12?'낙상':'레벨 '+lvl}</div>
          ${isFallCandidate?`<div class="pr-note">${willFallOn12?'재확인 주사위 '+elem.pendingFallConfirmRoll+'도 12 — 낙상':'재확인 주사위 '+elem.pendingFallConfirmRoll+' — 낙상 위기 넘김'}</div>`:''}
        </div>
        <div class="pr-val"><div class="pr-label">기초점</div><div class="pr-num">${baseScoreLvl}</div></div>
        <div class="pr-val"><div class="pr-label">GOE</div><div class="pr-num ${goeBonus<0?'neg':goeBonus>0?'pos':''}">${goeBonus>0?'+':''}${goeBonus}</div></div>
        <div class="pr-val pr-total-wrap"><div class="pr-label">합계</div><div class="pr-num">${score}</div></div>
      </div>
      <div class="roll-note">판정 주사위 ${elem.pendingRoll}</div>
      <div class="sticky-action-bar"><button class="btn-main" style="width:100%" onclick="resolveNonjump(${idx},${score},false,0)">결과 확정</button></div>
    </div>`;
  }
  const fixedLevel = isFixedLevel ? 1 : null;
  const baseScoreFixed = nonjumpBaseScore(elem,ch);
  const score = baseScoreFixed + charBonus;
  return `<div>
    <h3>${names[elem.kind]} (기초점 ${baseScoreFixed}${charBonus?' +'+charBonus+' 보너스':''}${fixedLevel?', 레벨'+fixedLevel+' 고정':''})</h3>
    ${skaterStage(forceFail?'fail':'step', names[elem.kind], {stepKind:elem.kind})}
    ${cards.length?'<div class="mini-card-list">'+cards.map(c=>'<div class="mini-card-tag">🃏 <b>'+c.name+'</b> — '+(c.desc||'')+'</div>').join('')+'</div>':''}
    ${forceFail? `<div class="protocol-row simple bad"><div class="pr-left"><div class="pr-name">무효</div><div class="pr-note">멀미 카드로 인해 이 요소는 무효 처리됩니다.</div></div><div class="pr-val pr-total-wrap"><div class="pr-label">합계</div><div class="pr-num">0</div></div></div>` : ''}
    <div class="sticky-action-bar"><button class="btn-main" style="width:100%" onclick="resolveNonjump(${idx},${score},${forceFail},${extraConstFail})">결과 확정</button></div>
  </div>`;
}
function rollNonjumpLevel(idx){if(!iAmActive())return;
  const elem=S.cur.plan[idx];
  elem.pendingRoll=Math.floor(Math.random()*12)+1;
  // 스핀/스텝/코레오/코레오스핀: 12가 뜨면 "폴 후보"가 된다 - 곧바로 낙상 처리하지 않고, 확인용
  // 주사위를 한 번 더 굴려서 그것도 12여야 실제로 낙상 처리한다(둘 다 12일 확률만 진짜 낙상).
  elem.pendingFallConfirmRoll = (elem.pendingRoll===12) ? (Math.floor(Math.random()*12)+1) : undefined;
  render();
}
function resolveNonjump(idx,score,forceFail,extraConstFail){if(!iAmActive())return;
  const p=curPlayer();
  const ch=charOf(p);
  const elem=S.cur.plan[idx];
  if(!forceFail && elem.pendingRoll!==undefined){
    if(ch.withdrawOn12 && elem.pendingRoll===12){
      const wLabel=ch.withdrawOn12Label||'멘탈이슈';
      p.programState.withdrawTriggerCount=(p.programState.withdrawTriggerCount||0)+1;
      if(p.programState.withdrawTriggerCount>=3){
        S.cur.withdrawn=true;
        S.cur.withdrawReason={roll:12, label:wLabel};
        S.cur.rollLog.push('💥 주사위 12! '+p.name+'('+ch.name+') '+wLabel+'(으)로 기권합니다. (3번째 발동)');
        render();
        return;
      }
      elem.result={success:false, score:0, voided:true};
      S.cur.rollLog.push('⚠️ 주사위 12! '+p.name+'('+ch.name+') '+wLabel+' 발동 ('+p.programState.withdrawTriggerCount+'/3) — 이 요소는 무효 처리됩니다.');
      S.cur.resolvedIdx++;
      render();
      return;
    }
    if(p.programState.forceWithdrawOn && p.programState.forceWithdrawOn.includes(elem.pendingRoll)){
      const causeCard=(p.programState.appliedProgramCards||[]).find(c=>c.forceWithdrawOn && c.forceWithdrawOn.includes(elem.pendingRoll));
      p.programState.withdrawTriggerCount=(p.programState.withdrawTriggerCount||0)+1;
      if(p.programState.withdrawTriggerCount>=3){
        S.cur.withdrawn=true;
        S.cur.withdrawReason={roll:elem.pendingRoll, label:(causeCard?causeCard.name+' 효과':'카드 효과'), desc:(causeCard?causeCard.desc:null)};
        S.cur.rollLog.push('💥 주사위 '+elem.pendingRoll+'! '+p.name+'('+ch.name+') 카드 효과로 강제 기권합니다. (3번째 발동)');
        render();
        return;
      }
      S.cur.rollLog.push('⚠️ 주사위 '+elem.pendingRoll+'! '+p.name+'('+ch.name+') '+(causeCard?causeCard.name+' 효과':'카드 효과')+' 발동 ('+p.programState.withdrawTriggerCount+'/3) — 세 번째부터 기권 처리됩니다.');
    }
  }
  const isFixedLevel = (elem.kind==='choreo' || elem.kind==='choreospin');
  let lvl=null;
  if(isFixedLevel) lvl=1;
  else if((elem.kind==='spin'||elem.kind==='step') && elem.pendingRoll!==undefined) lvl=nonjumpLevel(elem,charOf(p));
  // 스핀/스텝/코레오/코레오스핀: 주사위 12는 "폴 후보" - rollNonjumpLevel에서 이미 굴려둔 확인용
  // 주사위(pendingFallConfirmRoll)도 12여야 실제로 낙상(폴) 처리한다(둘 다 12일 때만).
  if(!forceFail && elem.pendingRoll===12 && elem.pendingFallConfirmRoll===12){
      const baseScoreLvl=nonjumpBaseScore(elem,ch);
      const fallGoe=roundScore(-5*baseScoreLvl*0.1);
      const fallScore=roundScore(baseScoreLvl+fallGoe);
      const fallConst=-(ch.failConstructionOverride!==undefined?ch.failConstructionOverride:1);
      p.constAdj=(p.constAdj||0)+fallConst;
      elem.result={success:false, score:fallScore, spinLevel:lvl, goe:fallGoe, fellOn12:true};
      S.cur.rollLog.push('🧊 주사위 12에 확인 주사위도 12! '+p.name+'('+ch.name+') '+idx_labelKor(elem)+' 낙상(폴) 처리 → '+fallScore+'점 (GOE '+fallGoe+', 구성점 '+fallConst+')');
      S.cur.resolvedIdx++;
      render();
      return;
  }
  const goeBonus = (!forceFail && elem.pendingRoll!==undefined) ? nonjumpGOEBonus(elem,charOf(p),elem.pendingRoll) : 0;
  elem.result = forceFail? {success:false,score:0} : {success:true,score,spinLevel:lvl,goe:goeBonus};
  if(forceFail){ p.constAdj=(p.constAdj||0)+extraConstFail; p.constAdjCard=(p.constAdjCard||0)+extraConstFail; S.cur.rollLog.push((forceFail?'❌':'✅')+' '+idx_labelKor(elem)+' → '+(forceFail?'무효 (구성점 '+extraConstFail+')':'+'+score+'점')); }
  else S.cur.rollLog.push('✅ '+((elem.kind==='spin'||elem.kind==='step')&&lvl?idx_labelKor(elem)+lvl:idx_labelKor(elem))+' → +'+score+'점'+(goeBonus!==0?' (GOE '+(goeBonus>0?'+':'')+goeBonus+')':''));
  S.cur.resolvedIdx++;
  render();
}
function idx_labelKor(elem){
  if(elem.kind==='spin') return elem.spinType || '스핀'; if(elem.kind==='step') return 'StSq'; if(elem.kind==='choreo') return 'ChSq1'; if(elem.kind==='choreospin') return 'ChSp1';
  if(elem.kind==='jump') return jCode(elem.level,elem.type);
  return '컴비네이션';
}

// 확정 성공(성공률과 무관하게 항상 성공 처리)이 적용될지 미리 판별한다. confirmJumpResult/
// confirmComboSub의 실제 판정과 반드시 같은 조건이어야, 굴린 직후 미리보기가 나중에 "확정"할 때와
// 다른 마크(q/언더/다운그레이드)를 보여주는 일이 없다.
function wouldForceSuccess(p, ch, opts){
  if(opts.guaranteedUsed) return true;
  if(opts.leadGuaranteed) return true;
  if(p.programState && p.programState.guaranteedAllJumps) return true;
  if(opts.naturalSuccess) return false; // 이미 자연 성공이면 아래의 "실패 구제" 효과들은 해당 없음
  if(ch.autoSuccessFirstAxel && opts.type==='A' && !p.programState.axelAttempted) return true;
  if(ch.autoSuccessFirstExact && opts.level===ch.autoSuccessFirstExact.level && opts.type===ch.autoSuccessFirstExact.type && !p.programState.autoSuccessFirstExactUsed) return true;
  if(ch.shamelessForgive && !p.programState.usedShameless) return true;
  return false;
}
function jumpRow(p,ch,elem,idx,jumpPos,totalJumps,isFollowOfCombo,showRoll){
  const info=computeElementRate(p,ch,{level:elem.level,type:elem.type,late:elem.late,elemIndexAmongJumps:jumpPos,totalJumpElems:totalJumps,isCombo:false},true,false);
  const cards=elem.cards||[];
  let rate;
  if(elem.devilsWhisperActive){
    rate = devilsWhisperRate(elem, info, cards);
  } else {
    rate=info.rate;
    cards.forEach(c=>{ if(c.scope==='element') rate+=(c.delta||0); });
    if(elem.lateOverrideDelta) rate+=elem.lateOverrideDelta;
  }
  if(rate<0)rate=0; if(rate>12)rate=12;
  let scoreBase=charScoreBase(ch,elem.level,elem.type);
  if(p.programState && p.programState.jumpBaseMult!==1) scoreBase=roundScore(scoreBase*p.programState.jumpBaseMult);
  let mult=elem.late?1.1:1;
  mult*=dupPenaltyFactor(idx,-1);
  if(ch.riskyTripleGamble && elem.riskyGamble){ rate=1; scoreBase=roundScore(scoreBase*3); }
  if(p.programState && p.programState.guaranteedAllJumps){ rate = (ch.riskyTripleGamble && elem.riskyGamble) ? 3 : 12; }
  const revealed = !isSpectatorNow() || elem.pendingRoll!==undefined;
  const label = revealed ? (jCode(elem.level,elem.type,ch)) : '단독점프';
  if(elem.pendingRoll===undefined){
    return `<div>
      <h3>${label} <span class="small">${elem.late?'(후반 가산점)':''}</span></h3>
      ${skaterStage('idle', label)}
      <p class="small">기본 성공률 ${soloRate(elem.level,elem.type,ch.div)}/12 → 최종 성공률 <b>${rate}/12</b> (1~${rate} 성공, ${rate+1}~12 실패) · 기초점 ${scoreBase}${elem.late?' ×1.1(후반 가산점)':''}${dupPenaltyFactor(idx,-1)<1?' ×0.8(중복 점프 페널티)':''}${ch.onSuccessBonus?' + 캐릭터 보너스 '+ch.onSuccessBonus:''}${(ch.onSuccessBonus)?' = 성공시 '+roundScore(scoreBase*mult+ch.onSuccessBonus)+'점':''}</p>
      ${ch.autoReroll?`<p class="small" style="opacity:.75">🔁 실패해도 1회 자동 재도전 가능(성공시 +${ch.autoRerollBonus}점 추가)</p>`:''}
      ${cards.length?'<div class="mini-card-list">'+cards.map((c,ci)=>'<div class="mini-card-tag">🃏 <b>'+c.name+'</b> — '+(c.desc||'')+(c.type==='disrupt' && !isSpectatorNow() && (p.immuneTokens||0)>0 ? ' <button class="btn-ghost btn-sm" style="padding:2px 6px;font-size:.65rem" onclick="cancelDebuffCard('+idx+','+ci+')">🛡️ 무효화</button>' : '')+'</div>').join('')+'</div>':''}
      ${((ch.guaranteedQuad && elem.level===4) || (ch.guaranteedAxel && elem.type==='A')) && !S.cur.usedGuaranteedQuad ? `<label class="small"><input type="checkbox" ${elem.wantGuaranteed?'checked':''} onchange="toggleGuaranteedQuad(${idx})"> 확정 성공 능력 사용 (경기당 1회)</label><br>`:''}
      ${ch.riskyTripleGamble ? `<label class="small"><input type="checkbox" ${elem.riskyGamble?'checked':''} onchange="toggleRiskyGamble(${idx})"> 가끔 살아나요 발동 (성공률 1/12 고정, 기초점 ×3)</label><br>`:''}
      ${(S.teamMode && p.programState.teamRescueAvailable) ? `<label class="small"><input type="checkbox" ${elem.useTeamRescue?'checked':''} onchange="toggleTeamRescue(${idx})"> 🤝 팀 구원 버프 사용 (팀원이 실패해서 생긴 1회용, 이 점프 GOE +2)</label><br>`:''}
      <div class="sticky-action-bar"><button class="btn-main ${tutorialGlow(true)}" style="width:100%" onclick="doRoll(${idx},${rate},${roundScore(scoreBase*mult)},'${elem.type}',${elem.level})"><span class="btn-icon">${navIcon('dice')}</span>주사위 굴리기</button></div>
    </div>`;
  }
  const r=elem.pendingRoll;
  const naturalSuccess=r<=rate;
  const forced=wouldForceSuccess(p,ch,{guaranteedUsed:elem.guaranteedUsed, naturalSuccess, type:elem.type, level:elem.level});
  const success=naturalSuccess||forced;
  // 회전수 확인 2차 주사위 — "딱 걸림"/"한 칸 여유" 구간에 들어갔는데 아직 확인 주사위를
  // 굴리지 않았으면, 결과 화면 대신 확인 주사위 버튼을 먼저 보여준다(실제로 두 번 굴리는 걸
  // 눈으로 보여주기 위함).
  if(success && !forced && elem.pendingUrRoll===undefined){
    const candidate = landingCandidate(rate, r, p.programState.underRangeBonus||0, p.programState.qRangeBonus||0);
    if(candidate){
      const candLabel = candidate==='exact' ? '성공률에 딱 걸렸어요' : '한 칸 여유있게 성공했어요';
      return `<div>
        <h3>${label}</h3>
        ${skaterStage('jump', label, {jumpType:elem.type, level:elem.level})}
        <div class="protocol-row ok">
          <div class="pr-left">
            <div class="pr-name">성공</div>
            <div class="pr-note">${candLabel} — 착지가 불안정할 수 있어요. 확인 주사위를 굴려주세요.</div>
          </div>
        </div>
        <div class="roll-note">판정 주사위 ${r}/${rate}</div>
        <div class="sticky-action-bar"><button class="btn-main ${tutorialGlow(true)}" style="width:100%" onclick="doUrRoll(${idx})"><span class="btn-icon">${navIcon('dice')}</span>회전수 확인 주사위 굴리기</button></div>
      </div>`;
    }

  const rerollCard=cards.find(c=>c.reroll) || (ch.autoReroll ? {reroll:true, auto:true} : null);
  const canReroll = !success && rerollCard && !elem.rerollUsed;
  let mk='', bv=0, goe=0, total=0, note='';
  if(success){
    const gAny=forced||(rotationMark(rate,r,true,0,0,elem.pendingUrRoll)==='<' && cards.some(c=>c.cancelUnderRotation));
    mk=gAny?'':rotationMark(rate,r,true,0,0,elem.pendingUrRoll);
    bv=roundScore(scoreBase*mult);
    let fb=charScoreBase(ch,elem.level,elem.type);
    if(mk==='<'){ bv=roundScore(bv*0.8); fb=roundScore(fb*0.8); }
    goe=charGOEBonus(ch,elem.level,elem.type,rate,r,fb,p.programState?p.programState.maxGOEOverrideAll:null,gAny,0,0,undefined,elem.pendingUrRoll);
    total=roundScore(bv+goe);
    note = mk==='<' ? '회전수 부족 (기초점 ×0.8)' : mk==='q' ? '쿼터 부족' : mk==='!' ? '랜딩 불안' : (forced?'확정 성공 능력 사용':'');
  } else {
    mk=rotationMark(rate,r,false);
    let baseFull=(elem.pendingScoreNormal!==undefined?elem.pendingScoreNormal:roundScore(scoreBase*mult));
    if(mk==='<<' && elem.level>=2){ baseFull=roundScore(baseFull*charScoreBase(ch,elem.level-1,elem.type)/charScoreBase(ch,elem.level,elem.type)); }
    const isGamble=cards.some(c=>c.gamble);
    bv=baseFull;
    goe=isGamble?roundScore(-baseFull):roundScore(-5*baseFull*0.1);
    total=isGamble?0:roundScore(baseFull+goe);
    note = (mk==='<<'?'다운그레이드 — 한 단계 아래 점프로 채점':'') + (mk==='<<'?', ':'') + '구성점 -'+(ch.failConstructionOverride!==undefined?ch.failConstructionOverride:1);
  }
  return `<div>
    <h3>${label}</h3>
    ${skaterStage(success?'jump':'fail', label, {jumpType:elem.type, level:elem.level})}
    <div class="protocol-row ${success?'ok':'bad'}">
      <div class="pr-left">
        <div class="pr-name">${success?'성공':'실패'}${mk?`<span class="pr-mark">${mk}</span>`:''}</div>
        ${note?`<div class="pr-note">${note}</div>`:''}
      </div>
      <div class="pr-val"><div class="pr-label">기초점</div><div class="pr-num">${bv}</div></div>
      <div class="pr-val"><div class="pr-label">GOE</div><div class="pr-num ${goe<0?'neg':goe>0?'pos':''}">${goe>0?'+':''}${goe}</div></div>
      <div class="pr-val pr-total-wrap"><div class="pr-label">합계</div><div class="pr-num">${total}</div></div>
    </div>
    <div class="roll-note">판정 주사위 ${r}/${rate}${elem.pendingUrRoll!==undefined?' · 확인 주사위 '+elem.pendingUrRoll:''}</div>
    ${cards.length?'<div class="mini-card-list">'+cards.map(c=>'<div class="mini-card-tag">🃏 <b>'+c.name+'</b> — '+(c.desc||'')+'</div>').join('')+'</div>':''}
    ${canReroll?`<button class="btn-ok" onclick="rerollJump(${idx})">🔁 랜딩어멈 발동 — 다시 굴리기</button> `:''}
    <div class="sticky-action-bar"><button class="btn-main" style="width:100%" onclick="confirmJumpResult(${idx})">${canReroll?t('이 결과로 확정'):t('다음 →')}</button></div>
  </div>`;
}
function rerollJump(idx){if(!iAmActive())return;
  const elem=S.cur.plan[idx];

function toggleRiskyGamble(idx){if(!iAmActive())return;

function teammateOf(p){
  if(!S.teamMode || !p) return null;

}
function toggleTeamRescue(idx){if(!iAmActive())return;

function toggleTeamRescueCombo(idx,k){if(!iAmActive())return;

function doRoll(idx,rate,score,type,level){if(!iAmActive())return;
  const elem=S.cur.plan[idx];
  const p=curPlayer();
  const ch=charOf(p);
  const useGQ = !!elem.wantGuaranteed;
  const roll=Math.floor(Math.random()*12)+1;
  sfxDice();
  // 확정성공(가드에 guaranteedAllJumps 카드 등으로 무조건 성공 처리되는 경우)이면 회전수 관련
  // 캐릭터 페널티(언더/오버 로테이티드)도 함께 면제해야 한다 — 그 외 성공/실패는 원래 로직 그대로.
  const forced = wouldForceSuccess(p,ch,{guaranteedUsed:useGQ, naturalSuccess:(roll<=rate), type, level});
  const willSucceed = forced || roll<=rate;
  setTimeout(()=>{ willSucceed?sfxSuccess():sfxFail(); }, 260);
  let finalScore=score;
  if(!forced){
    if(ch.underRotatedThreshold && roll<=ch.underRotatedThreshold && (roll<=rate || useGQ)){
      finalScore = roundScore(score*0.8);
    }
    if(ch.overRotatedThreshold && roll>ch.overRotatedThreshold && (roll<=rate || useGQ)){
      finalScore = roundScore(score*0.8);
    }
  }
  elem.pendingRoll=roll; elem.pendingRate=rate; elem.pendingScore=finalScore;
  elem.pendingScoreNormal = (ch.riskyTripleGamble && elem.riskyGamble) ? roundScore(finalScore/3) : finalScore;
  // "강제 팝" 캐릭터는 회전수 후보 구간이 아니어도 이 주사위가 필요하므로 항상 미리 굴려둔다
  // (그 외 캐릭터는 아래 doUrRoll()에서 플레이어가 직접 굴려야 확인 주사위가 채워진다).
  if(ch.forcedPopJumpSlot) elem.pendingUrRoll=Math.floor(Math.random()*12)+1;
  elem.guaranteedUsed=useGQ;
  if(useGQ) S.cur.usedGuaranteedQuad=true;
  render();
}
// 회전수 확인용 2차 주사위 — "딱 걸림"/"한 칸 여유" 구간에 들어갔을 때만, 성공 판정과는 별개로
// 플레이어가 직접 한 번 더 굴린다. 예전엔 doRoll() 안에서 이 주사위까지 조용히 같이 굴려버려서
// 실제로는 두 번 굴리는 규칙인데도 "한 번 굴렸는데 q가 떴다"처럼 보이는 문제가 있었다.
function doUrRoll(idx){if(!iAmActive())return;
  const elem=S.cur.plan[idx];
  elem.pendingUrRoll=Math.floor(Math.random()*12)+1;
  sfxDice();
  render();
}
function bumpSuccessStreak(p,ch,success){
  if(success){
    S.cur.successStreak=(S.cur.successStreak||0)+1;
    if(ch.threeStreakBonus && S.cur.successStreak>=3 && !S.cur.usedStreakBonus){
      p.constAdj=(p.constAdj||0)+ch.threeStreakBonus;
      p.constAdjJump=(p.constAdjJump||0)+ch.threeStreakBonus;
      S.cur.usedStreakBonus=true;
      S.cur.rollLog.push('🔥 '+(ch.threeStreakLabel?"'"+ch.threeStreakLabel+"' 발동! ":'3연속 성공! ')+'구성점 +'+ch.threeStreakBonus);
    }
  } else {
    S.cur.successStreak=0;
  }
}
// 요소 배열에서 idx번째까지 셌을 때 "몇 번째 점프(단독+콤비 통틀어)"인지 센다 - 스핀/스텝/코레오는 안 셈.
// "이재근 5번째 점프는 항상 팝" 같은, 프로그램상 특정 순번의 점프를 노리는 캐릭터 특성에 쓰인다.
function jumpPositionOf(idx){
  let c=0;
  for(let i=0;i<=idx;i++){
    const k=S.cur.plan[i] && S.cur.plan[i].kind;
    if(k==='jump'||k==='combo') c++;
  }
  return c;
}
function confirmJumpResult(idx){if(!iAmActive())return;
  const p=curPlayer(); const ch=charOf(p);
  const elem=S.cur.plan[idx];
  if(ch.withdrawOn12 && elem.pendingRoll===12){
    const wLabel=ch.withdrawOn12Label||'멘탈이슈';
    p.programState.withdrawTriggerCount=(p.programState.withdrawTriggerCount||0)+1;
    if(p.programState.withdrawTriggerCount>=3){
      S.cur.withdrawn=true;
      S.cur.withdrawReason={roll:12, label:wLabel};
      S.cur.rollLog.push('💥 주사위 12! '+p.name+'('+ch.name+') '+wLabel+'(으)로 기권합니다. (3번째 발동)');
      render();
      return;
    }
    elem.result={success:false, score:0, voided:true};
    S.cur.rollLog.push('⚠️ 주사위 12! '+p.name+'('+ch.name+') '+wLabel+' 발동 ('+p.programState.withdrawTriggerCount+'/3) — 이 요소는 무효 처리됩니다.');
    S.cur.successStreak=0;
    S.cur.resolvedIdx++;
    render();
    return;
  }
  if(p.programState.forceWithdrawOn && p.programState.forceWithdrawOn.includes(elem.pendingRoll)){
    const causeCard=(p.programState.appliedProgramCards||[]).find(c=>c.forceWithdrawOn && c.forceWithdrawOn.includes(elem.pendingRoll));
    p.programState.withdrawTriggerCount=(p.programState.withdrawTriggerCount||0)+1;
    if(p.programState.withdrawTriggerCount>=3){
      S.cur.withdrawn=true;
      S.cur.withdrawReason={roll:elem.pendingRoll, label:(causeCard?causeCard.name+' 효과':'카드 효과'), desc:(causeCard?causeCard.desc:null)};
      S.cur.rollLog.push('💥 주사위 '+elem.pendingRoll+'! '+p.name+'('+ch.name+') 카드 효과로 강제 기권합니다. (3번째 발동)');
      render();
      return;
    }
    S.cur.rollLog.push('⚠️ 주사위 '+elem.pendingRoll+'! '+p.name+'('+ch.name+') '+(causeCard?causeCard.name+' 효과':'카드 효과')+' 발동 ('+p.programState.withdrawTriggerCount+'/3) — 세 번째부터 기권 처리됩니다.');
  }
  if(isDupVoided(idx,-1)){
    elem.result={success:false, score:0, voided:true};
    S.cur.rollLog.push('⚠️ '+(idx+1)+'번 요소: 중복 점프 규칙 위반으로 무효 처리됩니다.');
    S.cur.successStreak=0;
    S.cur.resolvedIdx++;
    render();
    return;
  }
  const cursedCard0=((p.programState.appliedProgramCards)||[]).find(c=>c.voidOnRoll!==undefined);
  let voidCard0=null;
  if(cursedCard0 && elem.pendingRoll===cursedCard0.voidOnRoll){
    p.programState.cardRollCounts = p.programState.cardRollCounts||{};
    const cnt = p.programState.cardRollCounts[cursedCard0.id] = (p.programState.cardRollCounts[cursedCard0.id]||0)+1;
    if(cnt>=(cursedCard0.voidOnNth||1)) voidCard0=cursedCard0;
  }
  if(voidCard0){
    elem.result={success:false, score:0, voided:true};
    S.cur.rollLog.push('⚠️ 주사위 '+elem.pendingRoll+'! '+voidCard0.name+'('+p.programState.cardRollCounts[voidCard0.id]+'번째) 발동 — 이 요소는 무효 처리됩니다.');
    S.cur.successStreak=0;
    S.cur.resolvedIdx++;
    render();
    return;
  }
  let success = elem.guaranteedUsed ? true : (elem.pendingRoll<=elem.pendingRate);
  let forcedSuccess = elem.guaranteedUsed; // 원래 주사위로는 안 됐는데 스킬/효과로 살아난 경우 - 전부 회전수 판정 면제 대상
  if(!success && ch.autoSuccessFirstAxel && elem.type==='A' && !p.programState.axelAttempted){
    success=true; forcedSuccess=true;
    S.cur.rollLog.push({masked:'⚡ 악셀 테크닉 발동!', full:'⚡ '+p.name+'('+ch.name+')의 악셀 테크닉 — 프로그램 첫 악셀은 무조건 성공!'});
  }
  if(elem.type==='A') p.programState.axelAttempted=true;
  const isAutoSuccessExactMatch = ch.autoSuccessFirstExact && elem.level===ch.autoSuccessFirstExact.level && elem.type===ch.autoSuccessFirstExact.type;
  if(!success && isAutoSuccessExactMatch && !p.programState.autoSuccessFirstExactUsed){
    success=true; forcedSuccess=true;
    S.cur.rollLog.push({masked:'⚡ 확정 성공 발동!', full:'⚡ '+p.name+'('+ch.name+')의 스킬 — 이 프로그램의 첫 '+jCode(elem.level,elem.type)+'은 무조건 성공!'});
  }
  if(isAutoSuccessExactMatch) p.programState.autoSuccessFirstExactUsed=true;
  if(!success && ch.shamelessForgive && !p.programState.usedShameless){
    success=true; forcedSuccess=true;
    p.programState.usedShameless=true;
    S.cur.rollLog.push({masked:'😎 실수를 못 본 척 넘어갑니다!', full:'😎 '+p.name+'('+ch.name+')가 실수를 못 본 척 넘어갑니다 — 이번 요소는 성공으로 처리!'});
  }
  bumpSuccessStreak(p,ch,success);
  const cards=elem.cards||[];
  let constDelta=0, scoreDelta=0, goeBonus=0, fallGoe=0, gambleVoid=false;
  // 확정 성공(guaranteed)으로 살아난 경우엔 주사위값 기반 회전수 판정을 하지 않는다 - "확정성공" 스킬뿐 아니라
  // 악셀 테크닉/실수 눈감아주기 등 성공을 강제하는 모든 효과가 여기 포함돼야 언더/q/다운 마크가 안 남는다
  const guaranteedAny = !!(forcedSuccess || (p.programState&&p.programState.guaranteedAllJumps));
  let urMark = guaranteedAny ? '' : rotationMark(elem.pendingRate, elem.pendingRoll, success, p.programState.underRangeBonus, p.programState.qRangeBonus, elem.pendingUrRoll);
  // 발목 돌리기: 경기 중 1회(카드 소모), 회전수 부족("<") 판정 자체를 무효로 만든다 - 확정성공과
  // 똑같이 기초점 ×0.8과 GOE -3 페널티를 둘 다 면제한다
  const underRotationCancelled = urMark==='<' && cards.some(c=>c.cancelUnderRotation);
  if(underRotationCancelled) urMark='';
  // 강제 팝: 캐릭터 특성으로 "N번째 점프는 (같은 요소를 굴릴 때 이미 굴려둔) 확인용 추가 주사위가
  // 7~12면 항상 무뎌진 스케이트 날(팝)" - 성공/실패 판정(주사위 대 성공률) 자체에는 영향을 주지
  // 않고, 점수 계산에서만 반영한다.
  if(ch.forcedPopJumpSlot && jumpPositionOf(idx)===ch.forcedPopJumpSlot && elem.level>=2 && (elem.pendingUrRoll||0)>=7){
    const oldBase=charScoreBase(ch, elem.level, elem.type);
    const newBase=charScoreBase(ch, elem.level-1, elem.type);
    elem.pendingScore=roundScore(elem.pendingScore*newBase/oldBase);
    if(elem.pendingScoreNormal!==undefined) elem.pendingScoreNormal=roundScore(elem.pendingScoreNormal*newBase/oldBase);
    elem.level-=1;
    S.cur.rollLog.push('🧊 '+p.name+'('+ch.name+') 팝! 확인 주사위 '+elem.pendingUrRoll+'(7~12)로 '+(idx+1)+'번째 점프가 회전수 부족으로 한 단계 낮은 점프로 채점됩니다.');
  }
  if(success){
    scoreDelta=elem.pendingScore;
    if(urMark==='<') scoreDelta=roundScore(scoreDelta*0.8); // 언더 로테이션: 기초점 ×0.8
    // 카드의 GOE 보정(예: '완벽한 착지' GOE+2, '펜스킬' GOE-3)도 캐릭터 GOE 보정과 똑같이 "그 점프의 기초점 × 0.1"을 곱한 팩터로 환산해야
    // 점프 크기에 비례한 값이 됨 (쿼드에서의 GOE+2와 더블에서의 GOE+2가 실제 점수 영향이 다른 게 맞음)
    const jumpFactorBase = urMark==='<' ? roundScore(charScoreBase(ch, elem.level, elem.type)*0.8) : charScoreBase(ch, elem.level, elem.type);
    goeBonus = elem.lateOverrideGoe
      ? roundScore(elem.lateOverrideGoe*jumpFactorBase*0.1) // 악마의 속삭임: GOE 확정 (주사위와 무관)
      : charGOEBonus(ch,elem.level,elem.type,elem.pendingRate,elem.pendingRoll,jumpFactorBase,p.programState?p.programState.maxGOEOverrideAll:null,guaranteedAny||underRotationCancelled,p.programState.underRangeBonus,p.programState.qRangeBonus,goeModsFor(p),elem.pendingUrRoll);
    cards.forEach(c=>{ if(c.onSuccessGoeDelta) goeBonus = roundScore(goeBonus + c.onSuccessGoeDelta*jumpFactorBase*0.1); });
    if(cards.some(c=>c.gamble)){ goeBonus = roundScore(goeBonus + 5*jumpFactorBase*0.1); } // 올인: 성공시 GOE +5점×팩터(캡 적용 전)
    { const capPts=goeCapPoints(ch, elem.type, p.programState?p.programState.maxGOEOverrideAll:null, jumpFactorBase);
      const floorPts=goeFloorPoints(jumpFactorBase);
      if(goeBonus>capPts) goeBonus=capPts;
      if(goeBonus<floorPts) goeBonus=floorPts; }
    if(goeBonus!==0) scoreDelta=roundScore(scoreDelta+goeBonus);
    cards.forEach(c=>{ if(c.onSuccessScoreDelta) scoreDelta=roundScore(scoreDelta+c.onSuccessScoreDelta); if(c.onTargetSuccessCasterPenalty){ /* handled globally below */ } });
    if(ch.onSuccessBonus) scoreDelta=roundScore(scoreDelta+ch.onSuccessBonus);
    if(ch.autoReroll && elem.rerollUsed) scoreDelta=roundScore(scoreDelta+(ch.autoRerollBonus||0));
    if(ch.exactBonus) ch.exactBonus.forEach(b=>{ if(b.level===elem.level&&b.type===elem.type&&b.cond==='success'){ if(b.target==='tech') scoreDelta=roundScore(scoreDelta+b.points); else constDelta+=b.points; } });
    if(ch.onTypeSuccessConstBonus && ch.onTypeSuccessConstBonus.type===elem.type) constDelta+=ch.onTypeSuccessConstBonus.points;
    // 🤝 월드 팀 트로피: 팀원의 실패로 생긴 1회용 구원 버프를 이 점프에 쓰면 GOE +2(점수로 환산)
    // 추가하고 버프를 소모한다. 실제 GOE 점수 환산이므로 점프 크기와 무관하게 딱 +2점.
    if(S.teamMode && elem.useTeamRescue && p.programState.teamRescueAvailable){
      goeBonus=roundScore(goeBonus+2);
      scoreDelta=roundScore(scoreDelta+2);
      p.programState.teamRescueAvailable=false;
      S.cur.rollLog.push('🤝 '+p.name+'('+ch.name+') 팀 구원 버프 발동! 이 점프에 GOE +2점 추가.');
    }
    S.cur.lastFailStreak=0;
    S.players.forEach(pl=>{}); // placeholder
  } else {
    constDelta -= (ch.failConstructionOverride!==undefined?ch.failConstructionOverride:1);
    p.programState.extraFailConst && (constDelta += p.programState.extraFailConst);
    p.programState.failCount=(p.programState.failCount||0)+1;
    p.programState.deductions=(p.programState.deductions||0)+1;
    if(jumpsAreSame(idx)) {} // handled after
    if(elem === S.cur.plan.find(e=>e.kind==='jump'||e.kind==='combo')) S.cur.firstJumpFailed=true;
    if(ch.cascadeLastFail) S.cur.lastFailStreak=1;
    // 🤝 월드 팀 트로피: 점프 실패시 팀원에게 1회용 구원 버프(다음 점프 GOE +2)를 준다.
    if(S.teamMode){
      const mate=teammateOf(p);
      if(mate && !mate.programState.teamRescueAvailable){
        mate.programState.teamRescueAvailable=true;
        S.cur.rollLog.push('🤝 '+p.name+'('+ch.name+') 점프 실패 — 팀원 '+mate.name+'에게 구원 버프(다음 점프 GOE +2)가 생겼습니다.');
      }
    }
    // 낙상(Fall): 기초점은 그대로 두고 GOE -5×팩터를 적용해서 결과적으로 절반만 받게 한다
    // (기초점 9.50 → GOE -4.75 → 4.75점, 프로토콜에는 "F"로 표시되고 기초점/GOE가 그대로 보임)
    let baseFull=(elem.pendingScoreNormal!==undefined?elem.pendingScoreNormal:elem.pendingScore);

  // 콤비네이션은 선행+연결을 합쳐서 "하나의 점프"로 쳐서 GOE를 딱 한 번만 계산한다 - 기초점이 더
  // 높은 쪽 점프의 굴림을 기준으로 판정한다 (동점이면 선행 우선). 예전에는 "선행이 이미 양수 GOE를
  // 받았는가"만 확인해서, 카드 등으로 GOE가 0 이하가 되면 연결에서 또 계산해버려 카드 효과가
  // 두 번 깎이는 버그가 있었다.
  const comboScores=elem.jumps.map(jj=>charScoreBase(ch,jj.level,jj.type));
  const goeDeterminingIdx = comboScores.indexOf(Math.max(...comboScores));
  if(success){
    scoreDelta=j.pendingScore;
    if(urMark==='<') scoreDelta=roundScore(scoreDelta*0.8); // 언더 로테이션: 이 점프의 기초점 ×0.8
    if(k===goeDeterminingIdx){
      // GOE 배율은 "기초점이 더 큰 쪽 점프"의 팩터를 쓰되, 그 점프 본인이 언더 로테이션(<)이면
      // 팩터도 ×0.8 된 값을 써야 한다 (기초점 9.50짜리가 <로 7.60이 됐으면 GOE도 7.60 기준으로 계산)
      const comboFactorBase = urMark==='<' ? roundScore(Math.max(...comboScores)*0.8) : Math.max(...comboScores);
      gb = elem.lateOverrideGoe
        ? roundScore(elem.lateOverrideGoe*comboFactorBase*0.1) // 악마의 속삭임: GOE 확정
        : charGOEBonus(ch,j.level,j.type,j.pendingRate,j.pendingRoll,comboFactorBase,p.programState?p.programState.maxGOEOverrideAll:null,guaranteedAnyC||underRotationCancelledC,p.programState.underRangeBonus,p.programState.qRangeBonus,goeModsFor(p),j.pendingUrRoll);
      // 카드의 GOE 보정도 단독 점프와 동일하게 "기초점 × 0.1" 팩터로 환산
      comboCards.forEach(c=>{ if(c.onSuccessGoeDelta) gb = roundScore(gb + c.onSuccessGoeDelta*comboFactorBase*0.1); });
      if(comboCards.some(c=>c.gamble)){ gb = roundScore(gb + 5*comboFactorBase*0.1); } // 올인: 성공시 GOE +5점×팩터(캡 적용 전)
      { const capPts=goeCapPoints(ch, j.type, p.programState?p.programState.maxGOEOverrideAll:null, comboFactorBase);
        const floorPts=goeFloorPoints(comboFactorBase);
        if(gb>capPts) gb=capPts;
        if(gb<floorPts) gb=floorPts; }
      if(gb!==0) scoreDelta=roundScore(scoreDelta+gb);
    }
    if(ch.onSuccessBonus) scoreDelta=roundScore(scoreDelta+ch.onSuccessBonus); if(ch.autoReroll && elem.rerollUsed) scoreDelta=roundScore(scoreDelta+(ch.autoRerollBonus||0)); if(ch.exactBonus) ch.exactBonus.forEach(b=>{ if(b.level===j.level&&b.type===j.type&&b.cond==='success'){ if(b.target==='tech') scoreDelta=roundScore(scoreDelta+b.points); else constDelta+=b.points; } }); if(ch.onTypeSuccessConstBonus && ch.onTypeSuccessConstBonus.type===j.type) constDelta+=ch.onTypeSuccessConstBonus.points; S.cur.lastFailStreak=0;
    // 🤝 월드 팀 트로피: 팀원의 실패로 생긴 1회용 구원 버프를 이 점프에 쓰면 GOE +2(점수로 환산)
    if(S.teamMode && j.useTeamRescue && p.programState.teamRescueAvailable){
      gb=roundScore(gb+2);
      scoreDelta=roundScore(scoreDelta+2);
      p.programState.teamRescueAvailable=false;
      S.cur.rollLog.push('🤝 '+p.name+'('+ch.name+') 팀 구원 버프 발동! 이 점프에 GOE +2점 추가.');
    }
  }
  else { constDelta -= (ch.failConstructionOverride!==undefined?ch.failConstructionOverride:1); p.programState.failCount=(p.programState.failCount||0)+1; p.programState.deductions=(p.programState.deductions||0)+1; if(k===0 && idx===0) S.cur.firstJumpFailed=true; if(ch.cascadeLastFail) S.cur.lastFailStreak=1;
    // 🤝 월드 팀 트로피: 점프 실패시 팀원에게 1회용 구원 버프(다음 점프 GOE +2)를 준다.
    if(S.teamMode){
      const mate=teammateOf(p);
      if(mate && !mate.programState.teamRescueAvailable){
        mate.programState.teamRescueAvailable=true;
        S.cur.rollLog.push('🤝 '+p.name+'('+ch.name+') 점프 실패 — 팀원 '+mate.name+'에게 구원 버프(다음 점프 GOE +2)가 생겼습니다.');
      }
    }
    // 낙상(Fall): 기초점은 그대로 두고 GOE -5×팩터를 적용해서 결과적으로 절반만 받게 한다
    let baseFull=j.pendingScoreNormal!==undefined?j.pendingScoreNormal:j.pendingScore;
    // "<<" 다운그레이드: 주사위 12로 실패하면 한 단계 아래 점프의 점수표로 채점
    if(urMark==='<<' && j.level>=2){
      const ratio = charScoreBase(ch, j.level-1, j.type) / charScoreBase(ch, j.level, j.type);
      baseFull = roundScore(baseFull*ratio);
    }
    if(comboCards.some(c=>c.gamble)){ gambleVoid=true; fallGoe=roundScore(-baseFull); scoreDelta=0; } // 올인: 실패시 0점
    else { fallGoe=roundScore(-5*baseFull*0.1); scoreDelta=roundScore(baseFull+fallGoe); }
  }
  (ch.attemptPenalty||[]).forEach(ap=>{ if(ap.types.includes(j.type)) constDelta -= ap.points; });
  elem.subResults=elem.subResults||[]; elem.subResults[k]={success,score:scoreDelta, goe:(success?gb:fallGoe), gambleVoid:(success?false:gambleVoid), urMark:(urMark||undefined)};
  const isRep = dupPenaltyFactor(idx,k)<1;
  elem.subResults[k].isRep = isRep;
  p.constAdj=(p.constAdj||0)+constDelta;
  p.constAdjJump=(p.constAdjJump||0)+constDelta;
  S.cur.rollLog.push((success?'✅':'🧊F')+' 콤보 '+(k===0?'선행':'연결')+' '+jCode(j.level,j.type)+(urMark||'')+' → '+(success?'+'+scoreDelta+(gb!==0?' (GOE '+(gb>0?'+':'')+gb+')':''):'+'+scoreDelta+'점 (GOE '+fallGoe+', 구성점 '+constDelta+')')+(j.guaranteedUsed?' [확정성공 사용]':''));
  if((ch.guaranteedQuad || ch.guaranteedAxel) && j.guaranteedUsed) S.cur.usedGuaranteedQuad=true;
  elem.subStep++;
  render();
}

function confirmComboResult(idx){if(!iAmActive())return;

  const anySuccess=elem.subResults.some(r=>r.success);
  let totalScore=roundScore(elem.subResults.reduce((s,r)=>s+(r.score||0),0));
  const followGenuinelyFailed = elem.subResults.some((r,k)=> k>0 && r.success===false && !r.voided && !r.invalid);
  if(followGenuinelyFailed){
    const goeSum = elem.subResults.reduce((s,r)=>s+(r.goe||0),0);

      elem.subResults.forEach(r=>{ if(r.goe) r.goe=0; });

  S.cur.resolvedIdx++;
  render();
}


/* ---- 관중 선물(인형·꽃) 던지기 ----
   경기 종료(summary) 화면에서 본인이 아닌 사람 누구나(다른 선수·관전자) 던질 수 있다.

   연출된다. re-render가 자주 일어나도 애니메이션이 처음부터 다시 시작되지 않도록, 던진 시각과
   현재 시각의 차이를 음수 animation-delay로 넣어 낙하 중간 지점부터 이어서 그린다. */
function throwGift(item){
  if(!S || !S.cur || S.cur.step!=='summary') return;
  const performerId=S.cur.playerId;
  let byId, byName;
  if(ROOM){
    if(!MY_ID){ alert('먼저 좌석을 선택해주세요.'); return; }
    if(MY_ID===performerId){ alert('본인 경기에는 던질 수 없어요! 관중의 몫으로 남겨주세요 🙂'); return; }
    const me=S.players.find(x=>x.id===MY_ID);
    byId=MY_ID; byName=me?me.name:'관중';
  } else {
    byId='local'; byName='관중';
  }
  S.cur.thrownGifts=S.cur.thrownGifts||[];
  const myCount=S.cur.thrownGifts.filter(g=>g.by===byId).length;
  const limit = byId==='local' ? 12 : 5;
  if(myCount>=limit){ alert('이번 경기에는 더 던질 수 없어요! (1인당 '+limit+'개)'); return; }
  S.cur.thrownGifts.push({
    by:byId, name:byName, item, ts:Date.now(),
    x: 5+Math.random()*88,           // 화면 가로 위치(%)
    rot: ((Math.random()*720-360)|0), // 낙하하며 도는 각도
    dur: (2600+Math.random()*1600)|0, // 낙하 시간(ms)
  });
  render();
}

  </div>`;

function turnSummaryScreen(p,ch){
  const plan=S.cur.plan;
  const techScore=roundScore(plan.reduce((s,e)=> s+(e.result?e.result.score:0),0));
  const phaseKey=S.phase==='short'?'cs':'cf';
  let baseConst = charOf(p)[phaseKey];
  if(p.programState.constOverride && p.programState.constOverride.startsWith('EQUALIZE_')){
    const ownerId=p.programState.constOverride.slice(9);
    const owner=S.players.find(x=>x.id===ownerId);
    if(owner) baseConst = charOf(owner)[phaseKey];
  }
  let constScore = baseConst + (p.constAdj||0);
  const hand=S.phase==='short'?p.handShort:p.handFree;
  if(ch.zeroFailBonus && (p.programState.failCount||0)===0) constScore += ch.zeroFailBonus;
  if(ch.failCountPenalty && (p.programState.failCount||0)>=ch.failCountPenalty.threshold) constScore -= ch.failCountPenalty.penalty;
  if(ch.otherCardBonus) constScore += (p.programState.otherCardsPlayed||0)*ch.otherCardBonus;
  if(S.phase==='free' && p.naturalizationBonus) constScore += p.naturalizationBonus;
  if(constScore<0) constScore=0;
  const cardBonus=roundScore(hand.filter(c=>!c.recycledMark).length*1.5);
  const deductions = p.programState.deductions||0;
  const isWithdrawn = !!S.cur.withdrawn;
  const finalTech = isWithdrawn ? 0 : Math.max(0,techScore);
  const finalConst = isWithdrawn ? 0 : constScore;
  const finalCardBonus = isWithdrawn ? 0 : cardBonus;
  const finalDeductions = isWithdrawn ? 0 : deductions;
  const total = isWithdrawn ? 0 : roundScore(Math.max(0, Math.max(0,techScore)+constScore+cardBonus-deductions));
  const constParts=[`${'기본'} ${baseConst}`];
  if(p.constAdjCard) constParts.push(`${'카드 효과'} ${p.constAdjCard>0?'+':''}${p.constAdjCard}`);
  if(p.constAdjJump) constParts.push(`${'점프 결과'} ${p.constAdjJump>0?'+':''}${p.constAdjJump}`);
  if(ch.zeroFailBonus && (p.programState.failCount||0)===0) constParts.push(`${'무실패 보너스'} +${ch.zeroFailBonus}`);
  if(ch.otherCardBonus && (p.programState.otherCardsPlayed||0)>0) constParts.push(`${'카드 활용 보너스'} +${(p.programState.otherCardsPlayed||0)*ch.otherCardBonus}`);
  if(S.phase==='free' && p.naturalizationBonus) constParts.push(`${'귀화 보너스'} +${p.naturalizationBonus}`);
  const constBreakdown = (!isWithdrawn && constParts.length>1) ? `<p class="small" style="text-align:center;margin-top:6px">${'구성점 내역'}: ${constParts.join(' · ')} = ${constScore}</p>` : '';
  return `<div class="panel">
    <h2>🏁 ${p.name}(${ch.name}) 경기 종료 — ${S.phase==='short'?'쇼트':'프리'}</h2>

    <div class="scoreboard" style="margin-top:8px">
      <div class="sb-top"><span class="sb-name">${p.name} <span class="sb-char">${ch.name}</span></span><span class="sb-live">FINAL</span></div>
      <div class="sb-rows">
        <div class="sb-cell"><div class="sb-label">기술점 TES</div><div class="sb-num">${finalTech}</div></div>
        <div class="sb-cell"><div class="sb-label">구성점 PCS</div><div class="sb-num">${finalConst}</div></div>
        <div class="sb-cell"><div class="sb-label">카드보너스</div><div class="sb-num">${finalCardBonus}</div></div>
        <div class="sb-cell"><div class="sb-label">디덕션</div><div class="sb-num">${finalDeductions?'-'+finalDeductions:0}</div></div>
        <div class="sb-cell"><div class="sb-label">합계</div><div class="sb-num gold">${total}</div></div>
      </div>
    </div>
    ${constBreakdown}
    ${giftPanel()}
    <div class="floatlog">${S.cur.rollLog.map(l=>`<div>${typeof l==='string'?l:l.full}</div>`).join('')}</div>
    <div class="divider"></div>
    <button class="btn-main ${tutorialGlow(true)}" style="width:100%;padding:13px" onclick="finalizeTurn(${finalTech},${finalConst},${finalCardBonus},${total},${finalDeductions})">결과 확정, 다음 선수 →</button>
  </div>`;
}
function retroactiveRecalc(affectedPlayerIds){
  const scoreKey = S.phase==='short'?'scoreShort':'scoreFree';
  const snapKey = S.phase==='short'?'shortProtocol':'freeProtocol';
  const phaseK = S.phase==='short'?'cs':'cf';
  affectedPlayerIds.forEach(pid=>{
    const p=S.players.find(x=>x.id===pid);
    if(!p || p[scoreKey]===null || p[scoreKey]===undefined) return; // hasn't finished this program yet - nothing to fix retroactively
    const snap=p[snapKey];
    if(!snap) return;
    const ch=charOf(p);
    let baseConst=ch[phaseK];
    if(p.programState.constOverride && p.programState.constOverride.startsWith('EQUALIZE_')){
      const ownerId=p.programState.constOverride.slice(9);
      const owner=S.players.find(x=>x.id===ownerId);
      if(owner) baseConst=charOf(owner)[phaseK];
    }
    let constScore=baseConst+(p.constAdj||0);
    if(ch.zeroFailBonus && (p.programState.failCount||0)===0) constScore+=ch.zeroFailBonus;
    if(ch.failCountPenalty && (p.programState.failCount||0)>=ch.failCountPenalty.threshold) constScore-=ch.failCountPenalty.penalty;
    if(ch.otherCardBonus) constScore+=(p.programState.otherCardsPlayed||0)*ch.otherCardBonus;
    if(S.phase==='free' && p.naturalizationBonus) constScore+=p.naturalizationBonus;
    if(constScore<0) constScore=0;
    const hand=S.phase==='short'?p.handShort:p.handFree;
    const cardBonus=roundScore(hand.filter(c=>!c.recycledMark).length*1.5);
    const techScore=snap.techScore;
    const deductions=snap.deductions||0;
    const total=roundScore(Math.max(0, Math.max(0,techScore)+constScore+cardBonus-deductions));
    p[scoreKey]=total; p._consLast=constScore;
    snap.constScore=constScore; snap.cardBonus=cardBonus; snap.total=total;
  });
}
function finalizeTurn(tech,cons,cardBonus,total,deductions){if(!iAmActive())return;
  const p=curPlayer(); const ch=charOf(p);
  if(S.phase==='short') p.scoreShort=total; else p.scoreFree=total;
  p._techLast=tech; p._consLast=cons;
  const protocolSnapshot={
    charName:ch.name, techScore:tech, constScore:cons, cardBonus:cardBonus, deductions:(deductions||0), total:total,
    withdrawn: !!S.cur.withdrawn,
    plan: JSON.parse(JSON.stringify(S.cur.plan)),
  };
  if(S.phase==='short') p.shortProtocol=protocolSnapshot; else p.freeProtocol=protocolSnapshot;
  if(S.cur.withdrawn && S.phase==='short'){ p.freeDQ=true; }
  if(ch.rinkBreak){
    const laterIds=S.order.slice(S.turnIdx+1);
    laterIds.forEach(pid=>{
      const other=S.players.find(x=>x.id===pid);
      if(other && other.programState) other.programState.rinkPenalty=(other.programState.rinkPenalty||0)+1;
    });
  }
  // 카밀라 발리예바 DQ check happens after all short done, at result compile
  nextTurn();
}
function nextTurn(){
  S.turnIdx++;
  if(S.turnIdx>=S.order.length){ compilePhaseResults(); return; }
  startTurn();
}

function elementRowCells(res){
  if(!res) return {base:'—', goe:'—', score:'—', note:''};
  if(res.voided) return {base:'—', goe:'—', score:'0.00', note:'⚠️ 무효'};
  if(!res.success){
    const base=roundScore(res.score-(res.goe||0));
    return {base:base.toFixed(2), goe:res.goe?((res.goe>0?'+':'')+res.goe.toFixed(2)):'0.00', score:res.score.toFixed(2), note: res.gambleVoid?'F (올인 실패)':'F'};
  }
  const base=roundScore(res.score-(res.goe||0));
  return {base:base.toFixed(2), goe:res.goe?('+'+res.goe.toFixed(2)):'0.00', score:res.score.toFixed(2), note:'✅'};
}
function protocolRowsFor(snap, ch, phase, keyPrefix){
  const rows=[];
  snap.plan.forEach((e,i)=>{
    if(e.kind==='combo'){
      const cardsUsed=(e.cards||[]).map(c=>c.name).join(', ');
      e.jumps.forEach((j,ji)=>{
        const r=e.subResults&&e.subResults[ji];
        const cells=elementRowCells(r);
        const lbl=(ji===0?'':'+')+jCode(j.level,j.type,ch)+(r&&r.urMark?r.urMark:'')+repTag(r)+comboFailTag(ji,r,phase);
        rows.push({num: ji===0?(i+1):'', label:lbl+(ji===0 && e.late?' ⏱':'')+(r && !r.success && !r.voided?' F':''), cells, note:cells.note, isComboRow:ji>0, cardsUsed: ji===0?cardsUsed:'', key:keyPrefix+'_'+phase+'_'+i+'_'+ji, elemData: Object.assign({},j,{cards:ji===0?e.cards:[], late:ji===0?e.late:false}), res:r});
      });
      return;
    }
    const res=e.result;
    const cells=elementRowCells(res);
    const cardsUsed=(e.cards||[]).map(c=>c.name).join(', ');
    if(e.kind==='jump'){
      rows.push({num:i+1, label:protocolLabel(e,ch)+(res&&res.urMark?res.urMark:'')+repTag(res)+(e.late?' ⏱':'')+(res && !res.success?' F':''), cells, note:cells.note, cardsUsed, key:keyPrefix+'_'+phase+'_'+i, elemData:e, res});
    } else {
      rows.push({num:i+1, label:protocolLabel(e), cells, note:cells.note, cardsUsed, key:keyPrefix+'_'+phase+'_'+i, elemData:e, res});
    }
  });
  return rows;
}
function protocolCardUsageSummary(plan){
  const rows=[];
  const names={spin:'스핀',step:'StSq',choreo:'ChSq1',choreospin:'ChSp1'};
  (plan||[]).forEach((e,i)=>{
    if(!(e.kind==='jump'||e.kind==='combo'||e.kind==='spin'||e.kind==='step'||e.kind==='choreo'||e.kind==='choreospin')) return;
    const applied=e.cards||[];
    if(!applied.length) return;
    const isJumpKind = e.kind==='jump'||e.kind==='combo';
    const shown=applied.map(c=>{
      const mismatched = (c.scope==='element' && !isJumpKind) || (c.scope==='nonjump' && isJumpKind);
      return `${c.name} — ${c.desc||''}${mismatched?' (무효 — 대상이 아니었어요)':''}`;
    });
    let label;
    if(e.kind==='combo') label = comboCode(e.jumps);
    else if(e.kind==='jump') label = jCode(e.level,e.type);
    else label = (e.kind==='spin' ? (e.spinType||names.spin) : names[e.kind]);
    rows.push(`<div style="margin-bottom:4px">${i+1}번${label?' ('+label+')':''}: ${shown.join(', ')}</div>`);
  });
  if(!rows.length) return '';
  return `<details style="margin-top:10px">
    <summary>${t('🃏 사용된 카드 요약')}</summary>
    <div class="small" style="margin-top:6px">${rows.join('')}</div>
  </details>`;
}

function goFree(){
  // 카밀라 발리예바 DQ check: rank1 in short
  const rows=[...S.players].sort((a,b)=>b.scoreShort-a.scoreShort);
  const top=rows[0];
  if(charOf(top).dqIfShortRank1){ top.freeDQ=true; }
  if(charOf(top).shortRank1RatePenalty){ top.shortRank1PenaltyActive=charOf(top).shortRank1RatePenalty; }
  // a player can be DQ'd if a SPECIFIC other named character finishes 1st in short (e.g. 서민규's 정의구현)
  S.players.forEach(pl=>{
    const dqTarget = charOf(pl).dqIfCharRank1;
    if(dqTarget && charOf(top).name===dqTarget) pl.freeDQ=true;
  });
  // 구고바 귀화: last place in short gets a free-program construction bonus
  const bottom=rows[rows.length-1];
  if(charOf(bottom).lastPlaceShortFreeBonus){ bottom.naturalizationBonus=charOf(bottom).lastPlaceShortFreeBonus; }
  S.order=[...S.players].sort((a,b)=>a.scoreShort-b.scoreShort).map(p=>p.id);
  S.deck=S.deck.length?S.deck:shuffle([...buildDeck(DISRUPT_DEFS,'disrupt'),...buildDeck(BUFF_DEFS,'buff'),...buildDeck(NEUTRAL_DEFS,'neutral')]);
  goOrderScreen('free');
}

function ensureCareer(){
  if(!myProfile) return null;
  if(!myProfile.career) return null;
  // 예전 버전에서 저장됐거나 다른 기기 동기화로 필드가 일부 빠져있을 수 있어서, 없는 필드는
  // 여기서 안전하게 채워넣는다 (렌더링 중 .length 등에서 undefined 접근으로 죽는 걸 방지).
  const c=myProfile.career;
  if(!Array.isArray(c.history)) c.history=[];
  if(typeof c.growthBonus!=='number') c.growthBonus=0;
  if(typeof c.constGrowth!=='number') c.constGrowth=0;
  if(typeof c.growthPoints!=='number') c.growthPoints=0;
  if(typeof c.attempts!=='number') c.attempts=0;
  if(typeof c.stage!=='number') c.stage=0;
  if(!c.displayName) c.displayName='이름 없는 선수';
  if(!c.div) c.div='women';
  if(!c.charId || !CHARACTERS.find(x=>x.id===c.charId)) c.charId=(CHARACTERS.find(x=>x.div===c.div)||CHARACTERS[0]).id;
  if(typeof c.retired!=='boolean') c.retired=false;
  if(typeof c.champion!=='boolean') c.champion=false;
  return c;
}

// 커리어 플레이어 좌석 하나를 만들어주는 공통 헬퍼 - 캐릭터/성장 보너스는 그대로 옮기고, 온라인/AI/
// 솔로 어느 방식으로 대회를 열든 이 좌석 하나는 항상 똑같은 규칙(성장 보너스 훅)을 적용받는다.
function careerMeSeat(career){
  const me=newPlayer(0);
  me.name=career.displayName; me.charId=career.charId;
  me.careerGrowthBonus=career.growthBonus; me.careerConstGrowth=career.constGrowth;
  return me;
}
// 📱 한 폰으로, AI 상대와 (기존 방식 그대로)
function startCareerCompetition(){
  const career=ensureCareer();
  if(!career) return;
  disableSpectateMode();
  ROOM=null; MY_ID=null; isHost=false;
  S=freshGameState();
  S.division=career.div;
  S.careerMode=true;
  S.careerStageIdx=Math.min(career.stage, CAREER_LADDER.length-1);
  const stage=CAREER_LADDER[S.careerStageIdx];
  const me=careerMeSeat(career);
  const pool=CHARACTERS.filter(c=>c.div===career.div && c.id!==career.charId);
  const shuffled=[...pool].sort(()=>Math.random()-0.5);
  const aiPlayers=[];
  for(let i=0;i<stage.aiCount;i++){
    const c=shuffled[i%shuffled.length];
    const ai=newPlayer(i+1);
    ai.name=c.name; ai.charId=c.id; ai.isAI=true;
    ai.careerGrowthBonus=stage.aiTierBonus; // AI 상대 난이도 조절 (커리어 플레이어와 같은 안전한 훅 재사용)
    aiPlayers.push(ai);
  }
  S.players=[me, ...aiPlayers];
  enableSpectateMode();
  startGame();
}
// 🧍 혼자 연습 - 상대 없이 이 대회 하나만 클린하게 뛰어보는 모드. 순위는 항상 1위/1명이라
// 진출 조건(상위 N위)은 쉽게 통과하지만, 얻는 성장치는 다른 방식과 동일하게 순위 기반으로 계산된다.
function startCareerSolo(){
  const career=ensureCareer();
  if(!career) return;
  disableSpectateMode();
  ROOM=null; MY_ID=null; isHost=false;
  S=freshGameState();

  S.careerMode=true;
  S.practiceMode=true;

// 🌐 온라인으로 방 만들기 - 커리어 선수 본인 좌석만 미리 채워서 방을 열고, 그 외 좌석은 실제 다른
// 사람들이 접속해서 자기 캐릭터를 직접 고르고 들어온다(일반 온라인 방과 완전히 같은 참가 방식).
// 커리어 좌석(0번)은 setupScreen에서 캐릭터를 바꿀 수 없게 잠가서, 실수로 다른 캐릭터를 골라
// 성장 보너스가 엉뚱한 캐릭터에 붙는 일이 없게 한다.
function startCareerOnline(){
  const career=ensureCareer();
  if(!career) return;
  if(!rtcSupported()){ alert('이 브라우저/앱은 실시간 연결(WebRTC)을 지원하지 않아요.'); return; }
  if(!peerJsAvailable()){ alert('연결 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 페이지를 새로고침 해주세요.'); return; }
  const stageIdx=Math.min(career.stage, CAREER_LADDER.length-1);
  const stage=CAREER_LADDER[stageIdx];
  isHost=true; ROOM='ONLINE'; MY_ID=null; S=freshGameState();
  S.division=career.div;
  S.careerMode=true;
  S.careerStageIdx=stageIdx;
  S.roomTitle=('커리어 - '+stage.name).slice(0,40);
  S.players=[careerMeSeat(career)];
  hostOpenRoom();
  enableSpectateMode();

// 대회가 끝나고 finalScreen에서 "커리어 결과 보기"를 누르면 호출 - 순위 계산, 성장 적용, 진출 여부 판정
function applyCareerResult(){
  const career=ensureCareer();
  if(!career || !S.careerMode) return null;
  if(S._careerApplied) return S._careerResult;
  if(!S.players || !S.players.length) return null;
  // 온라인 방에 참여한 다른 실제 참가자의 기기에서는 절대 실행되면 안 된다 - 커리어 좌석(0번)을
  // 실제로 조작하는 이 기기(호스트 본인)에서만 성장/기록을 적용한다.
  if(ROOM && MY_ID && S.players[0] && MY_ID!==S.players[0].id) return null;
  const stage=CAREER_LADDER[S.careerStageIdx];
  if(!stage) return null;
  S._careerApplied=true;
  const rows=[...S.players].map(p=>({p, total:roundScore((p.scoreShort||0)+(p.freeDQ?0:(p.scoreFree||0)))}));
  rows.sort((a,b)=>b.total-a.total);
  const me=S.players[0];
  const rank=rows.findIndex(r=>r.p.id===me.id)+1;
  const myTotal=rows.find(r=>r.p.id===me.id).total;
  const advanced = rank<=stage.needTop;
  const isWorldsWin = stage.id==='worlds' && rank===1;
  // 성장치: 순위가 좋을수록 더 많이 성장
  const growthAdd = rank===1?0.3:rank===2?0.2:rank===3?0.1:0.05;
  const constAdd = rank===1?1.5:rank===2?1.0:rank===3?0.5:0.2;
  career.growthBonus=roundScore(Math.min(3, career.growthBonus+growthAdd));
  career.constGrowth=roundScore(career.constGrowth+constAdd);
  career.growthPoints=(career.growthPoints||0)+(advanced?2:1);
  career.attempts=(career.attempts||0)+1;
  career.history.push({stageName:stage.name, rank, total_players:S.players.length, total:myTotal, ts:Date.now()});
  if(advanced && stage.id!=='worlds') career.stage=Math.min(CAREER_LADDER.length, career.stage+1);
  if(isWorldsWin){ career.champion=true; recordCareerChampion(career, myTotal); }
  saveCareer(career);
  S._careerResult={rank, total:myTotal, totalPlayers:S.players.length, advanced, isWorldsWin, stageName:stage.name, growthAdd, constAdd, interview:careerInterviewFor(rank, advanced, isWorldsWin)};
  return S._careerResult;
}
function careerInterviewFor(rank, advanced, isWorldsWin){
  if(isWorldsWin) return {q:'기자: 드디어 세계 챔피언이네요! 소감이 어떠신가요?', a:'"이 순간을 위해 달려왔습니다. 모든 게 꿈만 같아요."'};
  if(rank===1) return {q:'기자: 우승 축하드려요! 다음 목표는요?', a:'"자신감이 붙었어요. 다음 무대에서도 최선을 다하겠습니다."'};
  if(advanced) return {q:'기자: 다음 단계 진출을 확정지었는데, 각오 한마디?', a:'"여기서 만족하지 않고 더 높은 곳을 보겠습니다."'};
  return {q:'기자: 아쉬운 결과였는데, 다음 시즌 계획은?', a:'"부족한 부분을 보완해서 다시 도전하겠습니다."'};
}

  </div>`;

var CAREER_CHAMPIONS_KEY='sqfs_career_champions_v1';
function loadCareerChampions(){ try{ const raw=localStorage.getItem(CAREER_CHAMPIONS_KEY); return raw?(JSON.parse(raw)||[]):[]; }catch(e){ return []; } }
function saveCareerChampionsList(list){ try{ localStorage.setItem(CAREER_CHAMPIONS_KEY, JSON.stringify(list)); }catch(e){} }
async function cloudRecordCareerChampion(entry){
  if(!cloudEnabled()) return;
  try{ await fetch(cloudUrl('careerChampions/'+entry.ts), {method:'PUT', body:JSON.stringify(entry)}); }catch(e){ console.error('cloud career champion save failed', e); }
}
var cloudCareerChampions=null, cloudCareerLastFetch=0;
async function cloudFetchCareerChampions(force){
  if(!cloudEnabled()) return;
  if(!force && Date.now()-cloudCareerLastFetch<15000) return;
  cloudCareerLastFetch=Date.now();
  try{
    const res=await fetch(cloudUrl('careerChampions'));
    const data=cloudUnwrap(await res.json());
    if(!(data && data.__cloudError)) cloudCareerChampions = data ? Object.values(data).filter(Boolean) : [];
  }catch(e){}
  renderRemote();
}
function recordCareerChampion(career, total){
  const ch=CHARACTERS.find(c=>c.id===career.charId)||{name:career.charId};
  const entry={name:career.displayName, charName:ch.name, total, attempts:career.attempts, ts:Date.now()};
  const local=loadCareerChampions(); local.push(entry); saveCareerChampionsList(local);
  cloudRecordCareerChampion(entry);
}
function careerChampionsPanel(){
  if(cloudEnabled()) cloudFetchCareerChampions();
  const local=loadCareerChampions().filter(Boolean);
  const merged={};
  local.forEach(e=>{ if(e) merged[e.ts]=e; });
  if(cloudEnabled()) (cloudCareerChampions||[]).forEach(e=>{ if(e) merged[e.ts]=e; });
  const list=Object.values(merged).filter(Boolean).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,15);
  if(!list.length) return `<p class="small" style="opacity:.6;margin-top:8px">아직 월드 챔피언이 없어요. 첫 번째 주인공이 되어보세요!</p>`;
  return `<table style="margin-top:8px"><tr><th>선수</th><th>스타일</th><th>우승 점수</th><th>도전 횟수</th></tr>
    ${list.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.charName||'')}</td><td><b>${e.total}</b></td><td>${e.attempts||'—'}</td></tr>`).join('')}
  </table>`;
}


/* ---- Today's score ranking (per-device, resets daily; stored in localStorage since this app has no server) ---- */
var TODAY_SCORES_KEY='sqfs_today_scores_v1';

/* ---- ☁️ Cloud ranking sync (Firebase Realtime Database REST API - no SDK needed) ----
   Only active when CLOUD_DB_URL is set at the top of this file. Uses plain fetch() against the
   database's REST endpoints, so there's nothing to install and nothing breaks when it's off. */
var cloudTodayScores=null;    // latest fetched cloud snapshot (array) or null if never fetched
var cloudPersonalBests=null;  // latest fetched cloud snapshot (map) or null
var cloudOverallBest=null;    // latest fetched cloud snapshot (single record) or null
var cloudLastFetch=0;
var cloudStatus='';           // '' | 'loading' | 'ok' | 'error'
function cloudEnabled(){ return typeof CLOUD_DB_URL==='string' && CLOUD_DB_URL.trim().length>0; }
function cloudUrl(path){ return CLOUD_DB_URL.trim().replace(/\/+$/,'')+'/'+path+'.json'; }
// Firebase's REST API returns HTTP 200 with a body like {"error":"Permission denied"} when the
// security rules block a path - fetch() does NOT treat that as a failure (no network error), so
// without this check that error object gets silently parsed as if it were real data. This is what
// made "열려있는 방 찾기" (and friends) look like "there's just nothing here" instead of surfacing
// the real problem, whenever a path's rules hadn't been opened up yet.
function cloudUnwrap(data){
  if(data && typeof data==='object' && !Array.isArray(data) && typeof data.error==='string') return {__cloudError:data.error};
  return data;
}
// Best-record entries used to be a flat {total,name,...} object (combined score only). Now they're
// {combined:{...}, short:{...}, free:{...}}. Old saved/cloud data is migrated on read so nothing
// that was already recorded gets lost.
function normalizeBestRecord(rec){
  if(!rec) return rec;
  if(rec.combined || rec.short || rec.free) return rec;
  if(rec.total!==undefined) return {combined:rec};
  return rec;
}
function normalizeBestsMap(map){
  const out={};
  Object.keys(map||{}).forEach(k=>{ out[k]=normalizeBestRecord(map[k]); });
  return out;
}
async function cloudFetchRankings(force){
  if(!cloudEnabled()) return;
  if(!force && Date.now()-cloudLastFetch<15000) return; // don't hammer the server on every re-render
  cloudLastFetch=Date.now();
  cloudStatus='loading';
  try{
    const [scoresRes, bestsRes, overallRes] = await Promise.all([
      fetch(cloudUrl('todayScores/'+todayDateStr())),
      fetch(cloudUrl('personalBests')),
      fetch(cloudUrl('overallBest')),
    ]);
    const scoresData = cloudUnwrap(await scoresRes.json());
    const bestsData = cloudUnwrap(await bestsRes.json());
    const overallData = cloudUnwrap(await overallRes.json());
    const anyPermissionError = [scoresData,bestsData,overallData].some(d=>d && d.__cloudError);
    if(anyPermissionError){
      console.error('cloud permission error - check Firebase rules cover: todayScores, personalBests, overallBest');
      cloudStatus='error';
    } else {
      cloudTodayScores = scoresData ? Object.values(scoresData) : [];
      cloudPersonalBests = normalizeBestsMap(bestsData || {});
      cloudOverallBest = normalizeBestRecord(overallData) || null;
      cloudStatus='ok';
    }
  }catch(e){
    console.error('cloud fetch failed', e);
    cloudStatus='error';
  }
  renderRemote();
}
async function cloudRecordScores(newEntries, bestsMap, overallCandidate){
  if(!cloudEnabled()) return;
  try{
    // append each game result to today's list - PUT with our own entry.id as the key (instead of
    // POST-ing to an auto-generated key) so a single entry can be found and deleted later
    await Promise.all(newEntries.map(entry=>
      fetch(cloudUrl('todayScores/'+todayDateStr()+'/'+entry.id), {method:'PUT', body:JSON.stringify(entry)})
    ));
    // personal bests: merge category by category (combined/short/free) with the server's current
    // record, keeping whichever is higher per category - safe even if two devices record at once
    for(const charId of Object.keys(bestsMap)){
      const mine=bestsMap[charId]; // {combined,short,free} - each may or may not be present
      try{
        const res=await fetch(cloudUrl('personalBests/'+encodeURIComponent(charId)));
        const raw=cloudUnwrap(await res.json());
        const current=(raw && !raw.__cloudError) ? (normalizeBestRecord(raw)||{}) : {};
        let changed=false; const merged=Object.assign({}, current);
        ['combined','short','free'].forEach(cat=>{
          if(mine[cat] && (!current[cat] || mine[cat].total>current[cat].total)){ merged[cat]=mine[cat]; changed=true; }
        });
        if(changed) await fetch(cloudUrl('personalBests/'+encodeURIComponent(charId)), {method:'PUT', body:JSON.stringify(merged)});
      }catch(e){ console.error('cloud best update failed for', charId, e); }
    }
    // overall (any character) best record - same per-category merge
    if(overallCandidate){
      try{
        const res=await fetch(cloudUrl('overallBest'));
        const raw=cloudUnwrap(await res.json());
        const current=(raw && !raw.__cloudError) ? (normalizeBestRecord(raw)||{}) : {};
        let changed=false; const merged=Object.assign({}, current);
        ['combined','short','free'].forEach(cat=>{
          if(overallCandidate[cat] && (!current[cat] || overallCandidate[cat].total>current[cat].total)){ merged[cat]=overallCandidate[cat]; changed=true; }
        });
        if(changed) await fetch(cloudUrl('overallBest'), {method:'PUT', body:JSON.stringify(merged)});
      }catch(e){ console.error('cloud overall best update failed', e); }
    }
    cloudFetchRankings(true); // refresh the view with the merged server truth
  }catch(e){ console.error('cloud record failed', e); }
}

function deleteTodayScoreEntry(entryId){
  if(!confirm('이 기록 하나만 삭제할까요?')) return;
  const cloud=cloudEnabled();
  if(cloud){
    cloudTodayScores = (cloudTodayScores||[]).filter(e=>entryKey(e)!==entryId);
    cloudDeleteTodayScoreEntry(entryId);
  } else {
    // always update this device's persisted copy (works even when browsing rankings from the
    // lobby, where there's no active S yet - previously this silently no-op'd there)
    const remaining = (S ? (S.sharedTodayScores||[]) : loadTodayScores()).filter(e=>entryKey(e)!==entryId);
    saveTodayScores(remaining);
    if(S){
      S.sharedTodayScores = remaining;
      // tombstone the id so a stale/longer snapshot from a peer can't resurrect it on next sync
      S.deletedTodayScoreIds = S.deletedTodayScoreIds||[];
      if(!S.deletedTodayScoreIds.includes(entryId)) S.deletedTodayScoreIds.push(entryId);
    }
  }
  if(S) render(); else render(true);
}

   Only meaningful when CLOUD_DB_URL is set. The actual game connection is still PeerJS (this
   just helps a guest FIND a room code without having to be told it out of band). */
var cloudRoomHeartbeatTimer=null;
function roomModeOf(){
  if(!S) return 'regular';
  if(S.careerMode) return 'career';
  if(S.teamMode) return 'team';
  if(S.worldsMode) return 'worlds';
  if(S.gpfMode) return 'gpf';
  return 'regular';
}
function cloudRegisterRoom(code){
  if(!cloudEnabled() || !code) return;
  // +1 counts the host itself, so a room that's just been opened (host waiting, no guests yet)
  // correctly shows "참가자 1명" instead of a misleading "0명" - only truly abandoned rooms
  // (heartbeat stopped entirely) end up looking empty, and those get cleaned up below.
  const payload={code, ts:Date.now(), playerCount:1+Object.values(hostPeers).filter(hp=>hp.status==='connected').length, division:(S&&S.division)||null, title:(S&&S.roomTitle)||'', mode:roomModeOf()};
  fetch(cloudUrl('activeRooms/'+code), {method:'PUT', body:JSON.stringify(payload)}).catch(e=>console.error('cloud room register failed',e));
}
function cloudStartRoomHeartbeat(code){
  cloudStopRoomHeartbeat();
  if(!cloudEnabled()) return;
  cloudRoomHeartbeatTimer=setInterval(()=>cloudRegisterRoom(code), 20000);
}
function cloudStopRoomHeartbeat(){ clearInterval(cloudRoomHeartbeatTimer); cloudRoomHeartbeatTimer=null; }
function cloudUnregisterRoom(code){
  if(!cloudEnabled() || !code) return;
  fetch(cloudUrl('activeRooms/'+code), {method:'DELETE'}).catch(e=>console.error('cloud room unregister failed',e));
}
var cloudActiveRooms=null, cloudRoomsLastFetch=0, cloudRoomsStatus='';
async function cloudFetchActiveRooms(force){
  if(!cloudEnabled()) return;
  if(!force && Date.now()-cloudRoomsLastFetch<10000) return; // don't hammer the server on every re-render
  cloudRoomsLastFetch=Date.now();
  cloudRoomsStatus='loading';
  try{
    const res=await fetch(cloudUrl('activeRooms'));
    const data=cloudUnwrap(await res.json());
    if(data && data.__cloudError){
      console.error('cloud permission error - check Firebase rules cover the "activeRooms" path');
      cloudRoomsStatus='error';
    } else {
      const now=Date.now();
      const all = data ? Object.values(data).filter(r=>r && r.code) : [];
      // a room that hasn't heartbeat-ed in 90s is treated as dead (host closed the tab without
      // ever calling leaveRoom, so the DELETE never fired) - clean those up for everyone right now
      // instead of just hiding them locally, so the server list doesn't grow forever
      const stale = all.filter(r=>(now-(r.ts||0))>=90000);
      stale.forEach(r=>fetch(cloudUrl('activeRooms/'+r.code), {method:'DELETE'}).catch(()=>{}));
      cloudActiveRooms = all.filter(r=>(now-(r.ts||0))<90000);
      cloudRoomsStatus='ok';
    }
  }catch(e){
    console.error('cloud room fetch failed', e);
    cloudRoomsStatus='error';
  }
  renderRemote();
}

  return `<div class="charbox" style="margin-top:10px">

        <span class="small">${r.title?'<b>'+esc(r.title)+'</b> · ':''}방 ${esc(r.code)} ${r.division?'· '+(r.division==='women'?'여자싱글':'남자싱글'):''} · 인원 ${r.playerCount||1}명(호스트 포함)</span>
        <button class="btn-ghost btn-sm" onclick="guestConnect('${esc(r.code)}')">참가하기</button>
      </div>`).join('') : `<p class="small" style="opacity:.6">지금 열려있는 방이 없어요.</p>`}
    <button class="btn-ghost btn-sm" style="margin-top:8px" onclick="cloudFetchActiveRooms(true)">${headerIcon('refresh')}새로고침</button>
  </div>`;
}

var profileSyncStatus='';       // '' | 'saving' | 'ok' | 'error' - 저장이 실제로 서버에 반영됐는지 눈에 보이게
async function cloudSyncProfile(p){
  if(!cloudEnabled()){ profileSyncStatus=''; return; }
  profileSyncStatus='saving';
  try{
    const res=await fetch(cloudUrl('playerProfiles/'+profileKey(p.name)), {method:'PUT', body:JSON.stringify(p)});
    const data=cloudUnwrap(await res.json().catch(()=>null));
    if(data && data.__cloudError){ console.error('cloud profile save permission error - check Firebase rules cover "playerProfiles"'); profileSyncStatus='error'; }
    else profileSyncStatus='ok';
  }catch(e){ console.error('cloud profile save failed', e); profileSyncStatus='error'; }
  renderRemote();
}
async function loginProfile(name,pin){
  name=(name||'').trim().slice(0,20);
  pin=(pin||'').trim();
  if(!name){ alert('이름을 입력해주세요.'); return; }
  if(!/^\d{4}$/.test(pin)){ alert('비밀번호는 숫자 4자리로 입력해주세요.'); return; }
  profileLoginStatus='loading'; render(true);
  if(!cloudEnabled()){
    // 서버가 없으면 이 기기에서만 쓰는 로그인 (기기 캐시 재사용)
    const cached=loadProfileLocal();
    myProfile = (cached && cached.name===name) ? cached : freshProfileObj(name,pin);
    saveLoginSession(name,pin); saveProfileLocal(myProfile);
    profileLoginStatus=''; render();
    return;
  }
  try{
    const res=await fetch(cloudUrl('playerProfiles/'+profileKey(name)));
    const data=cloudUnwrap(await res.json());
    if(data && data.__cloudError){ profileLoginStatus='error'; render(); alert('서버 연결에 실패했어요.'); return; }
    if(data){
      if(String(data.pin)!==pin){ profileLoginStatus=''; render(); alert('비밀번호가 틀렸어요.'); return; }
      myProfile=data;
    } else {
      myProfile=freshProfileObj(name,pin);
      cloudSyncProfile(myProfile); // 새 계정 등록
    }
    saveLoginSession(name,pin); saveProfileLocal(myProfile);
    profileLoginStatus='';
    render();
  }catch(e){ console.error(e); profileLoginStatus='error'; render(); }
}

function refreshMyProfileFromCloud(){
  if(!cloudEnabled() || !myProfile) return;
  // 서버가 더 "최신"일 때만 덮어쓴다 (updatedTs 비교) - 안 그러면 방금 한 로컬 수정이
  // 나중에 도착한 낡은 fetch 결과에 덮여 없어지는 경쟁 상태(레이스 컨디션)가 생김
  fetch(cloudUrl('playerProfiles/'+profileKey(myProfile.name))).then(r=>r.json()).then(raw=>{
    const remote=cloudUnwrap(raw);

  }).catch(()=>{});
}

function placementPointsFor(mode, rank, totalPlayers){
  const table = mode==='worlds' ? {1:15,2:10,3:5} : mode==='gpf' ? {1:10,2:5,3:3} : {1:2,2:1,3:1};
  if(totalPlayers<=1) return Math.round((table[1]||0)*0.4);
  return table[rank] || 0;
}
function updateMyProfileAfterGame(info){
  if(!myProfile) return; // 로그인 안 한 상태면 기록할 프로필이 없음
  myProfile.games=(myProfile.games||0)+1;
  if(info.totalPlayers>1 && info.rank===1) myProfile.wins=(myProfile.wins||0)+1;
  if(info.totalPlayers>1 && info.rank<=3) myProfile.podiums=(myProfile.podiums||0)+1;
  if(info.isPB) myProfile.pbCount=(myProfile.pbCount||0)+1;
  if(info.perfectSP) myProfile.perfectSP=(myProfile.perfectSP||0)+1;
  const placementPts = placementPointsFor(info.mode||'regular', info.rank, info.totalPlayers);
  myProfile.seasonPoints=(myProfile.seasonPoints||0)+placementPts;
  if(info.combinedTotal>(myProfile.bestPB||0)) myProfile.bestPB=info.combinedTotal;
  myProfile.updatedTs=Date.now();
  saveProfileLocal(myProfile); cloudSyncProfile(myProfile);
}

    const table=all[charId]||{};
    const conquered=Object.keys(table).filter(k=>table[k] && table[k].conquered).sort();
    const mastered=Object.keys(table).filter(k=>table[k] && table[k].mastered && !table[k].conquered).sort();
    const inProgress=Object.keys(table).filter(k=>table[k] && !table[k].mastered && table[k].count>0).sort((a,b)=>table[b].count-table[a].count);
    if(!conquered.length && !mastered.length && !inProgress.length) return;
    const chName=(CHARACTERS.find(c=>c.id===charId)||{}).name || charId;
    rows.push(`<div style="margin-top:6px">

      ${inProgress.length?`<div class="small" style="margin-top:3px;opacity:.75">${inProgress.slice(0,6).map(k=>`${esc(k)} ${table[k].count}/${MASTERY_THRESHOLD}`).join(' · ')}</div>`:''}
    </div>`);
  });
  if(!rows.length) return '';
  return `<div class="divider"></div>
    <b class="small">🏅 숙련도 <span style="opacity:.6;font-weight:400">(캐릭터별)</span></b>

/* ---- 🔥 훈련실 ----
   "연습"으로 숙련도만 올리는 모드. 실전 경기 상태(S)를 전혀 건드리지 않고, 캐릭터/점프를 골라
   가상으로 한 번 굴려본다. 성공하면 실전과 똑같이 숙련도 카운트가 올라가고(10회 통달 시 GOE+1
   영구 획득), 무한 노가다를 막기 위해 하루 5회로 제한한다(이 기기 기준, 날짜가 바뀌면 초기화). */
var TRAINING_DAILY_LIMIT=5;
var TRAINING_KEY='sqfs_training_v1';
function loadTrainingState(){
  try{ const raw=localStorage.getItem(TRAINING_KEY); const st=raw?JSON.parse(raw):null;
    if(st && st.date===todayDateStr()) return st;
  }catch(e){}
  return {date:todayDateStr(), count:0};
}
function saveTrainingState(st){ try{ localStorage.setItem(TRAINING_KEY, JSON.stringify(st)); }catch(e){} }
function trainingUsesLeft(){ const st=loadTrainingState(); return Math.max(0, (TRAINING_DAILY_LIMIT+(st.bonus||0))-st.count); }
// 훈련실은 실전 좌석(ROOM/MY_ID)과 무관한 개인 활동이므로, masteryGoeMods()의 "내 좌석일 때만" 제한 없이
// 지금 훈련 중인 캐릭터의 통달 목록을 그대로 반영한다.
function trainingGoeMods(charId){
  const table=masteryFor(charId);
  const out=[];
  Object.keys(table).forEach(key=>{
    if(table[key].mastered){
      const level=parseInt(key[0],10); const type=key.slice(1);
      out.push({types:[type], level, bonus:1});
    }
  });
  return out;
}
var trainingCharId=null, trainingLevel=3, trainingType='T', trainingResult=null;
function setTrainingChar(id){ trainingCharId=id; trainingResult=null; render(true); }
function setTrainingLevel(l){ trainingLevel=parseInt(l,10); trainingResult=null; render(true); }
function setTrainingType(ty){ trainingType=ty; trainingResult=null; render(true); }
function doTraining(){
  if(!myProfile) return;
  const st=loadTrainingState();
  if(st.count>=TRAINING_DAILY_LIMIT+(st.bonus||0)) return;
  st.count++; saveTrainingState(st);
  const ch=CHARACTERS.find(c=>c.id===trainingCharId)||CHARACTERS[0];
  const trainP={id:'training', programState:freshProgramState()};
  const info=computeElementRate(trainP, ch, {level:trainingLevel, type:trainingType, late:false, elemIndexAmongJumps:0, totalJumpElems:1, isCombo:false}, true, false);
  const rate=Math.max(0, Math.min(12, info.rate));
  const roll=Math.floor(Math.random()*12)+1;
  const urRoll=Math.floor(Math.random()*12)+1; // 겨우 성공/쿼터부족 확인용 추가 주사위
  const success=roll<=rate;
  const key=trainingLevel+''+trainingType;
  let goe=0, newlyMastered=false, newlyConquered=false, alreadyDone=false;
  if(success){
    goe=charGOE(ch, trainingType, rate, roll, trainingLevel, null, false, 0, 0, trainingGoeMods(ch.id), urRoll);
    migrateJumpMastery(myProfile);
    myProfile.jumpMastery=myProfile.jumpMastery||{};
    const table=myProfile.jumpMastery[ch.id]=myProfile.jumpMastery[ch.id]||{};
    const rec=table[key]=table[key]||{count:0,mastered:false,conquered:false};
    if(rec.conquered){ alreadyDone=true; }
    else{
      rec.count++;
      if(!rec.mastered && rec.count>=MASTERY_THRESHOLD){ rec.mastered=true; newlyMastered=true; }
      if(!rec.conquered && rec.count>=CONQUER_THRESHOLD){ rec.count=CONQUER_THRESHOLD; rec.conquered=true; newlyConquered=true; }
      saveProfileLocal(myProfile); cloudSyncProfile(myProfile);
    }
  }
  trainingResult={success, roll, rate, goe, key, charName:ch.name, newlyMastered, newlyConquered, alreadyDone};
  render(true);
}
function trainingResultHTML(r){
  return `<div class="charbox" style="margin-top:8px;text-align:center">
    <div class="dice ${r.success?'success':'fail'}" style="margin:0 auto">${r.roll}</div>
    <p style="margin-top:6px">${r.success?`✅ 성공! GOE ${r.goe>=0?'+':''}${r.goe}`:'❌ 실패'}</p>
    ${r.newlyMastered?`<p style="color:var(--gold2);font-weight:700;margin-top:4px">🏅 ${esc(r.charName||'')} ${esc(r.key)} 통달! GOE +1 영구 획득</p>`:''}
    ${r.newlyConquered?`<p style="color:var(--gold2);font-weight:700;margin-top:4px">👑 ${esc(r.charName||'')} ${esc(r.key)} 정복! 성공률 +1/12 영구 획득</p>`:''}
    ${r.success && r.alreadyDone?`<p class="small" style="opacity:.7;margin-top:4px">이미 정복한 점프예요 (GOE +1, 성공률 +1/12 항상 적용 중)</p>`:''}

    } else if(e.kind==='combo' && e.jumps && e.subResults){
      e.jumps.forEach((j,k)=>{
        const r=e.subResults[k]; if(!r) return;
        const key=j.level+''+j.type;
        const t=tally[key]=tally[key]||{attempts:0,success:0,maxGoe:null};

function careerSparkline(games){
  if(!games.length) return `<p class="small" style="opacity:.6">그래프를 그릴 기록이 아직 없어요.</p>`;
  const w=280,h=64,pad=8;
  const scores=games.map(g=>g.total);
  const mn=Math.min(...scores), mx=Math.max(...scores);
  const range=(mx-mn)||1;
  const stepX=games.length>1?(w-2*pad)/(games.length-1):0;
  const pt=(s,i)=>{ const x=pad+i*stepX; const y=h-pad-((s-mn)/range)*(h-2*pad); return [x,y]; };
  const pts=scores.map((s,i)=>pt(s,i));
  const path='M'+pts.map(([x,y])=>x.toFixed(1)+','+y.toFixed(1)).join(' L');
  const dots=pts.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="#c9a13b"></circle>`).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="margin-top:6px;background:#f4f7fa;border-radius:6px">
    <path d="${path}" fill="none" stroke="#c9a13b" stroke-width="2"></path>${dots}
  </svg>`;
}

// 흔들리기 쉬운 "누적 합계" 상태를 관리하는 대신, 매번 원본 로그에서 다시 계산해 항상 정직하다)
function seasonAggregateRows(entries){
  const map={};
  entries.forEach(e=>{
    const key=e.name;
    if(!map[key]) map[key]={name:e.name, isAI:!!e.isAI, games:0, wins:0, podiums:0, totalScore:0, scoreCount:0, bestScore:0, seasonPoints:0, charUsage:{}};
    const row=map[key];
    row.games++;
    if(e.rank===1) row.wins++;
    if(e.rank && e.rank<=3) row.podiums++;
    if(typeof e.total==='number'){ row.totalScore+=e.total; row.scoreCount++; if(e.total>row.bestScore) row.bestScore=e.total; }
    if(e.charId) row.charUsage[e.charId]=(row.charUsage[e.charId]||0)+1;
    row.seasonPoints += placementPointsFor(e.mode||'regular', e.rank||99, e.totalPlayers||1);
  });
