var charTraitsPanelOpen=false;
var chatPanelOpen=false;
function charTraitsPanel(){
  if(!S || !S.players || !S.players.length) return '';
  const list = (S.order && S.order.length===S.players.length) ? S.order.map(pid=>S.players.find(p=>p.id===pid)) : S.players;
  return `<div class="panel" style="padding:10px 14px;">
    <details ${charTraitsPanelOpen?'open':''} ontoggle="charTraitsPanelOpen=this.open">
      <summary>🧑‍🎤 캐릭터 특성 보기 (전체 선수)</summary>
      ${list.filter(Boolean).map(p=>{
        const ch=charOf(p);
        if(!ch) return '';
        const base=baseCharOf(p);
        const nameLabel = (base && base.id!==ch.id) ? `${base.name}(${ch.name} 복제)` : ch.name;
        return `<div class="charbox" style="margin-top:6px"><b>${p.name} — ${nameLabel}</b><div style="margin-top:4px">${formatCharText(ch.text)}</div></div>`;
      }).join('')}
    </details>
  </div>`;
}
var chatDraftText='';
function sendChatMessage(){
  const box=document.getElementById('chatInputBox');
  const text=((box?box.value:chatDraftText)||'').trim();
  if(!text) return;
  const sender = S.players.find(p=>p.id===MY_ID);
  const senderName = sender ? sender.name : (isHost?'호스트':'참가자');
  S.chatMessages=S.chatMessages||[];
  // stable unique id so the merge on incoming updates can union both sides' messages instead of
  // one side's list overwriting the other's (that's what used to make just-sent chat vanish)
  const mid = (MY_ID||'anon')+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  S.chatMessages.push({mid, senderId:MY_ID, senderName, text, time:Date.now()});
  if(S.chatMessages.length>100) S.chatMessages=S.chatMessages.slice(-100);
  chatDraftText='';
  chatPanelOpen=true;
  render();
}
function chatPanel(){
  const msgs=S.chatMessages||[];
  return `<details style="margin-top:8px" ${chatPanelOpen?'open':''} ontoggle="chatPanelOpen=this.open">
    <summary>💬 채팅 ${msgs.length?'('+msgs.length+')':''}</summary>
    <div id="chatMessagesBox" style="max-height:180px;overflow-y:auto;margin-top:6px;padding:6px;background:#f4f7fa;border-radius:8px">
      ${msgs.length?msgs.map(m=>`<div class="small" style="margin-bottom:4px"><b style="color:var(--rink2)">${esc(m.senderName)}${m.senderId===MY_ID?' (나)':''}</b>: ${esc(m.text)}</div>`).join(''):'<div class="small" style="opacity:.6">아직 채팅이 없어요.</div>'}
    </div>
    <div class="row" style="margin-top:6px">
      <input type="text" id="chatInputBox" placeholder="메시지 입력..." value="${esc(chatDraftText)}" oninput="chatDraftText=this.value" style="flex:1;padding:6px;border-radius:8px;border:1px solid #c7d5e2" onkeydown="if(event.key==='Enter'){sendChatMessage();}">
      <button class="btn-ghost btn-sm" onclick="sendChatMessage()">전송</button>
    </div>
  </details>`;
}

function screenHTML(){
  if(!S) return lobbyScreen();
  if(S.screen==='setup') return seatBar()+setupScreen();
  if(S.screen==='clone') return seatBar()+cloneScreen();
  if(S.screen==='order') return seatBar()+orderScreen();
  if(S.screen==='dealing') return seatBar()+dealingScreen();
  if(S.screen==='dohajin') return seatBar()+dohajinScreen();
  if(S.screen==='magicianDraw') return seatBar()+magicianDrawScreen();
  if(S.screen==='charIntro') return seatBar()+charIntroScreen();
  if(S.screen==='allPlan'){
    if(myPrePlanningView && S.cur && S.cur.isPrePlanning && S.cur.playerId===myPrePlanningView){
      const pv=S.players.find(x=>x.id===myPrePlanningView);
      return seatBar()+planScreen(pv, charOf(pv));
    }
    myPrePlanningView=null; // stale local view (e.g. plan got locked/reset elsewhere) - fall back to the list
    return seatBar()+allPlanScreen();
  }
  if(S.screen==='turn') return seatBar()+turnScreen();
  if(S.screen==='phaseResult') return seatBar()+phaseResultScreen();
  if(S.screen==='final') return seatBar()+((S.careerMode && (!ROOM || (S.players[0] && MY_ID===S.players[0].id)))?careerFinalScreen():finalScreen());
  return '';
}

    body=`이제 본인 차례예요! 점프·스핀·스텝을 순서대로 추가해서 "플랜시트"를 완성해보세요. 악셀 계열은 단독으로 최소 1번 꼭 넣어야 해요. 다 되면 "플랜시트 확정"을 눌러주세요.`;

    title='6단계 · 카드 사용';
    body=`가진 카드를 써볼 수 있는 단계예요. 안 써도 괜찮아요 — 다 됐으면 "경기 시작"을 눌러 주사위를 굴리러 가세요.`;
  } else if(S.screen==='turn' && S.cur && S.cur.step==='roll'){
    title='7단계 · 주사위 굴리기';
    body=`요소마다 순서대로 "🎲 주사위 굴리기"를 눌러보세요. 표시된 성공률 이하가 나오면 성공이에요!`;
  } else if(S.screen==='turn' && S.cur && S.cur.step==='summary'){
    title='8단계 · 결과 확인';

const TURN_STEPS=[['plan','플랜'],['cards','카드'],['roll','롤'],['summary','결과']];
function turnStepper(){
  if(!S.cur || !S.cur.step) return '';
  const curIdx=TURN_STEPS.findIndex(([k])=>k===S.cur.step);
  if(curIdx<0) return '';
  return `<div class="turn-stepper">${TURN_STEPS.map(([k,label],i)=>{
    const cls = i<curIdx?'done':(i===curIdx?'active':'');
    return `<div class="ts-step ${cls}"><div class="ts-line"></div><div class="ts-dot">${i<curIdx?'✓':i+1}</div><div class="ts-label">${t(label)}</div></div>`;
  }).join('')}</div>`;
}
function tile(icon,title,sub,onclick,variant){

}

function rulesBasicsPanel(){
  return `<div class="panel">

    <p class="sub">실제 피겨스케이팅 경기는 짧은 "쇼트프로그램"과 긴 "프리프로그램" 두 번을 치르고, 두 경기 점수를 합산해 순위를 가려요. 이 게임도 똑같이 쇼트 → 프리 순서로 두 판을 진행합니다.</p>
    <h3>🧊 기술 요소</h3>
    <p class="sub">피겨스케이팅의 핵심 기술은 점프·스핀·스텝·코레오 네 가지예요. 실제 종목은 이 각각이 굉장히 복잡하지만, 이 게임에서는 스핀·스텝·코레오는 캐릭터마다 정해진 기초점을 그대로 더하고, 점프만 주사위로 성공/실패를 가려서 게임을 단순화했어요.</p>
    <h3>🦵 점프의 종류</h3>
    <p class="sub">점프는 토룹(T)·살코(S)·룹(Lo)·플립(F)·러츠(Lz)·악셀(A) 6종류가 있고, 실제로는 뛰는 방식과 난이도가 서로 달라요. 앞에 붙는 숫자는 회전수예요 (예: 트리플 악셀 → 3A).</p>
    <h3>🔗 컴비네이션(연속) 점프</h3>
    <p class="sub">한 점프(선행 점프)에 바로 이어서 뛰는 두 번째 점프를 "컴비네이션(연결) 점프"라고 해요. 실제 종목에서는 여러 종류가 연결 점프로 인정되지만, 이 게임은 단순하게 토룹과 룹만 연결 점프로 인정해요.</p>

    <h3>⏱ 후반 가산점</h3>

  </div>`;
}

    <h3>경기 구성</h3>
    <ul style="margin:4px 0 0;padding-left:18px" class="small">
      <li>쇼트 프로그램 → 프리 프로그램 순서로 진행하고, 두 경기 점수를 합산해 순위를 가려요.</li>
      <li>프리는 쇼트 점수가 낮은 선수부터 먼저 진행해요.</li>
      <li>동점자는 경기를 먼저 치른 선수가 더 높은 순위가 돼요.</li>
    </ul>

    <h3>📝 플랜시트 작성</h3>
    <ul style="margin:4px 0 0;padding-left:18px" class="small">
      <li>차례가 되면 점프·스핀·스텝(·프리는 코레오까지) 순서를 자유롭게 짜서 "플랜시트"를 완성해요.</li>
      <li><b>쇼트</b>: 점프 3개(그중 컴비네이션 1개) + 스핀 3 + 스텝 1</li>
      <li><b>프리</b>: 점프 6개(단독 4개 + 2연속 1개 + 3연속 1개) + 스핀 2 + 코레오스핀 1 + 스텝 1 + 코레오 1</li>
      <li>악셀 계열 점프를 단독으로 최소 1회는 반드시 포함해야 해요.</li>
      <li>상대는 플랜시트가 완성되기 전까지 그 내용을 볼 수 없어요.</li>
    </ul>

    <h3>🔗 컴비네이션(연결 점프)</h3>
    <ul style="margin:4px 0 0;padding-left:18px" class="small">
      <li>선행 점프에 바로 이어붙이는 연결 점프로, 연결 점프는 <b>토룹·룹만</b> 가능해요.</li>
      <li>프리에서는 연결을 최대 3개(선행+연결 2개)까지 늘릴 수 있는 경우도 있어요(경기당 1회).</li>
      <li>선행 점프가 실패하면 그 컴비네이션은 전부 무효 처리돼요.</li>
      <li>악셀을 컴비네이션 선행 점프로 써도 되지만, 그와 별개로 단독 악셀 1회는 반드시 채워야 해요(같은 회전수는 중복 규칙에 걸리니 보통 다른 회전수로 준비해요).</li>
      <li>연결(후행) 점프는 쇼트·프리 모두 토룹·룹만 가능해요.</li>
    </ul>

    <h3>🔁 같은 점프 중복 규칙</h3>
    <ul style="margin:4px 0 0;padding-left:18px" class="small">
      <li><b>프리</b>: 같은 종류의 점프가 단독으로 두 번 나올 수 없고, 컴비네이션까지 합쳐서 전체 최대 2번까지만 허용돼요.</li>
      <li><b>쇼트</b>: 더 엄격해서, 하나의 컴비네이션 안에서 선행·연결이 서로 같은 경우에 한해서만 두 번 허용돼요. 그 외 중복(단독+단독, 단독+컴비네이션, 서로 다른 컴비네이션끼리)은 전부 금지돼요.</li>
    </ul>

    <h3>🎲 주사위와 성공/실패</h3>
    <ul style="margin:4px 0 0;padding-left:18px" class="small">
      <li>플랜시트 순서대로 각 점프의 주사위를 굴려요.</li>
      <li>그 점프의 성공률 이하가 나오면 <b>성공</b>(기초점 획득), 초과하면 <b>실패</b>(그 요소 무효 + 구성점 50점 감점, 캐릭터에 따라 다를 수 있음)예요.</li>
      <li>방해·버프 카드 효과까지 전부 반영한 뒤의 확률로 판정해요.</li>
      <li>기권하거나 실격당하면 그 경기 점수는 0점으로 처리돼요.</li>
    </ul>

    <h3>⏱ 후반 가산점</h3>
    <ul style="margin:4px 0 0;padding-left:18px" class="small">
      <li>쇼트는 마지막 점프 1개, 프리는 마지막 점프 최대 3개까지 "후반 가산점"을 걸 수 있어요.</li>
      <li>후반 가산점이 걸린 점프는 성공률이 1/12 낮아지는 대신, 성공하면 기초점이 ×1.1배가 돼요.</li>
      <li>🌀 회전수 판정: 주사위가 성공 기준에 딱 걸치면(6 이상일 때) 확인 주사위를 하나 더 굴려요 — 1~6이면 "q"(GOE -2), 7~12면 "&lt;"(기초점 ×0.8, GOE -3), 생존 불가. 한 끗 차이로 여유있게 성공하면 확인 주사위 1~4 클린, 5~8 "!"(랜딩 불안, GOE -1), 9~12 "q"(GOE -2) — 이쪽은 언더까지는 안 가요. 주사위 12로 실패하면 "&lt;&lt;" 다운그레이드 — 한 단계 아래 점프의 기초점으로 낙상 처리돼요.</li>
    </ul>

    <h3>🃏 카드 사용</h3>
    <ul style="margin:4px 0 0;padding-left:18px" class="small">
      <li><b>방해 카드</b>: 상대 선수의 경기가 시작되기 전(기술요소 공개 전)에만, 무조건 상대에게 사용해야 해요.</li>
      <li><b>버프·중립 카드</b>: 경기 시작 전(카드 사용 단계)에 누구에게나 쓸 수 있어요.</li>
      <li>쇼트에서 안 쓰고 남은 카드는 프리로 그대로 이월돼요.</li>
      <li>프리 끝나고 안 쓰고 남은 카드는 1장당 최종 점수에 +1.5점씩 더해져요.</li>
      <li><b>카드 교환</b>: 카드 사용 단계에서 내 카드 1장을 다른 선수에게 교환 제안할 수 있어요. 상대가 자기 카드 중 하나를 골라 응하면 블라인드로 맞바뀌어요 (뭐가 오는지는 받아봐야 알아요!). 거절하면 없던 일이 돼요.</li>
    </ul>

    <h3>📊 점수 계산</h3>
    <div class="charbox">
      최종 점수 = <b>기술점</b>(성공한 점프·스핀·스텝·코레오 점수 합) + <b>구성점</b>(캐릭터 기초 구성점 ± 각종 보정) + <b>남은 카드 보너스</b>(장당 +1.5점)
    </div>
  </div>`;
}
function formatCharText(text){
  const nlParts = text.split('\n');
  const intro = nlParts[0];
  const rest = nlParts.slice(1).join(' ').replace(/^스킬:\s*/,'');
  const skillLines = rest.split(' / ').map(s=>s.trim()).filter(Boolean);
  return `<p class="small" style="font-style:italic;opacity:.85;margin:0 0 6px">${intro}</p>
    ${skillLines.length?`<ul style="margin:0;padding-left:18px">${skillLines.map(s=>`<li class="small" style="margin-bottom:2px">${s}</li>`).join('')}</ul>`:''}`;
}

      <p class="sub" style="text-align:center">${t('여자싱글과 남자싱글은 서로 다른 캐릭터 명단과 성공률 표를 사용하는 별개의 경기예요. 어느 부문으로 경기하실지 골라주세요.')}</p>
      <div class="div-pick">
        <button class="div-card" onclick="setDivision('women')">

        </button>
        <button class="div-card" onclick="setDivision('men')">
          <span class="div-name">${t('남자싱글')}</span>
        </button>
      </div>
      <button class="btn-ghost" style="width:100%;margin-top:14px" onclick="backToLobby()">${t('← 로비로 나가기')}</button>
    </div>`;
  }
  const usedChars=S.players.map(p=>p.charId).filter(Boolean);
  let rows=S.players.map((p,i)=>`
    <div class="player-card">
      <div style="flex:1">
        <div class="row" style="justify-content:space-between">
          <input type="text" value="${esc(p.name)}" oninput="setPlayerName(${i},this.value)" style="font-weight:700;margin-bottom:6px;flex:1">
          <label class="chip ${p.isAI?'gold':''}" style="cursor:pointer;white-space:nowrap">${(S.careerMode && i===0)?'':`<input type="checkbox" ${p.isAI?'checked':''} onchange="setPlayerAI(${i},this.checked)" style="margin-right:4px">${headerIcon('robot')}AI`}</label>
        </div>
        ${S.teamMode?`<div class="row" style="margin-bottom:6px;gap:6px">
          <button class="btn-ghost btn-sm ${p.team==='A'?'chip gold':''}" onclick="setPlayerTeam(${i},'A')">A팀</button>
          <button class="btn-ghost btn-sm ${p.team==='B'?'chip gold':''}" onclick="setPlayerTeam(${i},'B')">B팀</button>
        </div>`:''}
        ${(S.careerMode && i===0)?`<div class="stat-mini">${headerIcon('lock')}${esc(p.name)} — 커리어 캐릭터로 고정됨</div>`:`<select onchange="setPlayerChar(${i},this.value)">
          <option value="">${t('-- 캐릭터 선택 --')}</option>
          ${sortedCharacters().map(c=>`<option value="${c.id}" ${p.charId===c.id?'selected':''} ${usedChars.includes(c.id)&&p.charId!==c.id?'disabled':''}>${c.name}</option>`).join('')}
        </select>`}
        ${p.charId?`<div class="stat-mini">${t('구성점 쇼트')}${charBase(p.charId).cs}/${'프리'}${charBase(p.charId).cf}</div><div class="small" style="margin-top:4px;opacity:.75;font-style:italic">${charBase(p.charId).text.split('\n스킬:')[0].split('\n')[0]}</div>`:''}
      </div>
      ${(!S.teamMode && !(S.careerMode && i===0) && S.players.length>(S.practiceMode?1:2))?`<button class="btn-ghost btn-sm" onclick="removePlayer(${i})">${t('삭제')}</button>`:''}
    </div>`).join('');
  const teamCountOk = !S.teamMode || (S.players.filter(p=>p.team==='A').length===2 && S.players.filter(p=>p.team==='B').length===2);
  const canStart=(S.players.length>=2 || (S.practiceMode && S.players.length>=1)) && S.players.every(p=>p.charId) && new Set(S.players.map(p=>p.charId)).size===S.players.length && teamCountOk;
  return `
  ${appHero()}
  <div class="panel">
    <h2>${t('선수 설정')} <span class="tag">${t(S.division==='women'?'여자싱글':'남자싱글')}</span>${S.practiceMode && !S.careerMode?` <span class="tag">${t('1인 연습 모드')}</span>`:''}${S.teamMode?` <span class="tag">${headerIcon('users')}월드 팀 트로피</span>`:''}${S.careerMode?` <span class="tag">${headerIcon('chart')}커리어 대회</span>`:''}</h2>
    <p class="sub">${S.careerMode?`${headerIcon('chart')}선수 커리어 모드 대회예요. 1번 선수(${headerIcon('lock')}표시)만 커리어가 진행되고, 나머지 참가자는 그냥 이 한 경기에만 참여하는 상대예요 — 여러분 자신의 커리어에는 전혀 영향 없어요.`:S.teamMode?'정확히 4명, 팀당 2명씩이어야 시작할 수 있어요. 각 선수 카드에서 소속 팀(A/B)을 골라주세요.':(S.practiceMode?t('혼자서 캐릭터 하나를 골라 쇼트·프리를 연습해볼 수 있어요. 필요하면 "+ 선수 추가"로 상대를 늘려서 일반 게임으로 바꿔도 됩니다.'):t('2~6명의 선수를 설정하고 캐릭터를 배정하세요. 각 캐릭터의 구성점과 기초 스탯이 자동 적용됩니다. "AI"를 체크하면 그 선수는 컴퓨터가 자동으로 플랜 작성·카드 사용·주사위 굴리기까지 진행합니다.'))}</p>
    <div class="row" style="margin:8px 0;gap:6px">
      <button class="btn-ghost btn-sm ${S.division==='women'?'gold':''}" onclick="setDivision('women')">${t('여자싱글')}</button>
      <button class="btn-ghost btn-sm ${S.division==='men'?'gold':''}" onclick="setDivision('men')">${t('남자싱글')}</button>
    </div>
    ${rows}
    <div class="row" style="margin-top:10px">
      ${(!S.teamMode && S.players.length<6)?`<button class="btn-ghost" onclick="addPlayer()">${t('+ 선수 추가')}</button>`:''}
      <button class="btn-ghost" onclick="randomizeChars()">${headerIcon('dice')}${t('캐릭터 무작위 배정')}</button>
    </div>
    <div class="divider"></div>
    <button class="btn-main ${canStart?tutorialGlow(true):''}" style="width:100%;padding:13px" ${canStart?'':'disabled'} onclick="startGame()">${t('쇼트 프로그램 시작 →')}</button>
    ${!canStart?`<p class="warn">${S.teamMode&&!teamCountOk?'각 팀에 정확히 2명씩 배정해주세요.':t('모든 선수의 이름과 서로 다른 캐릭터를 선택해야 시작할 수 있습니다')+(S.practiceMode?'':t(' (최소 2명)'))+'.'}</p>`:''}
    <button class="btn-ghost" style="width:100%;margin-top:10px" onclick="backToLobby()">${t('← 로비로 나가기')}</button>
  </div>
  `;
}
function charBase(id){return CHARACTERS.find(c=>c.id===id);}
function sortedCharacters(){
  const div = S && S.division;
  const pool = (div && div!=='all') ? CHARACTERS.filter(c=>c.div===div) : CHARACTERS;
  return [...pool].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
}
function allSortedCharacters(){
  return [...CHARACTERS].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
}
function setDivision(d){
  S.division=d;
  const allowed = d==='all' ? null : new Set(CHARACTERS.filter(c=>c.div===d).map(c=>c.id));
  if(allowed) S.players.forEach(p=>{ if(p.charId && !allowed.has(p.charId)) p.charId=null; });
  render();
}
function setPlayerName(i,v){S.players[i].name=v;}
function setPlayerChar(i,v){S.players[i].charId=v||null; render();}
function setPlayerAI(i,v){S.players[i].isAI=!!v; render();}
function setPlayerTeam(i,team){ if(S.players[i]) S.players[i].team=team; render(); }
function addPlayer(){S.players.push(newPlayer(S.players.length)); render();}
function removePlayer(i){S.players.splice(i,1); render();}
function randomizeChars(){
  const pool=shuffle(sortedCharacters().map(c=>c.id));
  S.players.forEach((p,i)=>p.charId=pool[i]);
  render();
}

function refPanels(){
  return `<div class="panel"><details><summary>${headerIcon('cards')}방해/버프/중립 카드 전문 보기</summary>
    <h3 style="color:#c0455a">방해 카드</h3><div class="card-grid">${DISRUPT_DEFS.map(d=>cardVisual({type:'disrupt',name:d.name,desc:d.desc},{count:d.n})).join('')}</div>
    <h3 style="color:#1f6650">버프 카드</h3><div class="card-grid">${BUFF_DEFS.map(d=>cardVisual({type:'buff',name:d.name,desc:d.desc},{count:d.n})).join('')}</div>
    <h3 style="color:#8a7229">중립 카드</h3><div class="card-grid">${NEUTRAL_DEFS.map(d=>cardVisual({type:'neutral',name:d.name,desc:d.desc},{count:d.n})).join('')}</div>
  </details></div>`;
}

/* ============ GAME START ============ */
function startGame(){
  S.deck=shuffle([...buildDeck(DISRUPT_DEFS,'disrupt'),...buildDeck(BUFF_DEFS,'buff'),...buildDeck(NEUTRAL_DEFS,'neutral')]);
  // clone selection needed?
  if(S.players.some(p=>p.charId==='김마술')){ S.screen='clone'; render(); return; }
  S.order=S.players.map(p=>p.id);
  goOrderScreen('short');
}
function cloneScreen(){
  const magician=S.players.find(p=>p.charId==='김마술');
  const others=S.players.filter(p=>p.id!==magician.id);
  const chosen=S.cloneChoices[magician.id];
  return `<div class="panel">
    <div class="row between"><h2>🪄 김마술의 복제 능력</h2><button class="btn-ghost btn-sm" onclick="S.screen='setup';render()">← 뒤로</button></div>
    <p class="sub">${`${magician.name}(김마술)은 쇼트 시작 전, 대상 선수 1명의 캐릭터 능력과 스탯을 게임 내내 그대로 복제합니다.`}</p>
    <div class="row">
      ${others.map(o=>`<button class="btn-ghost ${chosen===o.charId?'chip gold':''}" onclick="pickClone('${magician.id}','${o.charId}')">${o.name} (${o.charId})</button>`).join('')}
      <button class="btn-ghost" onclick="pickClone('${magician.id}',null)">${t('복제하지 않음')}</button>
    </div>
    <div class="divider"></div>
    <button class="btn-main" onclick="afterClone()">${t('다음 →')}</button>
  </div>`;
}
function pickClone(pid,cid){ if(MY_ID && MY_ID!==pid){ alert('김마술 좌석의 플레이어만 선택할 수 있습니다.'); return; } if(cid) S.cloneChoices[pid]=cid; else delete S.cloneChoices[pid]; render(); }
function afterClone(){ S.order=S.players.map(p=>p.id); goOrderScreen('short'); }

function goOrderScreen(phase){
  S.phase=phase; S.screen='order';
  render();
}
function orderScreen(){
  const list=S.order.map(id=>S.players.find(p=>p.id===id));
  const backBtn = S.phase==='short' ? `<button class="btn-ghost btn-sm" onclick="${S.players.some(p=>p.charId==='김마술')?"S.screen='clone'":"S.screen='setup'"};render()">${t('← 뒤로')}</button>` : '';
  return `<div class="panel">
    <div class="row between"><h2>${t(S.phase==='short'?'① 쇼트':'② 프리')} ${t('프로그램 — 출전 순서')}</h2>${backBtn}</div>
    <p class="sub">${S.phase==='short'?t('나이가 어린 순서대로 진행합니다. 아래에서 순서를 조정하세요.'):t('쇼트 점수가 낮은 선수부터 진행합니다. 자동 정렬되었습니다 — 필요시 조정하세요.')}</p>
    <div class="row" style="margin-bottom:8px">
      <button class="btn-ghost btn-sm" onclick="randomizeOrder()">${headerIcon('dice')}${t('순서 무작위로 섞기')}</button>
    </div>
    ${list.map((p,i)=>`
      <div class="player-card">
        <div><b>${i+1}. ${p.name}</b> <span class="tag">${charOf(p).name}</span> ${S.phase==='free'?`<span class="small">${t('쇼트 ')}${p.scoreShort}${t('점')}</span>`:''}</div>
        <div class="row">
          <button class="btn-ghost btn-sm" onclick="moveOrder(${i},-1)">▲</button>
          <button class="btn-ghost btn-sm" onclick="moveOrder(${i},1)">▼</button>
        </div>
      </div>`).join('')}
    <div class="divider"></div>
    <button class="btn-main ${tutorialGlow(true)}" style="width:100%;padding:13px" onclick="confirmOrder()">${t('순서 확정, 카드 드로우 →')}</button>
  </div>`;
}
function randomizeOrder(){
  S.order=shuffle([...S.order]);
  render();
}
function moveOrder(i,dir){
  const j=i+dir; if(j<0||j>=S.order.length) return;
  [S.order[i],S.order[j]]=[S.order[j],S.order[i]]; render();
}
function dealTargetFor(p){ const ch=baseCharOf(p); const base=S.phase==='free'?5:3; return ch.doubleDraw?base*2:base; }
function advanceDealing(){
  while(S.dealIdx < S.players.length){
    const p=S.players[S.dealIdx];
    if(p.isAI){
      const target=dealTargetFor(p);
      while(S.dealDrawn<target && S.deck.length){ const nc=S.deck.pop(); if(S.phase==='short') p.handShort.push(nc); else p.handFree.push(nc); S.dealDrawn++; }
      S.dealIdx++; S.dealDrawn=0;
    } else break;
  }
  if(S.dealIdx>=S.players.length){
    if(S.phase==='free' && S.players.some(pl=>pl.charId==='토냐 하딩') && !S._dohajinDone){ S.screen='dohajin'; return; }
    if(S.phase==='free' && S.players.some(pl=>pl.charId==='김마술') && !S._magicianDrawDone){ S.screen='magicianDraw'; return; }
    S.screen='allPlan';
    S.players.forEach(p=>{ if(p.isAI && !p.planLocked){ const plan=generateAIPlan(p, charOf(p), S.phase); if(plan){ p.plan=plan; p.planLocked=true; } } });
    return;
  }
}
function confirmOrder(){
  S.players.forEach(p=>{ p.programState=freshProgramState(); p.constAdj=(p.careerConstGrowth||0); p.constAdjCard=0; p.constAdjJump=0; if(S.phase==='short') p.handShort=[]; else p.handFree=[]; p.plan=[]; p.planLocked=false; });
  S.livePlanPct={};
  const starPlayer=S.players.find(p=>charOf(p).stealNextConst);
  if(starPlayer){
    const idx=S.order.indexOf(starPlayer.id);
    const victim=S.players.find(p=>p.id===S.order[idx+1]);
    if(victim){
      const amt=charOf(starPlayer).stealNextConst;
      victim.constAdj=(victim.constAdj||0)-amt;
      starPlayer.constAdj=(starPlayer.constAdj||0)+amt;
    }
  }
  if(S.phase==='short' && !S._charIntroShown){
    S.screen='charIntro';
    render();
    return;
  }
  startDealingPhase();
}
function startDealingPhase(){
  if(S.worldsMode){
    S.screen='allPlan';
    S.players.forEach(p=>{ if(p.isAI && !p.planLocked){ const plan=generateAIPlan(p, charOf(p), S.phase); if(plan){ p.plan=plan; p.planLocked=true; } } });
    render();
    return;
  }
  S.dealIdx=0; S.dealDrawn=0;
  S.screen='dealing';
  advanceDealing();
  render();
}
function confirmCharIntro(){
  S._charIntroShown=true;
  startDealingPhase();
}
function charIntroScreen(){
  return `<div class="panel">
    <h2>${t('🧑‍🎤 이번 경기 출전 선수들')}</h2>
    <p class="sub">${t('카드를 뽑기 전에, 서로 어떤 선수를 상대하는지 확인해보세요.')}</p>
    ${S.order.map(pid=>{
      const p=S.players.find(x=>x.id===pid);
      const ch=charOf(p);
      const base=baseCharOf(p);
      const nameLabel = (base && base.id!==ch.id) ? `${base.name}(${ch.name}${t(' 복제)')}` : ch.name;
      return `<div class="charbox" style="margin-top:10px">
        <b>${p.name} — ${nameLabel}</b>
        <div style="margin-top:6px">${formatCharText(ch.text)}</div>
      </div>`;
    }).join('')}
    <button class="btn-main ${tutorialGlow(true)}" style="width:100%;margin-top:12px;padding:13px" onclick="confirmCharIntro()">${t('확인, 카드 뽑으러 가기 →')}</button>
  </div>`;
}
function pickSpecificCard(defId,defType){
  if(!S.practiceMode && !S.gpfMode) return;
  const p=S.players[S.dealIdx];
  if(!p || p.isAI) return;
  if(ROOM && MY_ID && MY_ID!==p.id) return;
  if(S.dealAwaitingConfirm) return;
  const defs = defType==='disrupt'?DISRUPT_DEFS:defType==='buff'?BUFF_DEFS:NEUTRAL_DEFS;
  const def=defs.find(d=>d.id===defId);
  if(!def) return;
  const nc=Object.assign({},def,{type:defType, uid:def.id+'_practice_'+Date.now()});
  if(S.phase==='short') p.handShort.push(nc); else p.handFree.push(nc);
  S.dealDrawn++;
  const target=dealTargetFor(p);
  if(S.dealDrawn>=target){ S.dealAwaitingConfirm=true; }
  render();
}
function cardPickerPanel(){
  if(!S.practiceMode && !S.gpfMode) return '';
  const groups=[['disrupt',t('🔴 방해'),DISRUPT_DEFS],['buff',t('🟢 버프'),BUFF_DEFS],['neutral',t('🟡 중립'),NEUTRAL_DEFS]];
  return `<details style="margin-top:10px" ${S.gpfMode?'open':''}>
    <summary>${t('🏆 원하는 카드 직접 선택')}${S.gpfMode?t(' (그랑프리 파이널 — 카드 자유 선택)'):t(' (연습 모드 전용)')}</summary>
    <p class="small" style="margin-top:6px;opacity:.7">${t('확인 버튼을 누르기 전까지, 랜덤 뽑기 대신 원하는 카드를 골라서 넣을 수 있어요.')}</p>
    ${groups.map(([type,label,defs])=>`
      <div class="small" style="margin-top:8px;font-weight:700">${label}${t(' 카드')}</div>
      ${defs.map(d=>`<div class="row between" style="margin-top:3px;align-items:center"><span class="small" style="flex:1">${d.name} — ${d.desc}</span><button class="btn-ghost btn-sm" onclick="pickSpecificCard('${d.id}','${type}')">${t('추가')}</button></div>`).join('')}
    `).join('')}
  </details>`;
}
function drawInitialCard(){
  const p=S.players[S.dealIdx];
  if(!p || p.isAI) return;
  if(ROOM && MY_ID && MY_ID!==p.id){ alert('본인 차례가 아닙니다.'); return; }
  if(!S.deck.length) return;
  const nc=S.deck.pop();
  if(S.phase==='short') p.handShort.push(nc); else p.handFree.push(nc);
  S.dealDrawn++;
  const target=dealTargetFor(p);
  if(S.dealDrawn>=target){ S.dealAwaitingConfirm=true; }
  render();
}
function confirmDealDone(){
  const p=S.players[S.dealIdx];
  if(!p) return;
  if(ROOM && MY_ID && MY_ID!==p.id){ alert('본인 차례가 아닙니다.'); return; }
  S.dealAwaitingConfirm=false;
  S.dealIdx++; S.dealDrawn=0;
  advanceDealing();
  render();
}
function dealingScreen(){
  if(S.dealIdx>=S.players.length) return '';
  const p=S.players[S.dealIdx]; const ch=charOf(p);
  const target=dealTargetFor(p);
  const spectating = ROOM && MY_ID && MY_ID!==p.id;
  const hand = S.phase==='short'?p.handShort:p.handFree;
  const myOwn = !ROOM || MY_ID===p.id;
  const done = S.dealAwaitingConfirm;
  return `<div class="panel">
    <h2>${t('🃏 카드 뽑기 — ')}${p.name}(${ch.name})</h2>
    ${spectating?`<div class="warn">⏳ ${`지금은 ${p.name}이(가) 카드를 뽑는 중입니다. 본인 차례가 아니면 조작할 수 없어요.`}</div>`:''}
    <p class="sub">${t('경기 시작 전, 본인 카드 ')}${target}${t('장을 순서대로 뽑아주세요.')}</p>
    ${myOwn?`
      <div class="hand-row" style="margin-top:8px">
        ${hand.map((c,ci)=>cardVisual(c,{extraClass:'draw-card-chip',style:`animation-delay:${ci*0.12}s`})).join('')}
      </div>
      <div class="sticky-action-bar">
      ${done?`<button class="btn-main" style="width:100%" onclick="confirmDealDone()">${t('✅ 확인, 다음으로 →')}</button>`
            :`<button class="btn-main ${tutorialGlow(true)}" style="width:100%" onclick="drawInitialCard()">${t('🃏 카드 뽑기 (')}${hand.length}/${target})</button>`}
      </div>
      ${!done?cardPickerPanel():''}
    `:`<p class="small">${t('🂠 비공개 (')}${hand.length}/${target}${t('장 뽑음)')}</p>`}
  </div>`;

function freshProgramState(){

  ps.forceWithdrawOn=[]; ps.extraFailConst=0; ps.levelCapDelta=null;

/* ============ AI PLAYER ============ */
function aiRandChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function aiWeightedChoice(items,weights){
  const total=weights.reduce((a,b)=>a+b,0);
  if(total<=0) return items[Math.floor(Math.random()*items.length)];
  let r=Math.random()*total;
  for(let i=0;i<items.length;i++){ r-=weights[i]; if(r<=0) return items[i]; }
  return items[items.length-1];
}
/* AI 전용 "현실 구성" 선호도. 규칙상으로는 얼마든지 시도 가능하지만(사람이 고르면 그대로 됨),
   실제 그 선수가 프로그램에 넣지 않는 점프는 AI가 스스로 피하도록 하는 장치다.

function aiAvoids(ch, level, type){
  return !!(ch.aiAvoid && ch.aiAvoid.includes(level+''+type));

function aiCanQuad(ch,type,phase){
  if(aiAvoids(ch,4,type)) return false; // 실제 구성에 없는 쿼드는 AI가 시도하지 않음
  if(phase==='short' && ch.div!=='men' && !(ch.shortQuadTypes && ch.shortQuadTypes.includes(type))) return false;
  if(ch.div==='men') return true; // men's division can attempt all quad types

function aiJumpEV(ch,level,type,isCombo){
  const rate = isCombo ? comboRate(level,type,ch.div) : soloRate(level,type,ch.div);
  let modDelta=0;
  (ch.mods||[]).forEach(m=>{
    if(m.comboLeadOnly || m.comboFollowOnly) return; // skip position-specific mods for this rough estimate
    let ok=true;
    if(m.types && !m.types.includes(type)) ok=false;
    if(m.excludeTypes && m.excludeTypes.includes(type)) ok=false;
    if(m.levels && !m.levels.includes(level)) ok=false;
    if(m.exact && !(m.exact.level===level && m.exact.type===type)) ok=false;
    if(m.excludeExact && m.excludeExact.some(ex=>ex.level===level && ex.type===type)) ok=false;
    if(ok) modDelta+=m.delta;
  });
  const effRate=Math.max(0,Math.min(12,rate+modDelta))/12;
  let attemptPenalty=0;
  (ch.attemptPenalty||[]).forEach(ap=>{ if(ap.types.includes(type)) attemptPenalty+=ap.points; });
  const successBonus=ch.onSuccessBonus||0;
  const failPenalty = ch.failConstructionOverride!==undefined ? ch.failConstructionOverride : 1;
  const base = charScoreBase(ch,level,type);
  // rough expected GOE: average GOE across a d12 roll against this rate, worth 10% of base per point
  const effRateRaw=Math.max(0,Math.min(12,rate+modDelta));
  let goeSum=0;
  for(let r=1;r<=effRateRaw;r++) goeSum+=charGOE(ch,type,effRateRaw,r,level);
  const avgGoeExpected = effRateRaw>0 ? goeSum/effRateRaw : 0;
  const goeBonusEst = avgGoeExpected * base * 0.1;
  const ev = effRate*(base+successBonus+goeBonusEst) - (1-effRate)*failPenalty*0.35 - attemptPenalty;

  // this is the "learn from accumulated data" part: not a model, just a running average that
  // gradually outweighs the theoretical formula as more real attempts come in for this exact
  // character+element. currentElementStats() is a cheap synchronous read of a locally cached
  // snapshot (refreshed periodically in the background), so this never blocks plan generation.
  let blendedEv=ev;

  if(stat && stat.attempts>=3){
    const empiricalAvgScore = stat.scoreSum/stat.attempts; // already reflects the real success/fail mix
    const priorWeight=5; // how many "virtual" theoretical samples we trust before real data dominates
    blendedEv = (ev*priorWeight + empiricalAvgScore*stat.attempts) / (priorWeight+stat.attempts);

function aiPickTypeLevel(ch,allowedTypes,levels,isCombo,phase,typeUseCount){
  const opts=[]; const weights=[];
  allowedTypes.forEach(t=>{
    // 실제 선수들은 점수가 제일 높은 점프 종류 하나만 한도까지 채워 넣지 않고 토룹·살코·룹·
    // 플립·러츠를 골고루 섞는다 (악셀은 원래도 여러 번 도는 게 자연스러워서 감쇠를 약하게 둠).
    // 같은 종류를 이미 쓴 만큼 그 종류의 가중치를 지수적으로 깎아서, 매번 "제일 점수 높은 걸로
    // 채워넣기"가 아니라 실제 프로그램처럼 다양한 종류가 섞여 나오게 유도한다.
    const usedN=(typeUseCount && typeUseCount[t])||0;

/* Real expected-value gain from putting a specific jump/combo element into a "후반 가산점" slot.
   Late knocks the success rate down by 1/12 but multiplies the score by ×1.1 on success - so
   whether that trade is actually worth it depends on THAT element's own success rate, not just
   its raw score. A big but shaky quad can easily come out worse than a smaller, more reliable
   jump once the risk is priced in. This reuses computeElementRate(), the same function the real
   roll uses, so it's an honest apples-to-apples comparison rather than a rough guess. */
function lateBonusEVGain(p, ch, e){
  const subJumps = e.kind==='combo'
    ? e.jumps.map((j,k)=>({level:j.level, type:j.type, isLead:k===0, isFollow:k>0}))
    : [{level:e.level, type:e.type, isLead:true, isFollow:false}];
  let gain=0;
  subJumps.forEach(j=>{
    const base=charScoreBase(ch,j.level,j.type);
    const infoNormal=computeElementRate(p,ch,{level:j.level,type:j.type,late:false,elemIndexAmongJumps:0,totalJumpElems:1,isCombo:e.kind==='combo'}, j.isLead, j.isFollow);

    gain += (infoLate.rate/12)*base*1.1 - (infoNormal.rate/12)*base;

/* ---- AI: 완성된 플랜 전체의 "정확한" 기대 점수 ----
   기존 AI의 결정적 약점: 점프 종류는 EV 가중치로 뽑았지만, 정작 완성된 플랜을 서로 비교하지
   않고 "합법이기만 하면" 첫 번째로 나온 걸 그냥 채택했다. 즉 좋은 플랜이 나올지는 순전히 운.

  const totalJumpElems = jumpIdxs.length;

  const successBonus = ch.onSuccessBonus||0;
  let ev=0;
  plan.forEach((e,idx)=>{
    if(!(e.kind==='jump'||e.kind==='combo')) return;
    const jumpPos = jumpIdxs.indexOf(idx);
    const subs = e.kind==='combo'
      ? e.jumps.map((j,k)=>({level:j.level,type:j.type,k,isLead:k===0,isFollow:k>0}))
      : [{level:e.level,type:e.type,k:-1,isLead:true,isFollow:false}];
    const subBases = subs.map(s=>charScoreBase(ch,s.level,s.type));
    const goeIdx = subBases.indexOf(Math.max(...subBases)); // 콤보 GOE는 기초점 큰 쪽에서 한 번만
    let reach = 1; // 콤보 후속은 선행이 성공해야 시도 자체가 성립
    subs.forEach((s,si)=>{

      const rate = Math.max(0,Math.min(12,info.rate));

    });
    (ch.attemptPenalty||[]).forEach(ap=>{ subs.forEach(s=>{ if(ap.types.includes(s.type)) ev -= ap.points; }); });
  });

function generateAIPlan(p, ch, phase){
  cloudFetchElementStats(); // fire-and-forget, throttled - keeps the EV blend's data reasonably fresh
  const spec=jumpSlotsSpec(phase);
  let seeded=null; // 큐레이팅된 쇼트 구성 - 즉시 채택하지 않고 "후보 중 하나"로 경쟁시킨다
  if(phase==='short'){
    const fixedJumps=fixedShortJumpPlan(ch);
    if(fixedJumps){
      const forbiddenList=ch.forbidden||[];
      const usesForbidden = fixedJumps.some(e=>{
        const checkOne=(level,type)=> forbiddenList.includes(level+''+type) || forbiddenList.includes(type);
        if(e.kind==='jump') return checkOne(e.level,e.type);
        return (e.jumps||[]).some(j=>checkOne(j.level,j.type));
      });
      if(!usesForbidden){
        const plan=fixedJumps.map(e=>JSON.parse(JSON.stringify(e)));
        // same back-loading as the random branch below: put whichever element(s) actually GAIN
        // the most expected value from the late bonus last (accounting for the -1/12 rate hit),
        // instead of whatever order they happened to be listed in the fixed curated set
        plan.sort((a,b)=>lateBonusEVGain(p,ch,a)-lateBonusEVGain(p,ch,b));
        const spinTypes1=spinTypesFor(phase, ch.div);
        for(let i=0;i<spec.spin;i++) plan.push({kind:'spin', spinType:spinTypes1[i]||spinTypes1[spinTypes1.length-1], late:false});
        for(let i=0;i<spec.step;i++) plan.push({kind:'step',late:false});
        const eligible=lateEligibleSet(plan,phase);
        plan.forEach((e,idx)=>{ if(eligible.has(idx)) e.late=true; });
        if(computeDupViolations(plan, phase).length===0){
          seeded=plan;
          // 이 구성들은 "무작위 후보 중 하나"가 아니라 지정된 고정 구성이다.
          // 예전에 AI 다양성을 넣으면서 랜덤 후보 400개와 경쟁시키는 바람에 확률적으로
          // 거의 채택되지 않았다 — 쇼트에서 큐레이팅 구성이 있으면 그대로 쓴다.

  const forbiddenList=ch.forbidden||[];
  const forbiddenTypes=new Set(forbiddenList.filter(f=>!/^[0-9]/.test(f)));
  // also treat a type as fully banned if every level of it is individually forbidden
  JORDER.forEach(t=>{ if([2,3,4].every(l=>forbiddenList.includes(l+''+t))) forbiddenTypes.add(t); });
  const isForbiddenExact=(level,type)=> forbiddenList.includes(level+''+type);
  const allowedTypes=JORDER.filter(t=>!forbiddenTypes.has(t));
  if(!allowedTypes.length) return seeded;
  let best=seeded, bestScore = seeded ? evaluatePlanEV(p, ch, seeded, phase) : -Infinity;

  // 그날그날 조금씩 다른 구성을 시도하는 게 현실적이다. 그래서 후보를 하나만 남기지 않고
  // 여기 다 모아뒀다가, 마지막에 상위권 안에서 가중치를 둔 무작위로 하나를 고른다
  // (기대값이 크게 밀리는 구성은 후보에도 못 들어오니 "말도 안 되는" 선택은 여전히 안 나온다).
  const candidates = seeded ? [{plan:seeded, score:bestScore}] : [];
  for(let attempt=0; attempt<400; attempt++){
    const plan=[]; const usedCounts={}; const usedSoloTypes=new Set(); const typeUseCount={}; let ok=true;
    for(let c=0;c<spec.combos && ok;c++){
      const leadPick=aiPickTypeLevel(ch,allowedTypes,levels,false,phase,typeUseCount);
      const leadType=leadPick.type, leadLevel=leadPick.level;
      const followBase = (ch.comboFollowAxelFree && phase==='free') ? ['T','Lo','A'] : ['T','Lo'];
      const followPool=followBase.filter(t=>allowedTypes.includes(t) && !(ch.banComboFollowTypes||[]).includes(t));
      if(!followPool.length){ ok=false; break; }
      const followPick=aiPickTypeLevel(ch,followPool,levels,true,phase,typeUseCount);
      const followType=followPick.type, followLevel=followPick.level;
      if(isForbiddenExact(leadLevel,leadType) || isForbiddenExact(followLevel,followType)){ ok=false; break; }
      const leadKey=leadLevel+leadType, followKey=followLevel+followType;
      const tmp=Object.assign({},usedCounts);
      tmp[leadKey]=(tmp[leadKey]||0)+1; tmp[followKey]=(tmp[followKey]||0)+1;
      if(tmp[leadKey]>2 || tmp[followKey]>2){ ok=false; break; }
      usedCounts[leadKey]=tmp[leadKey]; usedCounts[followKey]=tmp[followKey];
      typeUseCount[leadType]=(typeUseCount[leadType]||0)+1; typeUseCount[followType]=(typeUseCount[followType]||0)+1;
      plan.push({kind:'combo', jumps:[{type:leadType,level:leadLevel},{type:followType,level:followLevel}], late:false, cards:[]});
    }
    if(!ok) continue;
    const soloCount=spec.jumpElems - spec.combos;
    let hasComboAxel=plan.some(e=>e.jumps && e.jumps.some(j=>j.type==='A'));
    let hasSoloAxel=false;
    let hasAxel = phase==='short' ? hasSoloAxel : (hasSoloAxel||hasComboAxel);
    let hasQuadAxel=plan.some(e=>e.jumps && e.jumps.some(j=>j.type==='A'&&j.level===4));
    const needsQuadAxel = phase==='free' && !!ch.requireQuadAxelFree;
    for(let s=0;s<soloCount && ok;s++){
      let type,level;
      const wantQuadAxel = needsQuadAxel && !hasQuadAxel && allowedTypes.includes('A');
      if(wantQuadAxel){ type='A'; level=4; }
      else {
        const wantAxel = !hasAxel && allowedTypes.includes('A') && (s===soloCount-1 || Math.random()<0.5);
        if(wantAxel){ const axLevels=levels.filter(l=>!aiAvoids(ch,l,'A')); type='A'; level=aiRandChoice(axLevels.length?axLevels:levels); }
        else { const pick=aiPickTypeLevel(ch,allowedTypes,levels,false,phase,typeUseCount); type=pick.type; level=pick.level; }
      }
      if(isForbiddenExact(level,type)){ ok=false; break; }
      const key=level+type;
      if(usedSoloTypes.has(key) || (usedCounts[key]||0)+1>2){ ok=false; break; }
      usedCounts[key]=(usedCounts[key]||0)+1; usedSoloTypes.add(key);
      typeUseCount[type]=(typeUseCount[type]||0)+1;
      if(type==='A'){ hasSoloAxel=true; hasAxel = phase==='short' ? hasSoloAxel : (hasSoloAxel||hasComboAxel); if(level===4) hasQuadAxel=true; }
      plan.push({kind:'jump', type, level, late:false, cards:[]});
    }
    if(!ok || !hasAxel || (needsQuadAxel && !hasQuadAxel)) continue;
    if(computeDupViolations(plan, phase).length>0) continue;
    if(computeTierDoublingVoids(plan, phase).length>0) continue;
    // 백로딩: 후반 가산점(마지막 N개 점프/콤보에 ×1.1)은 실제 대회에서도 스케이터들이 가장 어려운
    // 점프를 일부러 프로그램 뒷부분에 배치해서 노리는 전략이다. 지금까지는 콤보가 항상 먼저
    // 생성되고 단독 점프도 생성 순서 그대로 쌓여서, 정작 어느 요소가 뒤쪽 보너스 슬롯에 들어갈지는
    // 순전히 운이었다. 단, "점수가 제일 높은 요소"를 무조건 보내는 건 그 자체로 비합리적이다 —
    // 후반 가산점은 성공률을 -1/12 깎기 때문에, 원래 성공률이 낮은 고난도 점프(쿼드 등)를 보내면
    // 기대값이 오히려 떨어질 수 있다. 그래서 점수가 아니라 "후반 배치로 실제 기대값이 얼마나
    // 오르는가"(lateBonusEVGain, 성공률 하락과 ×1.1을 함께 반영) 기준으로 정렬한다. 검증을 통과한
    // 후에 재배열하므로 판정 결과에도 영향 없음: computeDupViolations는 순서 무관,
    // computeTierDoublingVoids도 이미 0건인 상태라 어떤 순열로 바꿔도 여전히 0건이다
    // (초과분이 있을 때만 순서가 개입하는 로직이라서).
    plan.sort((a,b)=>lateBonusEVGain(p,ch,a)-lateBonusEVGain(p,ch,b));
    const spinTypes2=spinTypesFor(phase, ch.div);
    for(let i=0;i<spec.spin;i++) plan.push({kind:'spin', spinType:spinTypes2[i]||spinTypes2[spinTypes2.length-1], late:false});
    for(let i=0;i<(spec.choreospin||0);i++) plan.push({kind:'choreospin',late:false});
    for(let i=0;i<spec.step;i++) plan.push({kind:'step',late:false});
    for(let i=0;i<spec.choreo;i++) plan.push({kind:'choreo',late:false});
    const eligible=lateEligibleSet(plan,phase);
    plan.forEach((e,idx)=>{ if(eligible.has(idx)) e.late=true; });
    // 여기서 곧바로 반환하지 않는다. 완성된 플랜의 실제 기대 점수를 매겨두고 계속 후보를 뽑아,
    // 마지막에 가장 좋은 것만 채택한다 (기존엔 "합법이면 무조건 채택"이라 운에 전부 맡겼음).
    const score = evaluatePlanEV(p, ch, plan, phase);
    candidates.push({plan, score});
    if(score > bestScore){ bestScore = score; best = plan; }
  }
  if(candidates.length>1){
    candidates.sort((a,b)=>b.score-a.score);
    const shortlist=candidates.slice(0, Math.min(8, Math.max(1, Math.ceil(candidates.length*0.15))));
    const weights=shortlist.map((_,i)=>Math.pow(0.7,i)); // 1등에 제일 후하지만, 2~8등도 뽑힐 여지를 남김
    best=aiWeightedChoice(shortlist.map(c=>c.plan), weights);
  }
  return best; // 후보를 하나도 못 만든 극단적 경우에만 null
}
function aiBuildPlanForActivePlayer(){

}
/* AI opponents/self decide card usage right as the card phase opens */
function aiAutoCardDecisions(){
  const activeId=S.cur.playerId;
  const activePlayer=S.players.find(p=>p.id===activeId);
  const activeCh=activePlayer?charOf(activePlayer):null;
  S.players.forEach(owner=>{
    if(!owner.isAI) return;
    const hand=S.phase==='short'?owner.handShort:owner.handFree;
    if(owner.id===activeId){
      for(let i=hand.length-1;i>=0;i--){
        const c=hand[i];
        if(c.type==='buff' && Math.random()<0.42){
          const eligible=S.cur.plan.map((e,idx)=>({e,idx})).filter(o=> c.scope==='element'? (o.e.kind==='jump'||o.e.kind==='combo') : ((o.e.kind==='spin'||o.e.kind==='step'||o.e.kind==='choreo'||o.e.kind==='choreospin') && !(c.excludeKinds&&c.excludeKinds.includes(o.e.kind))));
          let auto=null;
          if(eligible.length){
            // prefer boosting the highest-value (후반 가산점 marked, or highest base score) element
            const lateOnes=eligible.filter(o=>o.e.late);
            const pool=lateOnes.length?lateOnes:eligible;
            auto=aiRandChoice(pool).idx;
          }
          playCard(owner.id, i, owner.id, auto);
        }
      }
    } else {
      const ownCh=charOf(owner);
      // psychological read: press harder on a stronger-statted opponent, ease off a weaker one,
      // and mix in some randomness so it doesn't feel mechanical (occasionally holds back, occasionally strikes early)
      let aggression=0.32;
      if(activeCh && ownCh){
        const strengthGap=(activeCh.cs+activeCh.cf) - (ownCh.cs+ownCh.cf);
        aggression += Math.max(-0.15, Math.min(0.2, strengthGap/1200));
      }
      aggression += (Math.random()<0.15) ? 0.25 : 0; // occasional aggressive bluff-punish
      for(let i=hand.length-1;i>=0;i--){
        const c=hand[i];
        if(c.type==='disrupt' && Math.random()<aggression){
          const eligible=S.cur.plan.map((e,idx)=>({e,idx})).filter(o=> c.scope==='nonjump'? ((o.e.kind==='spin'||o.e.kind==='step'||o.e.kind==='choreo'||o.e.kind==='choreospin') && !(c.excludeKinds&&c.excludeKinds.includes(o.e.kind))) : (o.e.kind==='jump'||o.e.kind==='combo'));
          let auto=null;
          if(eligible.length){
            // strike the highest-stakes element first: 후반 가산점(late) elements, then combos, then whatever's left
            const lateOnes=eligible.filter(o=>o.e.late);
            const comboOnes=eligible.filter(o=>o.e.kind==='combo');
            const pool = lateOnes.length?lateOnes : comboOnes.length?comboOnes : eligible;
            auto=aiRandChoice(pool).idx;
          }
          playCard(owner.id, i, activeId, auto);
        }
      }
    }
  });
}
/* Fully auto-resolve an AI-controlled active player's whole roll phase */
function aiRunFullTurn(){

function aiStepNext(){
  if(!S.cur || S.cur.step!=='roll' || !S.cur.aiRunning) return; // safety: state moved on already
  const p=curPlayer(); const ch=charOf(p);
  const plan=S.cur.plan;
  const idx=S.cur.resolvedIdx;
  if(S.cur.withdrawn || idx>=plan.length){
    S.cur.aiRunning=false;
    S.cur.step='summary';
    render();
    return;
  }
  const jumpElemIdxs=[]; plan.forEach((e,i)=>{ if(e.kind==='jump'||e.kind==='combo') jumpElemIdxs.push(i); });
  const elem=plan[idx];
  const jumpPos=jumpElemIdxs.indexOf(idx);
  if(elem.kind==='spin'||elem.kind==='step'||elem.kind==='choreo'||elem.kind==='choreospin'){
    const cards=elem.cards||[];
    const isFixedLevelQ = (elem.kind==='choreo' || elem.kind==='choreospin');
    let forceFail=false, extraConstFail=0, goeDeltaScaled=0, goeDeltaRaw=0;
    // 코레오/코레오스핀은 고정 팩터 0.5로 바로 환산되지만, 스핀/스텝은 굴려서 나온 레벨에 따라
    // 기초점이 달라지므로(레벨1~4), 그 레벨의 기초점을 알기 전까지는 원시(grade) 단위로만 모아둔다
    cards.forEach(c=>{ if(c.scope==='nonjump'){ if(c.forceFail) forceFail=true; if(c.goeDelta){ if(isFixedLevelQ) goeDeltaScaled=roundScore(goeDeltaScaled+c.goeDelta*0.5); else goeDeltaRaw+=c.goeDelta; } if(c.constDelta) extraConstFail+=c.constDelta; } });
    const charBonus = (ch.stepChoreoBonus && (elem.kind==='step'||elem.kind==='choreo')) ? ch.stepChoreoBonus : 0;
    if(!forceFail) elem.pendingRoll=Math.floor(Math.random()*12)+1;
    elem.pendingFallConfirmRoll = (!forceFail && elem.pendingRoll===12) ? (Math.floor(Math.random()*12)+1) : undefined;
    const baseScoreLvl = nonjumpBaseScore(elem,ch);
    // 스핀/스텝 카드의 GOE 보정도 캐릭터/주사위 기반 자연 GOE와 똑같이 "그 레벨의 기초점 × 0.1"을
    // 곱한 팩터로 환산해야, 낮은 레벨과 높은 레벨에서 카드 효과의 실제 점수 영향이 다르게 반영됨
    const goeDelta = isFixedLevelQ ? goeDeltaScaled : roundScore(goeDeltaRaw*baseScoreLvl*0.1);
    const goeBonus = (!forceFail) ? roundScore(nonjumpGOEBonus(elem,ch,elem.pendingRoll)+goeDelta) : 0;
    const score = roundScore(baseScoreLvl + goeBonus + charBonus);
    resolveNonjump(idx,score,forceFail,extraConstFail);
  } else if(elem.kind==='jump'){
    const info=computeElementRate(p,ch,{level:elem.level,type:elem.type,late:elem.late,elemIndexAmongJumps:jumpPos,totalJumpElems:jumpElemIdxs.length,isCombo:false},true,false);
    let rate=info.rate; const cards=elem.cards||[];
    cards.forEach(c=>{ if(c.scope==='element') rate+=(c.delta||0); });
    if(rate<0)rate=0; if(rate>12)rate=12;
    let scoreBase=charScoreBase(ch,elem.level,elem.type); const mult=(elem.late?1.1:1)*dupPenaltyFactor(idx,-1);
    if(p.programState && p.programState.jumpBaseMult!==1) scoreBase=roundScore(scoreBase*p.programState.jumpBaseMult);
    if(ch.riskyTripleGamble && elem.riskyGamble) scoreBase=roundScore(scoreBase*3);
    if(p.programState && p.programState.guaranteedAllJumps){ rate = (ch.riskyTripleGamble && elem.riskyGamble) ? 3 : 12; }
    elem.pendingRoll=Math.floor(Math.random()*12)+1; elem.pendingRate=rate; elem.pendingScore=roundScore(scoreBase*mult);
    elem.pendingUrRoll=Math.floor(Math.random()*12)+1; // 언더/q 확인용 + 이재근 팝 판정용 추가 주사위
    elem.guaranteedUsed = !!(((ch.guaranteedQuad && elem.level===4) || (ch.guaranteedAxel && elem.type==='A')) && !S.cur.usedGuaranteedQuad);
    if(!elem.guaranteedUsed && elem.pendingRoll>rate){
      const rerollCard=cards.find(c=>c.reroll);
      if(rerollCard && !elem.rerollUsed){ elem.rerollUsed=true; elem.pendingRoll=Math.floor(Math.random()*12)+1; }
    }
    if((ch.guaranteedQuad || ch.guaranteedAxel) && elem.guaranteedUsed) S.cur.usedGuaranteedQuad=true;
    render(); // show the roll itself for a beat before confirming, so spectators can see it land
    setTimeout(()=>{ confirmJumpResult(idx); setTimeout(aiStepNext, 600); }, 500);
    return;
  } else if(elem.kind==='combo'){
    while(!S.cur.withdrawn && (elem.subStep===undefined ? (elem.subStep=0,true) : elem.subStep<elem.jumps.length)){
      const beforeStep=elem.subStep;
      comboRowUI(p,ch,elem,idx,jumpPos,jumpElemIdxs.length); // handles cascade auto-invalidation as a side effect
      if(elem.subStep>beforeStep) continue;
      const k=elem.subStep; const j=elem.jumps[k]; const isLead=k===0;
      const info=computeElementRate(p,ch,{level:j.level,type:j.type,late:elem.late,elemIndexAmongJumps:jumpPos,totalJumpElems:jumpElemIdxs.length,isCombo:true},isLead,!isLead);
      let rate=info.rate; const cards=elem.cards||[];
      cards.forEach(c=>{ if(c.scope==='element') rate+=(c.delta||0); });
      if(rate<0)rate=0; if(rate>12)rate=12;
      let scoreBase=charScoreBase(ch,j.level,j.type); const mult=(elem.late?1.1:1)*dupPenaltyFactor(idx,k);
      if(p.programState && p.programState.jumpBaseMult!==1) scoreBase=roundScore(scoreBase*p.programState.jumpBaseMult);
      if(p.programState && p.programState.guaranteedAllJumps){ rate = (ch.riskyTripleGamble && elem.riskyGamble) ? 3 : 12; }
      j.pendingRoll=Math.floor(Math.random()*12)+1; j.pendingRate=rate; j.pendingScore=roundScore(scoreBase*mult);
      j.pendingUrRoll=Math.floor(Math.random()*12)+1; // 언더/q 확인용 + 이재근 팝 판정용 추가 주사위
      j.guaranteedUsed = !!(((ch.guaranteedQuad && j.level===4) || (ch.guaranteedAxel && j.type==='A')) && !S.cur.usedGuaranteedQuad);
      if(!j.guaranteedUsed && j.pendingRoll>rate){
        const rerollCard=cards.find(c=>c.reroll);
        if(rerollCard && !elem.rerollUsed){ elem.rerollUsed=true; j.pendingRoll=Math.floor(Math.random()*12)+1; }
      }
      confirmComboSub(idx);
    }
    if(!S.cur.withdrawn) confirmComboResult(idx);
  }
  if(S.cur.withdrawn) return;
  render();
  setTimeout(aiStepNext, 900);
}

/* ============ TURN STRUCTURE ============ */
function jumpSlotsSpec(phase){
  if(phase==='short') return {jumpElems:3, combos:1, spin:3, step:1, choreo:0, choreospin:0};
  return {jumpElems:6, combos:2, spin:2, step:1, choreo:1, choreospin:1};
}
function computeDupViolations(plan, phase){
  const totalCounts = {};
  plan.forEach(e=>{
    if(e.kind==='jump'){ const k=e.level+e.type; totalCounts[k]=(totalCounts[k]||0)+1; }
    else if(e.kind==='combo'){ (e.jumps||[]).forEach(j=>{ const k=j.level+j.type; totalCounts[k]=(totalCounts[k]||0)+1; }); }
  });
  if(phase==='short'){
    // Short rule: a repeat is ONLY allowed when both occurrences are the lead+follow of
    // the SAME combo (e.g. 3Lo+3Lo combo is fine). Any other repeat - solo+solo, solo+combo,
    // or across two different combos - is disallowed, even just twice.
    let exemptKey=null;
    const comboElem = plan.find(e=>e.kind==='combo');
    if(comboElem && comboElem.jumps && comboElem.jumps.length===2){
      const [j0,j1]=comboElem.jumps;
      if(j0 && j1 && j0.type===j1.type && j0.level===j1.level) exemptKey = j0.level+''+j0.type;
    }
    return Object.keys(totalCounts).filter(k=>{
      const cnt=totalCounts[k];
      if(cnt<=1) return false;
      if(k===exemptKey) return cnt>2; // combo's own self-repeat pair is fine, anything beyond that isn't
      return true;
    });
  }
  // Free rule (unchanged): no two separate SOLO elements of the same kind, and total
  // occurrences (solo + every combo jump) capped at 2.
  const soloCounts = {};
  plan.filter(e=>e.kind==='jump').forEach(e=>{ const k=e.level+e.type; soloCounts[k]=(soloCounts[k]||0)+1; });
  const soloDupViolations = Object.keys(soloCounts).filter(k=>soloCounts[k]>1);
  const totalDupViolations = Object.keys(totalCounts).filter(k=>totalCounts[k]>2);
  return Array.from(new Set([...soloDupViolations, ...totalDupViolations]));
}
function startTurn(){
  if(!allPlansReady()){
    S.cur=null;
    S.screen='allPlan';
    render();
    return;
  }
  const pid=S.order[S.turnIdx];
  const p=S.players.find(x=>x.id===pid);
  if(S.phase==='free' && p.freeDQ){ nextTurn(); return; }
  const spec=jumpSlotsSpec(S.phase);
  S.cur={
    playerId:pid, step: p.planLocked ? (S.worldsMode?'roll':'cards') : 'plan',
    plan: p.planLocked ? p.plan : [],
    resolvedIdx:0,
    firstJumpFailed:false, lastFailStreak:0,
    successStreak:0, usedStreakBonus:false,
    log:[],
  };
  S.screen='turn';
  if(p.isAI && S.cur.step==='plan'){
    aiBuildPlanForActivePlayer();
  }
  if(S.cur.step==='cards'){
    aiAutoCardDecisions();
  } else if(S.worldsMode && S.cur.step==='roll'){
    if(enterRollPhase()) return;
  }
  render();
}

    if(spectating){

      const spec=jumpSlotsSpec(S.phase);
      const totalSlots=spec.jumpElems+spec.spin+(spec.choreospin||0)+spec.step+spec.choreo;
      const filledSlots=Math.min(S.cur.plan.length, totalSlots);
      const pct=totalSlots? Math.round((filledSlots/totalSlots)*100) : 0;
      return stepper+noSeatBanner+`<div class="panel"><h2>${p.name}(${ch.name})${t('의 플랜시트 작성 중…')}</h2>
        ${mine?`<p class="small" style="opacity:.75">${t('나: ')}${mine.name}(${charOf(mine).name})</p>`:''}
        <p class="sub">${t('상대가 아직 플랜시트를 짜는 중이에요. 완성해서 다음 단계로 넘어갈 때까지는 내용을 볼 수 없어요.')}</p>
        <div class="row between" style="margin-top:10px"><span class="small">${t('작성 진행도')}</span><span class="small"><b>${filledSlots}/${totalSlots}</b></span></div>
        <div style="height:8px;border-radius:6px;background:#e5e9f0;margin-top:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--gold);transition:width .3s"></div></div>
      </div>${mine?handPanel(mine):''}`;
    }
    return stepper+noSeatBanner+planScreen(p,ch);
  }
  if(S.cur.step==='cards') return stepper+noSeatBanner+cardsPhaseScreen(p,ch);
  if(S.cur.step==='roll') return stepper+noSeatBanner+banner+rollScreen(p,ch);
  if(S.cur.step==='summary') return stepper+noSeatBanner+banner+turnSummaryScreen(p,ch);
  return '';
}

/* ---- PLAN BUILDING ---- */
function computePlanFillPercent(plan){
  const spec = jumpSlotsSpec(S.phase);
  const total = spec.jumpElems + spec.spin + (spec.choreospin||0) + spec.step + spec.choreo;
  if(total<=0) return 100;
  const jumpCount=plan.filter(e=>e.kind==='jump').length;
  const comboCount=plan.filter(e=>e.kind==='combo').length;
  const spinCount=plan.filter(e=>e.kind==='spin').length;
  const choreospinCount=plan.filter(e=>e.kind==='choreospin').length;
  const stepCount=plan.filter(e=>e.kind==='step').length;
  const choreoCount=plan.filter(e=>e.kind==='choreo').length;
  const filled = Math.min(jumpCount+comboCount,spec.jumpElems)+Math.min(spinCount,spec.spin)+Math.min(choreospinCount,spec.choreospin||0)+Math.min(stepCount,spec.step)+Math.min(choreoCount,spec.choreo);
  return Math.min(100, Math.round(filled/total*100));
}
function planProgressPercent(pl){
  // the device actually editing this plan always has the freshest number, straight from S.cur
  if(S.cur && pl.id===S.cur.playerId) return computePlanFillPercent(S.cur.plan);
  // everyone else's plan content never syncs live (kept private on purpose) - but the small
  // percentage-only heartbeat in S.livePlanPct does, so use that if we have it
  if(S.livePlanPct && typeof S.livePlanPct[pl.id]==='number') return S.livePlanPct[pl.id];
  return computePlanFillPercent(pl.plan||[]);
}
function otherPlayersProgressPanel(){
  if(!S.cur || !S.cur.isPrePlanning) return '';
  const others = S.players.filter(pl=>pl.id!==S.cur.playerId);
  if(!others.length) return '';
  return `<div class="charbox" style="margin-bottom:10px">
    <div class="small" style="margin-bottom:4px;opacity:.8">${t('다른 선수 작성 현황')}</div>
    ${others.map(pl=>{
      const pct = pl.planLocked ? 100 : planProgressPercent(pl);
      return `<div style="margin-bottom:6px">
        <div class="row between small"><span>${pl.name}${pl.isAI?' 🤖':''}</span><span>${pl.planLocked?t('✓ 확정'):pct+'%'}</span></div>
        <div style="background:#e3e9ef;border-radius:6px;height:6px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${pl.planLocked?'var(--gold2)':'var(--rink2)'}"></div></div>
      </div>`;
    }).join('')}
  </div>`;
}
function planScreen(p,ch){

  const needsQuadAxel = S.phase==='free' && !!ch.requireQuadAxelFree;

  const spinCount=plan.filter(e=>e.kind==='spin').length;

  const dupCheck = computeDupPenalties(plan, S.phase);

  const hasDupIssue = dupCheck.voided.length>0 || tierVoidTags.length>0;
  const complete = jumpElemsUsed===spec.jumpElems && comboCount===spec.combos && spinCount===spec.spin && choreospinCount===(spec.choreospin||0) && stepCount===spec.step && choreoCount===spec.choreo && hasAxel && (!needsQuadAxel || hasQuadAxel) && !hasDupIssue;
  return `<div class="panel">

    ${dupCheck.voided.length || tierVoidTags.length?`<p class="warn">${t('⚠ 같은 점프를 너무 많이 겹치게 구성했어요 — 아래 무효(0점) 표시된 요소를 바꿔주세요.')}</p>`:''}
    ${dupCheck.penalties.length?`<p class="warn">${t('⚠ 같은 점프가 겹쳐서(REP) 80%만 인정되는 요소가 있어요.')}</p>`:''}

      <span class="chip ${stepCount===spec.step?'gold':''}">${t('스텝 ')}${stepCount}/${spec.step}</span>
      ${spec.choreo?`<span class="chip ${choreoCount===spec.choreo?'gold':''}">${t('코레오 ')}${choreoCount}/${spec.choreo}</span>`:''}

      ${jumpElemsUsed<spec.jumpElems && (spec.jumpElems-jumpElemsUsed-1)>=(spec.combos-comboCount) ? `<button onclick="addSoloJump()"><span class="ael-icon">${navIcon('arrowup')}</span>${t('단독 점프')}</button>`:''}
      ${spinCount<spec.spin?(()=>{const nextType=nextMissingSpinType(S.phase,ch.div,plan);return `<button onclick="addSimple('spin','${nextType}')"><span class="ael-icon">${navIcon('refresh')}</span>${t('스핀')} (${nextType} ${SPIN_TYPE_NAME[nextType]})</button>`;})():''}
      ${spec.choreospin && choreospinCount<spec.choreospin?`<button onclick="addSimple('choreospin')"><span class="ael-icon">${navIcon('refresh')}</span>${t('코레오스핀')}</button>`:''}

function fmtForbidden(f){
  if(/^[0-9]/.test(f)){ const lvl=f[0], type=f.slice(1); return lvl+type; }
  return f+t(' 전체');
}

function handPanel(p){
  const hand=S.phase==='short'?p.handShort:p.handFree;
  const mine = !ROOM || MY_ID===p.id;
  return `<div class="panel"><h3>${headerIcon('cards')}${p.name}${t('의 카드 (')}${hand.length}${t('장)')}</h3>
    <div class="hand-row">${mine ? (hand.map(c=>cardVisual(c)).join('')||`<span class="small">${t('카드 없음')}</span>`) : `<span class="small">${t('다른 선수의 카드는 공개되지 않습니다 (')}${hand.length}${t('장 보유)')}</span>`}</div>
  </div>`;
}
function renderPlanEdit(){
  // Plan edits are already excluded from what gets broadcast while pre-planning (S.cur is
  // stripped out before the state goes on the wire - see broadcastStateDebounced). Bumping the
  // shared rev counter on every single click here serves no purpose and actively causes bugs:
  // clicking around your plan sheet inflates YOUR rev far ahead of the other player's, so when
  // they later send something real (like a chat message), it gets wrongly rejected as "stale"
  // because their rev number is lower even though their message is newer. Skip the network
  // side entirely for these local-only edits so this can't happen.
  //
  // The one exception: we DO want the other player to see a live-filling progress gauge, without
  // leaking what's actually on the plan. So we separately track just a percentage (S.livePlanPct,
  // a plain top-level field - NOT part of S.cur, so it isn't stripped) and only ask for a
  // broadcast on the rare click that actually changes that number (adding/removing an element),
  // not on every fine-tuning click (changing a jump's type/level doesn't change the count).
  const isPre = !!(S.cur && S.cur.isPrePlanning);
  let pctChanged=false;
  if(isPre){
    S.livePlanPct = S.livePlanPct||{};
    const pct = planProgressPercent(curPlayer());
    if(S.livePlanPct[S.cur.playerId]!==pct){ S.livePlanPct[S.cur.playerId]=pct; pctChanged=true; }
  }
  render(isPre && !pctChanged);
}
function randomizePlan(){if(!iAmActive())return;

  else alert('무작위 배치에 실패했습니다. 다시 시도해주세요.');

}
function clearPlan(){if(!iAmActive())return;
  S.cur.plan=[];

}
/* ---- 💾 커스텀 플랜 저장 (기본 기능, 상점 아이템 아님) ----
   선수(캐릭터)별로, 쇼트/프리를 구분해서 이 기기에 원하는 만큼 구성을 저장해두고 다음에
   같은 캐릭터로 플레이할 때 바로 불러올 수 있다. 게임 진행 중 상태(카드/주사위 결과 등)는
   저장하지 않고 순수 "무엇을 몇 번 뛸지" 구조만 저장한다 - 온라인 동기화 대상도 아니다
   (S.cur 밖의 로컬 localStorage라 상대에게 전혀 전송되지 않는다). */
const PLAN_PRESETS_KEY='skate_planPresets_v1';
function loadPlanPresetsAll(){ try{ const raw=localStorage.getItem(PLAN_PRESETS_KEY); return raw?(JSON.parse(raw)||{}):{}; }catch(e){ return {}; } }
function savePlanPresetsAll(obj){ try{ localStorage.setItem(PLAN_PRESETS_KEY, JSON.stringify(obj)); }catch(e){} }
function planPresetKey(charId,phase){ return charId+'__'+phase; }
function sanitizePlanForPreset(plan){
  return plan.map(e=>{
    if(e.kind==='jump') return {kind:'jump', type:e.type, level:e.level, late:!!e.late};
    if(e.kind==='combo') return {kind:'combo', late:!!e.late, jumps:(e.jumps||[]).map(j=>({type:j.type, level:j.level}))};
    if(e.kind==='spin') return {kind:'spin', spinType:e.spinType, late:!!e.late};
    if(e.kind==='step') return {kind:'step', late:!!e.late};
    if(e.kind==='choreo') return {kind:'choreo', late:!!e.late};
    if(e.kind==='choreospin') return {kind:'choreospin', late:!!e.late};
    return null;
  }).filter(Boolean);
}
function currentPlanPresetList(){
  const p=curPlayer(); if(!p) return [];
  const ch=charOf(p);
  const all=loadPlanPresetsAll();
  return all[planPresetKey(ch.id,S.phase)]||[];
}
function saveCurrentPlanPreset(){
  if(!iAmActive())return;
  const p=curPlayer(); const ch=charOf(p);
  if(!S.cur.plan.length){ alert('저장할 구성이 비어있어요.'); return; }
  const name=(prompt('저장할 이름을 입력하세요 (예: 안정형, 고득점 도전형)')||'').trim();
  if(!name) return;
  const all=loadPlanPresetsAll();
  const key=planPresetKey(ch.id,S.phase);
  all[key]=all[key]||[];
  const entry={name, ts:Date.now(), plan:sanitizePlanForPreset(S.cur.plan)};
  const dupIdx=all[key].findIndex(x=>x.name===name);
  if(dupIdx>=0){
    if(!confirm('"'+name+'" 이름으로 이미 저장된 구성이 있어요. 덮어쓸까요?')) return;
    all[key][dupIdx]=entry;
  } else {
    all[key].unshift(entry);
  }
  all[key]=all[key].slice(0,12); // 캐릭터+구간당 최대 12개
  savePlanPresetsAll(all);
  planPresetPanelOpen=true;
  renderPlanEdit();
}
function applyPlanPreset(i){
  if(!iAmActive())return;
  const list=currentPlanPresetList();
  const entry=list[i];
  if(!entry) return;
  S.cur.plan = entry.plan.map(e=>{
    if(e.kind==='combo') return {kind:'combo', late:!!e.late, jumps:(e.jumps||[]).map(j=>({type:j.type, level:j.level})), cards:[]};
    return Object.assign({}, e, {cards:[]});
  });
  renderPlanEdit();
}
function deletePlanPreset(i){
  if(!iAmActive())return;
  const p=curPlayer(); const ch=charOf(p);
  const all=loadPlanPresetsAll();
  const key=planPresetKey(ch.id,S.phase);
  if(!all[key] || !all[key][i]) return;
  if(!confirm('"'+all[key][i].name+'" 구성을 삭제할까요?')) return;
  all[key].splice(i,1);
  savePlanPresetsAll(all);
  renderPlanEdit();
}
function togglePlanPresetPanel(){ planPresetPanelOpen=!planPresetPanelOpen; renderPlanEdit(); }
function planPresetPanelHTML(){
  const list=currentPlanPresetList();

}

function removeElem(i){if(!iAmActive())return; S.cur.plan.splice(i,1); renderPlanEdit(); }
// 요소 순서 바꾸기 — "⠿" 손잡이를 누른 채 위/아래로 드래그해서 순서를 바꾼다. 마우스·터치
// 둘 다 pointer 이벤트 하나로 처리(모바일 앱이라 touch가 기본이라야 함).
let planDrag = null; // {fromIdx, overIdx, startY, el}
function planDragStart(ev, i){
  if(!iAmActive()) return;
  ev.preventDefault();
  const slot = ev.currentTarget.closest('.slot');
  planDrag = { fromIdx:i, overIdx:i, startY:(ev.touches?ev.touches[0].clientY:ev.clientY), el:slot };
  slot.classList.add('dragging');

  document.addEventListener('pointerup', planDragEnd);
  document.addEventListener('pointercancel', planDragEnd);
}
function planDragMove(ev){
  if(!planDrag) return;
  if(!planDrag.el.isConnected){ planDragEnd(); return; } // 드래그 중 다른 이유로 화면이 다시 그려진 경우 안전하게 종료
  const y = ev.clientY;
  // 현재 포인터 아래 있는 슬롯을 찾아서 그 인덱스를 "놓을 위치" 후보로 표시한다.
  const under = document.elementFromPoint(ev.clientX, y);
  const slotEl = under && under.closest && under.closest('.slot');
  const container = planDrag.el.parentElement;
  if(slotEl && slotEl.parentElement===container){
    const idx = parseInt(slotEl.getAttribute('data-plan-idx'),10);
    if(!isNaN(idx) && idx!==planDrag.overIdx){
      planDrag.overIdx = idx;
      container.querySelectorAll('.slot').forEach(s=>s.classList.remove('drag-over-top','drag-over-bottom'));
      slotEl.classList.add(idx<planDrag.fromIdx ? 'drag-over-top' : 'drag-over-bottom');
    }
  }
}
function planDragEnd(){
  if(!planDrag) return;
  document.removeEventListener('pointermove', planDragMove);
  document.removeEventListener('pointerup', planDragEnd);
  document.removeEventListener('pointercancel', planDragEnd);
  const {fromIdx, overIdx} = planDrag;
  planDrag = null;
  if(fromIdx!==overIdx && overIdx>=0 && overIdx<S.cur.plan.length){
    const plan=S.cur.plan;
    const [moved]=plan.splice(fromIdx,1);

function lateEligibleSet(plan, phase){
  const jumpIdxs = plan.map((e,ix)=>ix).filter(ix=> plan[ix].kind==='jump'||plan[ix].kind==='combo');
  const N = phase==='short'?1:3;
  return new Set(jumpIdxs.slice(-N));
}
function planRateBreakdown(p,ch,level,type,isLead,isFollow,late,isCombo){
  const base = isFollow ? comboRate(level,type,ch.div) : soloRate(level,type,ch.div);
  let locked=null;
  (ch.locked||[]).forEach(l=>{ if(l.level===level&&l.type===type) locked=l.rate; });
  if(locked!==null) return {base, delta:0, final:locked, isLocked:true};
  let delta=0;
  (ch.mods||[]).forEach(m=>{
    let ok=true;
    if(m.types && !m.types.includes(type)) ok=false;
    if(m.excludeTypes && m.excludeTypes.includes(type)) ok=false;
    if(m.levels && !m.levels.includes(level)) ok=false;
    if(m.exact && !(m.exact.level===level && m.exact.type===type)) ok=false;
    if(m.excludeExact && m.excludeExact.some(ex=>ex.level===level && ex.type===type)) ok=false;
    if(m.comboLeadOnly && !isLead) ok=false;
    if(m.comboFollowOnly && !isFollow) ok=false;
    if(m.soloOnly && isCombo) ok=false;
    if(ok) delta+=m.delta;
  });
  if(ch.twinOf && S.players.some(pl=>pl.id!==p.id && charOf(pl).id===ch.twinOf)) delta+=2;
  if(typeof S!=='undefined' && S && S.order){
    const myIdx=S.order.indexOf(p.id);
    if(myIdx>=0){
      [S.order[myIdx-1], S.order[myIdx+1]].forEach(nid=>{
        if(!nid) return;
        const neighbor=S.players.find(pl=>pl.id===nid);
        if(neighbor && charOf(neighbor).neighborDebuff) delta -= charOf(neighbor).neighborDebuff;
      });
    }
  }
  if(late) delta-=1;
  if(myProfile && myProfile.favoriteSkater && myProfile.favoriteSkater===ch.id && (!ROOM || MY_ID===p.id)) delta+=1;
  if(p.careerGrowthBonus) delta+=p.careerGrowthBonus;
  delta += conquerRateBonus(p, ch, level, type); // 🏅 정복 보너스도 미리보기에 그대로 반영
  let final=base+delta;
  if(final<0) final=0; if(final>12) final=12;
  return {base, delta, final, isLocked:false};
}
function rateBreakdownLine(p,ch,level,type,isLead,isFollow,late,isCombo){
  const b=planRateBreakdown(p,ch,level,type,isLead,isFollow,late,isCombo);
  if(b.isLocked) return `<div class="small" style="color:var(--gold2)">고정 성공률 ${b.final}/12 (캐릭터 특성)</div>`;
  if(b.delta===0) return '';
  return `<div class="small" style="color:var(--gold2)">${b.base}/12 ${b.delta>0?'+':''}${b.delta}/12 = ${b.final}/12 (캐릭터 특성)</div>`;
}

function planHasUsedSpecialFollow(excludeElem){
  const ch=charOf(curPlayer());
  return S.cur.plan.some(el=> el!==excludeElem && el.kind==='combo' && el.jumps.some((j,k)=>{
    if(k===0) return false;

function comboFollowTypeOptions(e,k){
  const ch=charOf(curPlayer());
  const banned=ch.banComboFollowTypes||[];
  const base=['T','Lo'].filter(t=>!banned.includes(t));
  if(S.phase!=='free') return base;
  const otherFollows = e.jumps.filter((j,idx)=>idx>0 && idx!==k).map(j=>j.type);
  const axelCount = otherFollows.filter(t=>t==='A').length;
  const hasSF = otherFollows.some(t=>t==='S'||t==='F');
  const sfBudgetFree = !planHasUsedSpecialFollow(e); // salchow/flip: once per free program, shared across all combos
  let opts=[...base];
  if(axelCount<2 && (ch.comboFollowAxelFree || sfBudgetFree || hasSF)) opts.push('A'); // axel: up to 2 in a row; 황이안 unlimited, others share the once-per-game budget (unless this combo already committed to it)
  if(!hasSF && sfBudgetFree){ opts.push('S','F'); }
  return [...new Set(opts)].filter(t=>!banned.includes(t));
}
function canExtendCombo(e){
  if(S.phase!=='free') return false;
  const ch=charOf(curPlayer());
  if(ch.comboFollowAxelFree) return true;
  const hasSpecial = e.jumps.some((j,k)=>k>0 && (j.type==='A'||j.type==='S'||j.type==='F'));
  return hasSpecial || !planHasUsedSpecialFollow(e);
}

  if(S.phase==='short' && ch.div!=='men' && !(ch.shortQuadTypes && ch.shortQuadTypes.includes(type))) return false; // short blocks quads for women's div, unless character-specific exception; men's div allowed
  if(ch.div==='men') return true; // men's division can attempt all quad types
  if(type==='T'||type==='S') return true; // generally attemptable
  return !!(ch.extraQuad && ch.extraQuad.includes(type)); // F/Lz/A quads need the specific skill
}

function cardTargetPickerScreen(p,pc){
  const owner=S.players.find(x=>x.id===pc.ownerId);
  const hand=S.phase==='short'?owner.handShort:owner.handFree;
  const card=hand[pc.ci];
  if(!card){ localPendingCard=null; return cardsPhaseScreen(p, charOf(p)); }
  const isSelfUse = pc.ownerId===pc.targetId;
  const eligible = isSelfUse
    ? S.cur.plan.map((e,idx)=>({e,idx})).filter(o=> !o.e.result && (card.scope==='nonjump' ? ((o.e.kind==='spin'||o.e.kind==='step'||o.e.kind==='choreo'||o.e.kind==='choreospin') && !(card.excludeKinds&&card.excludeKinds.includes(o.e.kind))) : (o.e.kind==='jump'||o.e.kind==='combo')))
    : S.cur.plan.map((e,idx)=>({e,idx})).filter(o=> !o.e.result);
  const spectator=isSpectatorNow();
  const isSelfBuff = card.type!=='disrupt' && pc.ownerId===pc.targetId && !spectator;
  const ownerCh = charOf(owner);
  const jumpElems=[]; S.cur.plan.forEach((el,idx)=>{ if(el.kind==='jump'||el.kind==='combo') jumpElems.push(idx); });
  return `<div class="panel">
    <h2>🎯 "${card.name}" 적용 대상 선택</h2>
    <p class="sub">${card.desc}</p>
    ${eligible.length? `<div class="row" style="flex-wrap:wrap">${eligible.map(o=>{
        let label='', infoTxt='';
        if(spectator){
          // opponents shouldn't even know what KIND of element this is (jump/spin/step/choreo) - position only
        } else if(o.e.kind==='combo'){
          const subNames=['선행','연결'];
          label = comboCode(o.e.jumps);
          if(isSelfBuff){
            const jumpPos=jumpElems.indexOf(o.idx);
            const rateTxts=o.e.jumps.map((j,k)=>{
              const info=computeElementRate(owner,ownerCh,{level:j.level,type:j.type,late:o.e.late,elemIndexAmongJumps:jumpPos,totalJumpElems:jumpElems.length,isCombo:true},k===0,k>0);
              let rate=info.rate; (o.e.cards||[]).forEach(c=>{ if(c.scope==='element') rate+=(c.delta||0); }); if(rate<0)rate=0; if(rate>12)rate=12;
              return subNames[k]+' '+rate+'/12';
            });
            infoTxt = ` (현재 ${rateTxts.join(', ')})`;
          }
        } else if(o.e.kind==='jump'){
          label = jCode(o.e.level,o.e.type);
          if(isSelfBuff){
            const jumpPos=jumpElems.indexOf(o.idx);
            const info=computeElementRate(owner,ownerCh,{level:o.e.level,type:o.e.type,late:o.e.late,elemIndexAmongJumps:jumpPos,totalJumpElems:jumpElems.length,isCombo:false},true,false);
            let rate=info.rate; (o.e.cards||[]).forEach(c=>{ if(c.scope==='element') rate+=(c.delta||0); }); if(rate<0)rate=0; if(rate>12)rate=12;
            infoTxt = ` (현재 ${rate}/12)`;
          }
        } else {
          label = o.e.kind==='spin' ? (o.e.spinType||'스핀') : {step:'StSq',choreo:'ChSq1',choreospin:'ChSp1'}[o.e.kind];
          if(isSelfBuff){
            let goeDeltaRaw=0; (o.e.cards||[]).forEach(c=>{ if(c.scope==='nonjump'&&c.goeDelta) goeDeltaRaw+=c.goeDelta; });
            if(o.e.kind==='choreo' || o.e.kind==='choreospin'){
              const cardDelta=roundScore(goeDeltaRaw*0.5); // fixed ×0.5 factor, same as choreo/choreospin's natural GOE
              infoTxt = ` (현재 ${roundScore(nonjumpBaseScore(o.e,ownerCh)+cardDelta)}점)`;
            } else {
              const lo0 = o.e.kind==='spin' ? spinTypeScore(o.e.spinType,1) : STEP_LEVEL_SCORE[1];
              const hi0 = o.e.kind==='spin' ? spinTypeScore(o.e.spinType,4) : STEP_LEVEL_SCORE[4];
              // 레벨마다 기초점이 달라서 카드 효과의 실제 점수도 레벨별로 다름 (기초점 × 0.1 팩터)
              const lo=roundScore(lo0+goeDeltaRaw*lo0*0.1), hi=roundScore(hi0+goeDeltaRaw*hi0*0.1);
              infoTxt = ` (레벨별 ${lo}~${hi}점, 굴려야 확정)`;
            }
          }
        }
        return `<button class="btn-ghost" onclick="playCard('${pc.ownerId}',${pc.ci},'${pc.targetId}',${o.idx})">${o.idx+1}번${label?' · '+label:''}${infoTxt}</button>`;
      }).join('')}</div>` : `<p class="warn">적용할 대상 요소가 없습니다.</p>`}
    <button class="btn-ghost" style="margin-top:12px;width:100%" onclick="cancelCardTargeting()">취소</button>
  </div>`;
}
function beginCardTargeting(ownerId,ci,targetId){
  const owner=S.players.find(x=>x.id===ownerId);
  if(!(owner&&owner.isAI) && MY_ID && MY_ID!==ownerId){ alert('본인의 카드만 사용할 수 있습니다.'); return; }
  const hand=S.phase==='short'?owner.handShort:owner.handFree;
  const card=hand[ci];
  if(!card) return;
  const target=S.players.find(x=>x.id===targetId);
  if(card.type==='disrupt' && target && charOf(target).debuffImmune){
    playCard(ownerId,ci,targetId); // will short-circuit inside playCard and just consume the card with no effect
    return;
  }
  if(card.scope==='element'||card.scope==='nonjump'){
    localPendingCard={ownerId,ci,targetId};
    render(true); // local-only selection state - nothing to sync
  } else {
    playCard(ownerId,ci,targetId);
  }
}
function cancelCardTargeting(){ localPendingCard=null; render(true); }
function beginTradeOffer(ownerId,ci){
  const owner=S.players.find(x=>x.id===ownerId);

  const hand=S.phase==='short'?owner.handShort:owner.handFree;
  if(!hand[ci]) return;

}

function tradeTargetPickerScreen(p,ptc){

    <button class="btn-ghost" style="margin-top:12px;width:100%" onclick="cancelTradeTargeting()">${t('취소')}</button>
  </div>`;

function proposeTrade(fromId,ci,toId){
  if(ROOM && MY_ID && MY_ID!==fromId) return;
  if(S.cur.tradeOffer){ alert('이미 진행 중인 카드 교환 제안이 있어요.'); return; }
  const fromP=S.players.find(x=>x.id===fromId);
  const toP=S.players.find(x=>x.id===toId);
  if(!fromP || !toP || fromId===toId) return;
  const hand=S.phase==='short'?fromP.handShort:fromP.handFree;
  const card=hand[ci];
  if(!card) return;
  const toHand=S.phase==='short'?toP.handShort:toP.handFree;
  if(!toHand.length){ if(!(fromP&&fromP.isAI)) alert(toP.name+'은(는) 교환할 카드가 없어요.'); return; }
  hand.splice(ci,1); // escrowed until accept/decline/cancel
  S.cur.tradeOffer={fromId, toId, offeredCard:card};
  if(localPendingTradeCard && localPendingTradeCard.ownerId===fromId) localPendingTradeCard=null;
  if(!S.cur.log) S.cur.log=[];
  S.cur.log.push(fromP.name+'가 '+toP.name+'에게 카드 교환을 제안했어요.');
  if(toP.isAI){ aiRespondToTrade(); return; }
  render();
}
function aiRespondToTrade(){
  const trade=S.cur.tradeOffer; if(!trade) return;
  const toP=S.players.find(x=>x.id===trade.toId);
  if(!toP || !toP.isAI) return;
  const toHand=S.phase==='short'?toP.handShort:toP.handFree;
  if(Math.random()<0.6 && toHand.length){
    completeTradeAccept(Math.floor(Math.random()*toHand.length));
  } else {
    declineTrade();
  }
}
function completeTradeAccept(ci){
  const trade=S.cur.tradeOffer; if(!trade) return;
  if(ROOM && MY_ID && MY_ID!==trade.toId) return;
  const toP=S.players.find(x=>x.id===trade.toId);
  const fromP=S.players.find(x=>x.id===trade.fromId);
  if(!toP || !fromP) return;
  const toHand=S.phase==='short'?toP.handShort:toP.handFree;
  const givenCard=toHand[ci];
  if(!givenCard) return;
  toHand.splice(ci,1);
  toHand.push(trade.offeredCard);
  const fromHand=S.phase==='short'?fromP.handShort:fromP.handFree;
  fromHand.push(givenCard);
  if(!S.cur.log) S.cur.log=[];
  S.cur.log.push('🔄 '+fromP.name+'와(과) '+toP.name+'가 카드를 교환했어요!');
  S.cur.tradeOffer=null;
  render();
}
function declineTrade(){
  const trade=S.cur.tradeOffer; if(!trade) return;
  if(ROOM && MY_ID && MY_ID!==trade.toId) return;
  const fromP=S.players.find(x=>x.id===trade.fromId);
  const toP=S.players.find(x=>x.id===trade.toId);
  if(fromP){ const fromHand=S.phase==='short'?fromP.handShort:fromP.handFree; fromHand.push(trade.offeredCard); }
  if(!S.cur.log) S.cur.log=[];
  S.cur.log.push((toP?toP.name:'상대')+'가 카드 교환 제안을 거절했어요.');
  S.cur.tradeOffer=null;
  render();
}
function cancelTradeOffer(){
  const trade=S.cur.tradeOffer; if(!trade) return;
  if(ROOM && MY_ID && MY_ID!==trade.fromId) return;
  const fromP=S.players.find(x=>x.id===trade.fromId);
  if(fromP){ const fromHand=S.phase==='short'?fromP.handShort:fromP.handFree; fromHand.push(trade.offeredCard); }
  S.cur.tradeOffer=null;
  render();
}
function handPhoneToTradeRecipient(){
  const trade=S.cur.tradeOffer; if(!trade || ROOM) return; // local pass-and-play only
  const idx=S.players.findIndex(x=>x.id===trade.toId);
  if(idx>=0) S.cur.cardPassIdx=idx;
  render();
}

      ${hand.map((c,ci)=>{
        const canPlay = !(isSelf && c.type==='disrupt');

          : `${cardVisual(c,{extraClass:'disabled'})}<div class="small" style="opacity:.6;text-align:center;margin-top:-2px">${t('자신에게 사용 불가')}</div>`;
        const tradeBtn = canTradeNow ? `<button class="btn-ghost" onclick="beginTradeOffer('${owner.id}',${ci})" title="${'이 카드를 다른 선수에게 교환 제안'}">🔄 ${t('교환 제안')}</button>` : '';
        const teammateBtn = (isSelf && S.teamMode) ? `<button class="btn-ghost" onclick="giveCardToTeammate('${owner.id}',${ci})" title="팀원에게 이 카드를 바로 건네줘요 (수락 절차 없음)">🤝 ${t('팀원에게 주기')}</button>` : '';
        return `<div class="card-slot">${playBtn}<div class="card-slot-actions">${tradeBtn}${teammateBtn}</div></div>`;
      }).join('')}

    ${localPassMode?`<button class="btn-main btn-sm" style="width:100%;margin-top:8px" onclick="advanceCardPass()">${`✅ ${owner.name} 카드 사용 완료 — 다음 선수에게 폰 넘기기 →`}</button>`
      : (ROOM && hand.length ? `<button class="btn-main btn-sm" style="width:100%;margin-top:8px" onclick="markCardDone('${owner.id}')">${`✅ ${owner.name} 카드 사용 완료`}</button>` : '')}
  </div>`;
}
