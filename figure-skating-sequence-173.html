  if(!entries.length){
    return `<div class="charbox" style="margin-top:12px">
      <div class="row between"><b>📊 오늘의 점수 랭킹</b>${cloudStatusLine()}</div>
      ${divisionFilterTabs()}${categoryFilterTabs()}
      <p class="small" style="margin-top:6px;opacity:.7">${`아직 오늘 기록된 ${categoryLabel()} 점수가 없어요. 최종 결과를 보면 자동으로 여기 쌓여요.`}</p>
      ${refreshBtn}
    </div>`;
  }
  return `<div class="charbox" style="margin-top:12px">
    <div class="row between"><b>📊 오늘의 점수 랭킹</b><span class="small" style="opacity:.6">${today} ${shareNote}</span></div>
    ${divisionFilterTabs()}${categoryFilterTabs()}
    <p class="small" style="opacity:.6;margin-top:2px">점수를 누르면 그 경기 당시 플랜시트를 볼 수 있어요.</p>
    ${cloudStatusLine()}
    <table style="margin-top:6px"><tr><th>순위</th><th>선수</th><th>캐릭터</th><th>${categoryLabel()} 점수</th><th></th></tr>
    ${shown.map((e,i)=>{
      const key=entryKey(e);
      const open=expandedRankingEntry===key;
      return `<tr class="${i===0?'rank1':''}" style="cursor:pointer" onclick="toggleRankingEntry('${key}')"><td>${medals[i]||i+1}</td><td>${esc(e.name)}${e.isAI?' 🤖':''}</td><td>${esc(e.charName)}</td><td><b>${e[scoreField]}</b> <span class="small" style="opacity:.5">${open?'▲':'📋'}</span></td><td><button class="btn-ghost btn-sm" style="padding:2px 6px;font-size:.65rem" onclick="event.stopPropagation();deleteTodayScoreEntry('${key}')">🗑</button></td></tr>${open?`<tr><td colspan="5">${rankingEntryDetailHTML(e)}</td></tr>`:''}`;
    }).join('')}
    </table>
    ${limit && entries.length>limit?`<p class="small" style="margin-top:4px;opacity:.7">상위 ${limit}명만 표시 중 (총 ${entries.length}건)</p>`:''}
    ${refreshBtn}${pendingResetConfirm && pendingResetConfirm.type==='today'
      ? `<button class="btn-ghost btn-sm" style="margin-top:8px;color:#c0455a;border-color:#c0455a" onclick="requestClearTodayScores()">⚠️ 정말요? 5초 안에 다시 누르면 진짜 삭제돼요</button>`
      : `<button class="btn-ghost btn-sm" style="margin-top:8px" onclick="requestClearTodayScores()">🗑 오늘 기록 초기화</button>`}
  </div>`;
}
function overallBestPanel(){
  const cloud = cloudEnabled();
  if(cloud) cloudFetchRankings();
  const map = cloud ? (cloudOverallBest||{}) : normalizeBestRecord((S && S.sharedOverallBest!==undefined) ? S.sharedOverallBest : loadOverallBest())||{};
  const rec = map[rankingCategoryFilter];
  const shareNote = cloud ? '· ☁️ 서버 공유 (이 파일을 가진 모두와 합산)' : (ROOM ? '· 지금 이 방 참가자들과 공유돼요' : '· 이 기기 기준 (온라인 방에 들어가면 참가자끼리 공유돼요)');
  const refreshBtn = cloud ? `<button class="btn-ghost btn-sm" style="margin-top:8px;margin-right:6px" onclick="cloudFetchRankings(true)">🔄 서버에서 새로고침</button>` : '';
  if(!rec){
    return `<div class="charbox" style="margin-top:12px">
      <div class="row between"><b>👑 전체 최고기록</b>${cloudStatusLine()}</div>
      ${categoryFilterTabs()}
      <p class="small" style="margin-top:6px;opacity:.7">${`캐릭터 상관없이 지금까지 나온 가장 높은 ${categoryLabel()} 점수예요. 아직 기록이 없어요.`}</p>
      ${refreshBtn}
    </div>`;
  }
  const key=entryKey(rec)+'_'+rankingCategoryFilter;
  const open=expandedRankingEntry===key;
  return `<div class="charbox" style="margin-top:12px">
    <div class="row between"><b>👑 전체 최고기록</b><span class="small" style="opacity:.6">${shareNote}</span></div>
    ${categoryFilterTabs()}
    <p class="small" style="opacity:.6;margin-top:2px">${`캐릭터 상관없이 지금까지 나온 가장 높은 ${categoryLabel()} 점수예요. 점수를 누르면 플랜시트를 볼 수 있어요.`}</p>
    ${cloudStatusLine()}
    <div class="row between" style="margin-top:8px;cursor:pointer;align-items:center" onclick="toggleRankingEntry('${key}')">
      <span>${esc(rec.name)}${rec.isAI?' 🤖':''} <span class="small" style="opacity:.7">(${esc(rec.charName)})</span></span>
      <b style="font-size:1.2rem">${rec.total}점 <span class="small" style="opacity:.5">${open?'▲':'📋'}</span></b>
    </div>
    ${open?rankingEntryDetailHTML(rec):''}
    <button class="btn-ghost btn-sm" style="margin-top:8px;margin-right:6px" onclick="deleteOverallBestCategory()">🗑 이 기록(${categoryLabel()})만 삭제</button>
    ${refreshBtn}${pendingResetConfirm && pendingResetConfirm.type==='overall'
      ? `<button class="btn-ghost btn-sm" style="margin-top:8px;color:#c0455a;border-color:#c0455a" onclick="requestClearOverallBest()">⚠️ 정말요? 5초 안에 다시 누르면 진짜 삭제돼요</button>`
      : `<button class="btn-ghost btn-sm" style="margin-top:8px" onclick="requestClearOverallBest()">🗑 전체 최고기록 모두 초기화</button>`}
  </div>`;
}
function personalBestsPanel(limit){
  const cloud = cloudEnabled();
  if(cloud) cloudFetchRankings();
  const map = cloud ? (cloudPersonalBests||{}) : normalizeBestsMap((S && S.sharedPersonalBests) ? S.sharedPersonalBests : loadPersonalBests());
  const cat=rankingCategoryFilter;
  const entries = Object.keys(map)
    .filter(charId=>map[charId] && map[charId][cat])
    .map(charId=>Object.assign({charId}, map[charId][cat]))
    .filter(e=>{
      if(rankingDivisionFilter==='all') return true;
      const ch=CHARACTERS.find(c=>c.id===e.charId);
      return ch ? ch.div===rankingDivisionFilter : e.division===rankingDivisionFilter;
    }).sort((a,b)=>b.total-a.total);
  const shown = limit ? entries.slice(0,limit) : entries;
  const shareNote = cloud ? '· ☁️ 서버 공유 (이 파일을 가진 모두와 합산)' : (ROOM ? '· 지금 이 방 참가자들과 공유돼요' : '· 이 기기 기준 (온라인 방에 들어가면 참가자끼리 공유돼요)');
  const refreshBtn = cloud ? `<button class="btn-ghost btn-sm" style="margin-top:8px;margin-right:6px" onclick="cloudFetchRankings(true)">🔄 서버에서 새로고침</button>` : '';
  if(!entries.length){
    return `<div class="charbox" style="margin-top:12px">
      <div class="row between"><b>🏅 캐릭터별 퍼스널 베스트</b>${cloudStatusLine()}</div>
      ${divisionFilterTabs()}${categoryFilterTabs()}
      <p class="small" style="margin-top:6px;opacity:.7">${`아직 ${categoryLabel()} 기록이 없어요. 경기를 마치면 캐릭터별 최고 기록이 자동으로 저장돼요.`}</p>
      ${refreshBtn}
    </div>`;
  }
  return `<div class="charbox" style="margin-top:12px">
    <div class="row between"><b>🏅 캐릭터별 퍼스널 베스트</b><span class="small" style="opacity:.6">${shareNote}</span></div>
    ${divisionFilterTabs()}${categoryFilterTabs()}
    <p class="small" style="opacity:.6;margin-top:2px">점수를 누르면 그 경기 당시 플랜시트를 볼 수 있어요.</p>
    ${cloudStatusLine()}
    <table style="margin-top:6px"><tr><th>캐릭터</th><th>${categoryLabel()} 최고점</th><th>기록자</th><th></th></tr>
    ${shown.map(e=>{
      const key=entryKey(e)+'_'+cat;
      const open=expandedRankingEntry===key;
      return `<tr style="cursor:pointer" onclick="toggleRankingEntry('${key}')"><td>${esc(e.charName)}</td><td><b>${e.total}</b> <span class="small" style="opacity:.5">${open?'▲':'📋'}</span></td><td>${esc(e.name)}${e.isAI?' 🤖':''}</td><td><button class="btn-ghost btn-sm" style="padding:2px 6px;font-size:.65rem" onclick="event.stopPropagation();deletePersonalBestCategory('${e.charId}')">🗑</button></td></tr>${open?`<tr><td colspan="4">${rankingEntryDetailHTML(e)}</td></tr>`:''}`;
    }).join('')}
    </table>
    ${limit && entries.length>limit?`<p class="small" style="margin-top:4px;opacity:.7">상위 ${limit}개만 표시 중 (총 ${entries.length}개 캐릭터)</p>`:''}
    ${refreshBtn}${pendingResetConfirm && pendingResetConfirm.type==='personal'
      ? `<button class="btn-ghost btn-sm" style="margin-top:8px;color:#c0455a;border-color:#c0455a" onclick="requestClearPersonalBests()">⚠️ 정말요? 5초 안에 다시 누르면 진짜 삭제돼요</button>`
      : `<button class="btn-ghost btn-sm" style="margin-top:8px" onclick="requestClearPersonalBests()">🗑 퍼스널 베스트 모두 초기화</button>`}
  </div>`;
}

function categoryBadge(p, cat){
  const a=lastGameAchievements[p.id];
  if(!a) return '';
  if(a.overallBest[cat]) return '<div class="small" style="color:var(--gold2)">👑</div>';
  if(a.personalBest[cat]) return '<div class="small" style="color:var(--gold2)">PB</div>';
  return '';
}
function finalScreen(){
  const rows=[...S.players].map(p=>{
    const total=roundScore((p.scoreShort||0)+(p.freeDQ?0:(p.scoreFree||0)));
    return {p,total};
  });
  rows.sort((a,b)=>{
    if(b.total!==a.total) return b.total-a.total;
    const ia=S.order.indexOf(a.p.id), ib=S.order.indexOf(b.p.id);
    return ia-ib; // tie: whoever competed first (earlier in turn order) ranks higher
  });
  // 소트니코바 계열 bribe win check
  const bribeWinner=S.players.find(p=>charOf(p).bribeWin && !isPassiveNullified(charOf(p)) && (p.handFree||[]).some(c=>c.name==='뇌물'));
  const medals=['🥇','🥈','🥉'];
  const teamBlock = S.teamMode ? (()=>{
    const totals=teamTotals();
    const winTeam = totals.A>=totals.B ? 'A' : 'B';
    return `<div class="charbox" style="margin-bottom:10px;border:1px solid var(--gold2)">
      <b>🤝 월드 팀 트로피 — 팀 합계 순위</b>
      <div class="row between" style="margin-top:6px"><span>${winTeam==='A'?'🥇 ':''}🅰️ A팀 (${S.players.filter(p=>p.team==='A').map(p=>esc(p.name)).join(', ')})</span><b>${totals.A}점</b></div>
      <div class="row between" style="margin-top:4px"><span>${winTeam==='B'?'🥇 ':''}🅱️ B팀 (${S.players.filter(p=>p.team==='B').map(p=>esc(p.name)).join(', ')})</span><b>${totals.B}점</b></div>
    </div>`;
  })() : '';
  return `<div class="panel">
    <h2>🏆 최종 결과</h2>
    ${teamBlock}
    ${bribeWinner?`<div class="ok-msg">✨ ${bribeWinner.name}(${charOf(bribeWinner).name})가 '뇌물' 카드를 끝까지 손에 쥐고 있어 점수와 상관없이 <b>금메달</b>을 차지합니다!</div>`:''}
    <table><tr><th>순위</th><th>선수</th>${S.teamMode?'<th>팀</th>':''}<th>캐릭터</th><th>쇼트</th><th>프리</th><th>합계</th></tr>
    ${rows.map((r,i)=>{
      const p=r.p;
      const shortOpen = expandedProtocol && expandedProtocol.playerId===p.id && expandedProtocol.phase==='short';
      const freeOpen = expandedProtocol && expandedProtocol.playerId===p.id && expandedProtocol.phase==='free';
      return `<tr class="${i===0?'rank1':''}"><td>${medals[i]||i+1}</td><td>${p.name}</td>${S.teamMode?`<td>${p.team==='A'?'🅰️':'🅱️'}</td>`:''}<td>${charOf(p).name}</td>
        <td>${p.scoreShort} <button class="btn-ghost btn-sm" style="padding:1px 6px;font-size:.6rem" onclick="toggleProtocol('${p.id}','short')">${shortOpen?'접기':'📋'}</button>${categoryBadge(p,'short')}</td>
        <td>${p.freeDQ?'실격':p.scoreFree} <button class="btn-ghost btn-sm" style="padding:1px 6px;font-size:.6rem" onclick="toggleProtocol('${p.id}','free')">${freeOpen?'접기':'📋'}</button>${categoryBadge(p,'free')}</td>
        <td><b>${r.total}</b>${categoryBadge(p,'combined')}</td></tr>${shortOpen?protocolPanel(p,'short'):''}${freeOpen?protocolPanel(p,'free'):''}`;
    }).join('')}
    </table>
    <div class="divider"></div>
    <button class="btn-main" style="width:100%;padding:13px" onclick="restartGame()">${ROOM?'🔁 같은 선수들과 새 게임 시작 (재접속 불필요)':'새 게임 시작'}</button>
    ${todayRankingPanel(10)}
    ${overallBestPanel()}
    ${personalBestsPanel(10)}
  </div>`;
}
function restartGame(){
  const prevRev = (S && S._rev) || 0;
  const prevPlayers = (S && S.players) ? S.players : [];
  const prevTitle = (S && S.roomTitle) || '';
  const prevTeamMode = !!(S && S.teamMode);
  const prevChat = (S && S.chatMessages) || []; // 재시작해도 채팅 로그는 그대로 이어간다 - 예전엔 여기서 빠져서 새 게임 시작할 때마다 채팅이 통째로 사라졌다
  const carriedPlayers = prevPlayers.map(p=>({
    id:p.id, name:p.name, charId:p.charId||null, isAI:!!p.isAI, team:p.team,
    handShort:[], handFree:[], scoreShort:null, scoreFree:null, freeDQ:false, log:[],
    constAdj:0, constAdjCard:0, constAdjJump:0, immuneTokens:0, programState:freshProgramState(),
  }));
  S=freshGameState();
  if(carriedPlayers.length) S.players=carriedPlayers; // same room, same players/seats - no reconnect needed
  S.roomTitle=prevTitle;
  if(prevTeamMode) S.teamMode=true;
  S.chatMessages = prevChat.length>100 ? prevChat.slice(-100) : prevChat;
  S._rev = prevRev + 1; // must be strictly higher so connected peers don't reject this as a stale/tied update
  render();
}

if(typeof window!=='undefined'){
  window.onerror=function(msg,src,line,col,err){
    console.error('uncaught error', msg, err);
    const app=document.getElementById('app');
    if(app){
      const report = crashReportText('전역 오류', String(msg)+(line?' (줄 '+line+')':''), err);
      app.innerHTML = crashPanelHTML(
        '예상치 못한 오류가 발생했어요',
        '방금 누른 동작이 처리되지 못했어요. 아래로 화면을 복구해보세요.',
        report
      );
    }
    return true; // suppress default browser error handling
  };
  // window.onerror only catches synchronous throws - a lot of this app's Firebase/PeerJS calls
  // are async, and a rejected promise with no .catch() used to fail completely silently (no
  // console log the user could screenshot, no crash panel, nothing). This closes that gap.
  window.addEventListener('unhandledrejection', function(ev){
    console.error('unhandled promise rejection', ev.reason);
    const app=document.getElementById('app');
    if(app){
      const reason=ev.reason;
      const report = crashReportText('처리되지 않은 비동기 오류', String(reason && reason.message || reason), reason);
      app.innerHTML = crashPanelHTML(
        '예상치 못한 오류가 발생했어요',
        '백그라운드 작업 중 오류가 발생했어요. 아래로 화면을 복구해보세요.',
        report
      );
    }
  });
}
tryAutoLoginProfile();
applyLang(LANG);
render();
</script>
